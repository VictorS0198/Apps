<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Horarios</title>
<style>
:root{--bg:#f4f2ee;--panel:#fff;--ink:#1f2328;--mute:#6b7075;--line:#e3e0da;--line2:#f0eee9;--soft:#f7f6f3;--acc:#2c5d8a;--acc-ink:#fff;
  --head:#1f2a36;--head-ink:#fff;--head-mute:#9fb0c2;--head-btn:#2c3a49;--head-line:#3d4d5f;
  --selbg:#e8eef5;--selline:#c5d4e4;--warn:#b7791f;--bad:#b23b3b;--ok:#2f7d4f;--okbg:#e1f1e7;--warnbg:#fbefd9;--badbg:#f7e0e0;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--fs:14px;color-scheme:light}
:root[data-theme="oscuro"]{--bg:#15181c;--panel:#1e2227;--ink:#e6e8ea;--mute:#9aa3ab;--line:#30363d;--line2:#272c32;--soft:#252a30;--acc:#6ea8de;--acc-ink:#0f1215;
  --head:#0f1215;--head-ink:#e6e8ea;--head-mute:#8796a6;--head-btn:#1e2329;--head-line:#343b43;--selbg:#22344a;--selline:#3a5a7d;
  --warn:#e0a84a;--bad:#e07a7a;--ok:#6cc08f;--okbg:#1d3326;--warnbg:#3a2e17;--badbg:#3d2222;--s1:#3987e5;--s2:#d95926;--s3:#199e70;color-scheme:dark}
:root[data-theme="sepia"]{--bg:#efe6d3;--panel:#fbf5e8;--ink:#3b2f22;--mute:#7d6c57;--line:#dccdb0;--line2:#ebe0c9;--soft:#f3ead6;--acc:#8a5a2b;--acc-ink:#fff;
  --head:#4a3826;--head-ink:#fbf5e8;--head-mute:#d6c4a6;--head-btn:#5c4631;--head-line:#6e563e;--selbg:#ecdcbd;--selline:#cfb68a}
:root[data-theme="plano"]{--bg:#0f2a4a;--panel:#143559;--ink:#e8f1ff;--mute:#9db7d8;--line:#2b5486;--line2:#1d4572;--soft:#1a4069;--acc:#7fd0ff;--acc-ink:#0a1f38;
  --head:#0a1f38;--head-ink:#e8f1ff;--head-mute:#7fa3cc;--head-btn:#143559;--head-line:#2b5486;--selbg:#1f4d7d;--selline:#4f8ccc;
  --warn:#f2c46b;--bad:#ff8f8f;--ok:#7fe0a8;--okbg:#17432f;--warnbg:#45391b;--badbg:#4a2430;--s1:#3987e5;--s2:#d95926;--s3:#199e70;color-scheme:dark}
:root[data-theme="contraste"]{--bg:#000;--panel:#0a0a0a;--ink:#fff;--mute:#d6d6d6;--line:#8a8a8a;--line2:#3a3a3a;--soft:#1a1a1a;--acc:#ffd400;--acc-ink:#000;
  --head:#000;--head-ink:#fff;--head-mute:#d6d6d6;--head-btn:#000;--head-line:#fff;--selbg:#332b00;--selline:#ffd400;
  --warn:#ffcf4d;--bad:#ff7070;--ok:#5dff9b;--okbg:#00331a;--warnbg:#332600;--badbg:#330000;--s1:#3987e5;--s2:#d95926;--s3:#199e70;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs)}
:root[data-theme="plano"] main{background-image:linear-gradient(rgba(127,208,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(127,208,255,.06) 1px,transparent 1px);background-size:24px 24px}
header{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--head);color:var(--head-ink);flex-wrap:wrap}
header h1{font-size:17px;margin:0 6px 0 0;font-weight:600;letter-spacing:.3px}
header .sub{color:var(--head-mute);font-size:12px}
header .sp{flex:1}
header .sep{width:1px;height:22px;background:var(--head-line);margin:0 4px}
button,select,input,textarea{font:inherit}
button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.hi:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.dan{color:var(--bad)}
header button{background:var(--head-btn);color:var(--head-ink);border-color:var(--head-line)}
header button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.wrap{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 50px)}
aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:14px 6px 6px}
.hi{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px;border:1px solid transparent}
.hi:hover{background:var(--soft)}
.hi.sel{background:var(--selbg);border-color:var(--selline)}
.hi b{display:block;font-size:13.5px}
.hi small{color:var(--mute)}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:9px;margin-left:4px;vertical-align:1px}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}
.hi.gap{opacity:.55;border:1px dashed var(--line);cursor:default}
main{overflow:auto;padding:16px 20px}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border-radius:18px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:15px}
.card p.mute{margin:0 0 12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px}
.meta div small{display:block;color:var(--mute);font-size:11px}
.grid{position:relative;display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.gh{background:var(--soft);font-weight:600;text-align:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.col{position:relative;border-left:1px solid var(--line)}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line2)}
.tl{position:relative}
.tl span{position:absolute;right:6px;font-size:11px;color:var(--mute);transform:translateY(-6px)}
.blk{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer;border-left:4px solid rgba(0,0,0,.25);color:#1b1f24}
.blk:hover{outline:2px solid var(--ink)}
.blk .t{font-weight:600}
.blk .s{opacity:.8;font-size:10.5px}
.blk.no{opacity:.35;background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.6) 6px 12px)}
.blk.lowc::after{content:"?";position:absolute;top:2px;right:5px;font-weight:700;color:#b23b3b}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;background:var(--soft);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute)}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.chain .n{padding:4px 9px;border-radius:14px;font-size:12.5px;border:1px solid var(--line);background:var(--panel);color:#1b1f24}
.chain .n.miss{border-style:dashed;color:var(--mute);background:transparent}
.chain .ar{color:var(--mute)}
.tline{display:grid;gap:8px}
.tl-row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center}
.bar{height:22px;border-radius:5px;background:var(--acc);position:relative;display:flex;overflow:hidden}
.bar i{display:block;height:100%}
dialog{border:none;border-radius:12px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3);background:var(--panel);color:var(--ink)}
dialog form{padding:18px 20px}
dialog h2{margin:0 0 12px;font-size:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mute);gap:3px}
.fg label.full{grid-column:1/-1}
.fg input,.fg select,.fg textarea,textarea,select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--panel);font-size:13.5px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.acts .sp{flex:1}
.empty{padding:30px;text-align:center;color:var(--mute)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--head);color:var(--head-ink);padding:8px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
/* ---- KPI y gráficas ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:block;color:var(--mute);font-size:11.5px}
.kpi b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:11.5px;color:var(--mute)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:14px}
.charts .card{margin:0}
.charts .card.wide{grid-column:1/-1}
.ch-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ch-h button{font-size:12px;padding:3px 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--mute);font-size:11px;font-family:inherit}
svg.ch text.ink{fill:var(--ink)}
svg.ch .grid-l{stroke:var(--line2);stroke-width:1}
svg.ch .axis-l{stroke:var(--line);stroke-width:1}
svg.ch [data-tip]{cursor:default}
svg.ch .hit{fill:transparent}
svg.ch .hit:hover+.mk,svg.ch .mk:hover{filter:brightness(1.12)}
.ch-tabla{margin-top:8px;max-height:260px;overflow:auto}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:280px;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
#tip b{display:block}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border-radius:14px;font-size:12px;padding:3px 10px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
/* ---- calendario ---- */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mon h4{margin:0 0 6px;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mgrid .dw{font-size:10.5px;color:var(--mute);text-align:center;padding:2px 0}
.dd{position:relative;aspect-ratio:1/1;border-radius:6px;font-size:12px;display:flex;align-items:flex-start;justify-content:flex-end;padding:3px 5px;background:transparent;border:1px solid transparent;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
.dd.out{color:var(--mute);opacity:.35;cursor:default}
.dd.clase{background:var(--soft);border-color:var(--line)}
.dd.fer{background:var(--badbg);color:var(--bad);font-weight:600}
.dd.vac{background:var(--warnbg);color:var(--warn)}
.dd.ord{background:var(--selbg);border-color:var(--selline)}
.dd.evd{background:var(--panel);border-color:var(--line)}
.dd.sel{outline:2px solid var(--acc)}
.dd .dots{position:absolute;left:4px;bottom:4px;display:flex;gap:2px}
.dd .dots i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.dd .ev{position:absolute;left:4px;top:4px;width:7px;height:7px;transform:rotate(45deg);background:var(--bad)}
.dd .ev.entrega{background:var(--warn)}.dd .ev.admin{background:var(--mute)}
.clegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:8px 0}
.clegend span{display:inline-flex;align-items:center;gap:5px}
.clegend .k{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.daybox{position:sticky;top:0}
.evl{list-style:none;padding:0;margin:0}
.evl li{padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:8px;background:var(--soft);border:1px solid var(--line);color:var(--mute);margin-right:4px}
/* ---- configuración ---- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th{border:2px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;text-align:left;background:var(--panel)}
.th.on{border-color:var(--acc)}
.th .pv{height:64px;display:grid;grid-template-columns:26% 1fr}
.th .pv i{display:block}
.th .pv .m{padding:8px;display:flex;flex-direction:column;gap:5px}
.th .pv .m em{display:block;height:7px;border-radius:4px}
.th b{display:block;padding:7px 10px;font-size:13px}
.accs{display:flex;gap:8px;flex-wrap:wrap}
.acc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.acc.on{outline:3px solid var(--ink);outline-offset:2px}
.set{display:grid;grid-template-columns:220px 1fr;gap:10px 18px;align-items:center}
.set label{color:var(--mute);font-size:13px}
/* ---- notas ---- */
.fab{position:fixed;right:20px;bottom:20px;z-index:50;width:52px;height:52px;border-radius:50%;font-size:22px;background:var(--acc);color:var(--acc-ink);border:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab span{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;line-height:20px;padding:0 5px}
.fab span:empty{display:none}
.np{position:fixed;z-index:55;width:360px;max-height:70vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.np[hidden]{display:none}
.np-h{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--head);color:var(--head-ink);border-radius:12px 12px 0 0;cursor:move;user-select:none;touch-action:none}
.np-h button{background:transparent;color:var(--head-ink);border-color:transparent;padding:2px 7px}
.np-h .sp{flex:1}
.np-b{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.np textarea{width:100%;resize:vertical;min-height:64px}
.ctx{font-size:11.5px;color:var(--mute)}
.ctx b{color:var(--ink);font-weight:600}
.nota{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
.nota.hecha .tx{text-decoration:line-through;color:var(--mute)}
.nota .tx{white-space:pre-wrap;word-break:break-word;margin:3px 0}
.nota .nh{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mute)}
.nota .nh .sp{flex:1}
.nota .nh button{padding:1px 6px;font-size:11px}
.nota .go{background:none;border:none;padding:0;color:var(--acc);text-decoration:underline;cursor:pointer;font-size:11px}
@media (max-width:820px){.wrap{grid-template-columns:1fr;height:auto}aside{max-height:40vh}.split{grid-template-columns:1fr}.charts{grid-template-columns:1fr}.set{grid-template-columns:1fr}.np{width:calc(100vw - 24px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header,aside,.tabs,.noprint,.fab,.np{display:none!important}.wrap{display:block;height:auto}main{overflow:visible}}
/* ---- exportar ---- */
.go{background:none;border:none;padding:0;color:var(--acc);text-decoration:underline;cursor:pointer;font-size:inherit}
.dzs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.dz{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px;border:2px solid var(--line);border-radius:10px}
.dz.on{border-color:var(--acc)}
.dz b{font-size:13px}.dz small{font-size:11px;color:var(--mute);line-height:1.25}
.dzp{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%;height:34px;padding:4px;border-radius:6px;margin-bottom:4px;background:#fff;border:1px solid #ddd}
.dzp i{border-radius:2px}
.dzp.d-clasico i:nth-child(1){background:#f2c6c6;border-left:3px solid #c06565}.dzp.d-clasico i:nth-child(2){background:#c6e3f2;border-left:3px solid #4f8fb3}.dzp.d-clasico i:nth-child(3){background:#d5f0c6;border-left:3px solid #6aa34d}
.dzp.d-minimal i{background:#fff;border:1px solid #ccc}.dzp.d-minimal i:nth-child(1){border-left:3px solid #b5503f}.dzp.d-minimal i:nth-child(2){border-left:3px solid #3f7fb5}.dzp.d-minimal i:nth-child(3){border-left:3px solid #4f9a3a}
.dzp.d-plano{background:#123a6b;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:6px 6px}.dzp.d-plano i{border:1px solid #fff}
.dzp.d-tarjetas i{border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.2)}.dzp.d-tarjetas i:nth-child(1){background:#fde3e3}.dzp.d-tarjetas i:nth-child(2){background:#e0efff}.dzp.d-tarjetas i:nth-child(3){background:#e6f8dc}
.dzp.d-agenda{grid-template-columns:1fr}.dzp.d-agenda i{height:5px;border-left:3px solid #3f7fb5;background:#eef}
.dzp.d-bn i{border:1px solid #000}.dzp.d-bn i:nth-child(1){background:repeating-linear-gradient(45deg,#0004 0 1px,transparent 1px 4px)}.dzp.d-bn i:nth-child(2){background:radial-gradient(#0005 1px,transparent 1.3px) 0 0/4px 4px}.dzp.d-bn i:nth-child(3){background:#e4e4e4}
.expgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.expgrid small{display:block;color:var(--mute);font-size:11.5px;margin-bottom:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;border-right:1px solid var(--line);padding:5px 10px}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.expchk{margin-top:10px;font-size:13px;gap:14px}
.expctl input:not([type]){padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.pages{--z:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 12px;background:var(--soft);border:1px solid var(--line);border-radius:10px;overflow:auto}
.pages .pg{zoom:var(--z)}
/* hoja */
.pg{position:relative;flex:none;background:#fff;color:#1d2125;box-shadow:0 6px 24px rgba(0,0,0,.18);overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;font-size:8.5pt;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#1d2125;--mute:#5f666d;--line:#d9d6d0;--line2:#ece9e4;--panel:#fff;--soft:#f6f5f2;--acc:#2c5d8a;--bad:#b23b3b;--warn:#a66a12;--badbg:#f7e0e0;--warnbg:#fbefd9;--selbg:#e3ecf6;--selline:#b9cde3}
.pgi{position:absolute;inset:11mm 12mm 13mm;display:flex;flex-direction:column;gap:3.5mm}
.pg.flujo .pgi{position:relative;inset:auto;padding:11mm 12mm 16mm}
.pg.flujo{overflow:visible}
.xpie{position:absolute;left:12mm;right:12mm;bottom:5mm;display:flex;justify-content:space-between;font-size:7pt;color:var(--mute);border-top:.2mm solid var(--line);padding-top:1.5mm}
.xk{display:block;font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.xh{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;border-bottom:.5mm solid var(--ink);padding-bottom:2mm;flex:none}
.xh h2{margin:.5mm 0 0;font-size:16pt;font-weight:650;line-height:1.1}
.xh h2 span{font-weight:400;color:var(--mute)}

// ---- modelo: {horarios:[meta], bloques:[{id_horario,...ROW_KEYS, _id}]}
function fromRows(rows){
  const H = new Map(), B = [];
  rows.forEach((r,i)=>{
    const id = (r.id_horario||"").trim(); if(!id) return;
    if(!H.has(id)){ const m={}; META_KEYS.forEach(k=>m[k]=r[k]??""); H.set(id,m); }
    if(r.materia){ const b={id_horario:id,_id:uid()}; ROW_KEYS.forEach(k=>b[k]=(r[k]??"").toString()); B.push(b); }
  });
  return {horarios:[...H.values()], bloques:B};
}
function toRows(){
  const out=[];
  state.horarios.forEach(h=>{
    const bs = state.bloques.filter(b=>b.id_horario===h.id_horario);
    if(!bs.length){ const r={}; COLS.forEach(k=>r[k]=h[k]??""); out.push(r); }
    bs.forEach(b=>{ const r={}; META_KEYS.forEach(k=>r[k]=h[k]??""); ROW_KEYS.forEach(k=>r[k]=b[k]??""); out.push(r); });
  });
  return out;
}
function uid(){return Math.random().toString(36).slice(2,10)}
function load(){
  let s=null, ver=null;
  try{ s=localStorage.getItem(LS); ver=localStorage.getItem(LS+"_basever"); }catch(e){}
  if(!s){ try{ localStorage.setItem(LS+"_basever",BASE_VER); }catch(e){} return fromRows(BASE); }
  let st; try{ st=JSON.parse(s); }catch(e){ return fromRows(BASE); }
  if(ver!==BASE_VER){ migrar2(st); migrar(st); try{ localStorage.setItem(LS,JSON.stringify(st)); localStorage.setItem(LS+"_basever",BASE_VER); }catch(e){} }
  return st;
}
// Pone al día datos guardados con la base nueva sin pisar lo que editaste
function migrar(st){
  const base=fromRows(BASE);
  const have=new Set(st.horarios.map(h=>h.id_horario));
  base.horarios.forEach(h=>{ if(!have.has(h.id_horario)){ st.horarios.push(h); st.bloques.push(...base.bloques.filter(b=>b.id_horario===h.id_horario)); } });
  CORRECCIONES.forEach(([id,k,de,a])=>{ const h=st.horarios.find(x=>x.id_horario===id); if(h&&h[k]===de) h[k]=a; });
  st.bloques.forEach(b=>{
    if(RENOMBRES[b.materia]) b.materia=RENOMBRES[b.materia];
    const bm=base.bloques.find(x=>x.id_horario===b.id_horario&&x.materia===b.materia);
    ["clave","creditos","calificacion"].forEach(k=>{ if(b[k]===undefined) b[k]=""; if(!b[k]&&bm&&bm[k]) b[k]=bm[k]; });
    if(AULA_FIX[b.aula]) b.aula=AULA_FIX[b.aula];
    if(!b.aula&&bm&&bm.aula) b.aula=bm.aula;
    if(!b.notas&&bm&&bm.notas&&bm.notas!=="Horario pendiente") b.notas=bm.notas;
    if(/^\d+ créditos; horario pendiente$/.test(b.notas||"")) b.notas="Horario pendiente";
  });
}

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const min = t=>{ if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+(m||0); };
const fmtH = m=>(Math.round(m/6)/10)+" h";
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); setTimeout(()=>e.classList.remove("on"),1800); }
function color(name){
  let h=0; for(const c of baseName(name)) h=(h*31+c.charCodeAt(0))>>>0;
  return isDark()?`hsl(${h%360} 48% 72%)`:`hsl(${h%360} 62% 82%)`;
}
// Equivalencias para la seriación (nombre → nombre en la serie)
const ALIAS={}; // Diseño Básico Arquitectónico (1°) y Diseño Arquitectónico I (2°) son materias distintas en el certificado
function baseName(m){
  m=ALIAS[m]||m;
  return (m||"").replace(/^\(CIM\)\s*/i,"").replace(/^TAE\s+/i,"TAE ")
    .replace(/\s+(I{1,3}|IV|V|VI{0,3}|IX|X)$/,"").trim();
}
const ROMAN={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10};
function romanOf(m){ m=ALIAS[m]||m; const x=(m||"").match(/\s(I{1,3}|IV|V|VI{0,3}|IX|X)$/); return x?ROMAN[x[1]]:null; }
function ordenH(a,b){
  const n={"Preparatoria":0,"Idiomas":0.5,"Licenciatura":1};
  return (n[a.nivel]??9)-(n[b.nivel]??9) || (+a.semestre||0)-(+b.semestre||0);
}
function bloquesDe(id){ return state.bloques.filter(b=>b.id_horario===id); }
function estado(h){
  const bs=bloquesDe(h.id_horario);
  if(!bs.length) return ["Vacío","b-bad"];
  if(bs.every(b=>!b.dia)) return ["Sin horario","b-bad"];
  const dudas = bs.filter(b=>b.confianza_dato!=="Alta").length + (h.confianza_periodo!=="Alta"?1:0);
  return dudas?["Por validar","b-warn"]:["Completo","b-ok"];
}

// ---- datos del certificado: créditos y promedio por semestre
function acad(id){
  const m=new Map();
  bloquesDe(id).forEach(b=>{ if(b.cursada!=="Sí") return; const o=m.get(b.materia)||{cr:NaN,ca:NaN};
    if(isNaN(o.cr)) o.cr=parseFloat(b.creditos); if(isNaN(o.ca)) o.ca=parseFloat(b.calificacion); m.set(b.materia,o); });
  const v=[...m.values()], cr=v.filter(x=>!isNaN(x.cr)), ca=v.filter(x=>!isNaN(x.ca));
  return {cred:cr.reduce((s,x)=>s+x.cr,0), nCred:cr.length, prom:ca.length?ca.reduce((s,x)=>s+x.ca,0)/ca.length:null};
}
function validaCert(){
  let n=0; const g=[];
  state.horarios.filter(h=>h.nivel==="Licenciatura").forEach(h=>{
    const seen=new Set();
    bloquesDe(h.id_horario).forEach(b=>{ if(!b.calificacion||seen.has(b.materia)) return; seen.add(b.materia); n++; const c=parseFloat(b.calificacion); if(!isNaN(c)) g.push(c); }); });
  const prom=g.length?g.reduce((s,x)=>s+x,0)/g.length:0, p2=Math.round(prom*100)/100;
  const okN=n===CERT_LIC.n, okP=p2===CERT_LIC.prom;
  const bd=ok=>`<span class="badge ${ok?"b-ok":"b-warn"}" style="margin:0">${ok?"Coincide":"Revisar"}</span>`;
  return `<div class="card"><h3 style="margin:0 0 4px;font-size:15px">Validación contra el certificado (Licenciatura)</h3>
    <p class="mute" style="margin:0 0 8px">Se recalcula con las materias y calificaciones registradas en la app.</p>
    <table><tr><th></th><th>En la app</th><th>Certificado ${esc(CERT_LIC.no)} · ${esc(CERT_LIC.fecha)}</th><th></th></tr>
    <tr><td>Materias con calificación</td><td>${n}</td><td>${CERT_LIC.n}</td><td>${bd(okN)}</td></tr>
    <tr><td>Promedio</td><td>${n?p2.toFixed(2):"—"}</td><td>${CERT_LIC.prom.toFixed(2)}</td><td>${bd(okP)}</td></tr></table></div>`;
}
function horasSem(id){
  return bloquesDe(id).filter(b=>b.dia && b.cursada==="Sí").reduce((s,b)=>s+(min(b.hora_fin)-min(b.hora_inicio)),0);
}

// ======= SIDEBAR =======
function renderSide(){
  const hs=[...state.horarios].sort(ordenH);
  let html="";
  const ORDEN_NIV=["Preparatoria","Idiomas","Licenciatura"];
  for(const nivel of ORDEN_NIV.concat([...new Set(hs.map(h=>h.nivel))].filter(n=>!ORDEN_NIV.includes(n)))){
    const delNivel=hs.filter(h=>h.nivel===nivel);
    const max=Math.max(ESPERADOS[nivel]||0,...delNivel.map(h=>+h.semestre||0));
    if(!max) continue;
    html+=`<h3>${esc(nivel)}</h3>`;
    for(let s=1;s<=max;s++){
      const these=delNivel.filter(h=>+h.semestre===s);
      if(!these.length){ html+=`<div class="hi gap"><b>${s}° semestre</b><small>No encontrado aún</small></div>`; continue; }
      these.forEach(h=>{
        const [t,c]=estado(h);
        html+=`<div class="hi ${h.id_horario===sel?"sel":""}" onclick="sel='${esc(h.id_horario)}';render()">
          <b>${h.nivel==="Idiomas"?esc(bloquesDe(h.id_horario)[0]?.materia||"Curso "+s):s+"°"} ${esc(h.grupo&&h.grupo!=="—"?"· "+h.grupo:"")}<span class="badge ${c}">${t}</span></b>
          <small>${esc(h.periodo||"Periodo ?")}</small></div>`;
      });
    }
  }
  $("#side").innerHTML=html;
}

// ---- Semana
function vSemana(){
  const h=cur(); if(!h){$("#view").innerHTML=`<div class="empty">Elige o crea un horario.</div>`;return;}
  const bs=bloquesDe(h.id_horario).filter(b=>verNoCursadas||b.cursada==="Sí");
  const conDia=bs.filter(b=>b.dia&&b.hora_inicio&&b.hora_fin);
  const sinDia=bs.filter(b=>!b.dia);
  let html=metaCard(h);
  html+=`<div class="row noprint" style="margin-bottom:8px"><label><input type="checkbox" ${verNoCursadas?"checked":""} onchange="verNoCursadas=this.checked;render()"> Mostrar materias no cursadas (TAE / opciones)</label>
    <span class="mute" style="font-size:12px">· Rayado = no cursada · <b style="color:var(--bad)">?</b> = dato por validar · clic en un bloque para editar</span></div>`;
  if(!conDia.length){
    html+=`<div class="card empty">Este semestre todavía no tiene horario por día y hora.${sinDia.length?" Tiene "+sinDia.length+" materias registradas (ver pestaña Materias).":""}</div>`;
  } else {
    const dias=DIAS.filter(d=>d!=="Sábado"||conDia.some(b=>b.dia==="Sábado"));
    let t0=Math.min(...conDia.map(b=>min(b.hora_inicio))), t1=Math.max(...conDia.map(b=>min(b.hora_fin)));
    t0=Math.floor(t0/60)*60; t1=Math.ceil(t1/60)*60;
    const PX=cfg.alto, H=(t1-t0)*PX;
    html+=`<div class="grid" style="grid-template-columns:56px repeat(${dias.length},1fr)"><div class="gh"></div>${dias.map(d=>`<div class="gh">${d}</div>`).join("")}`;
    html+=`<div class="tl" style="height:${H}px">`;
    for(let m=t0;m<=t1;m+=60) html+=`<span style="top:${(m-t0)*PX}px">${String(m/60).padStart(2,"0")}:00</span>`;
    html+=`</div>`;
    for(const d of dias){
      html+=`<div class="col" style="height:${H}px">`;
      for(let m=t0;m<t1;m+=60) html+=`<div class="hr" style="top:${(m-t0)*PX}px"></div>`;
      const ds=conDia.filter(b=>b.dia===d);
      ds.forEach(b=>{
        const a=min(b.hora_inicio), z=min(b.hora_fin);
        const solapes=ds.filter(o=>o!==b&&min(o.hora_inicio)<z&&min(o.hora_fin)>a);
        let lane=0,lanes=1;
        if(solapes.length){ const grupo=[b,...solapes].sort((x,y)=>x._id<y._id?-1:1); lanes=grupo.length; lane=grupo.indexOf(b); }
        const w=100/lanes;
        html+=`<div class="blk ${b.cursada!=="Sí"?"no":""} ${b.confianza_dato!=="Alta"?"lowc":""}" title="${esc(b.notas)}"
          style="top:${(a-t0)*PX+1}px;height:${(z-a)*PX-2}px;background:${color(b.materia)};left:calc(${lane*w}% + 3px);right:auto;width:calc(${w}% - 6px)"
          onclick="editarBloque('${b._id}')"><div class="t">${esc(b.materia)}</div>
          <div class="s">${esc(b.hora_inicio)}–${esc(b.hora_fin)}${b.aula?" · "+esc(b.aula):""}</div>
          ${b.profesor?`<div class="s">${esc(b.profesor)}</div>`:""}</div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  }
  if(sinDia.length&&conDia.length) html+=`<div class="card" style="margin-top:14px"><b>Sin día/hora:</b> ${sinDia.map(b=>esc(b.materia)).join(", ")}</div>`;
  $("#view").innerHTML=html;
}

// ======= IMPORT / EXPORT =======
function csvEsc(v){ v=String(v??""); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function download(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
const stamp=()=>new Date().toISOString().slice(0,10);
function exportCSV(){ const rows=toRows(); download(`horarios_maestro_${stamp()}.csv`,"﻿"+[COLS.join(","),...rows.map(r=>COLS.map(k=>csvEsc(r[k])).join(","))].join("\n"),"text/csv"); }
function exportJSON(){ download(`horarios_${stamp()}.json`,JSON.stringify(toRows(),null,1),"application/json"); }
function parseCSV(t){
  t=t.replace(/^﻿/,""); const sep=(t.split("\n")[0].match(/;/g)||[]).length>(t.split("\n")[0].match(/,/g)||[]).length?";":",";
  const out=[]; let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===sep){row.push(cell);cell="";}
    else if(c==="\n"){row.push(cell.replace(/\r$/,""));out.push(row);row=[];cell="";} else cell+=c; }
  if(cell||row.length){row.push(cell);out.push(row);}
  const hd=out.shift().map(s=>s.trim()); return out.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(hd.map((k,i)=>[k,r[i]??""])));
}
function importar(file){ if(!file) return; const rd=new FileReader();
  rd.onload=()=>{ try{
      const rows=file.name.toLowerCase().endsWith(".json")?JSON.parse(rd.result):parseCSV(rd.result);
      if(!rows.length||!("id_horario" in rows[0])) throw new Error("No encontré la columna id_horario");
      const inc=fromRows(rows);
      const reemplazar=confirm(`Archivo con ${inc.horarios.length} horarios y ${inc.bloques.length} bloques.\n\nAceptar = REEMPLAZAR todo\nCancelar = COMBINAR (los horarios con el mismo id se sustituyen)`);
      if(reemplazar) state=inc;
      else { const ids=new Set(inc.horarios.map(h=>h.id_horario));
        state.horarios=state.horarios.filter(h=>!ids.has(h.id_horario)).concat(inc.horarios);
        state.bloques=state.bloques.filter(b=>!ids.has(b.id_horario)).concat(inc.bloques); }
      sel=state.horarios[0]?.id_horario; save(); render(); toast("Importado");
    }catch(e){ alert("No se pudo importar: "+e.message); } };
  rd.readAsText(file,"utf-8"); }
function restaurar(){ if(!confirm("¿Volver a los datos con que vino la app? Se perderán tus cambios (exporta antes si los quieres).")) return;
  state=fromRows(BASE); sel=state.horarios[0]?.id_horario; save(); render(); }


// ======= MIGRACIÓN 2 (pone al día datos guardados con versiones anteriores) =======
function fpOf(bs){
  const s=bs.map(b=>[b.materia,b.dia,b.hora_inicio,b.hora_fin,b.aula,b.profesor,b.tipo,b.cursada,b.confianza_dato].map(x=>x||"").join("|")).sort().join("\n");
  let h=5381; for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return h.toString(36);
}
function migrar2(st){
  const base=fromRows(BASE); const conservados=[];
  base.horarios.forEach(hb=>{
    const h=st.horarios.find(x=>x.id_horario===hb.id_horario); if(!h) return;
    const pm=PRIOR_META[hb.id_horario]||{};
    META_KEYS.forEach(k=>{ if(h[k]!==hb[k] && (pm[k]||[]).includes(h[k]??"")) h[k]=hb[k]; });
    const mine=st.bloques.filter(b=>b.id_horario===hb.id_horario), nuevos=base.bloques.filter(b=>b.id_horario===hb.id_horario);
    const fp=fpOf(mine);
    if(fp===fpOf(nuevos)) return;
    if((PRIOR_FP[hb.id_horario]||[]).includes(fp)){
      st.bloques=st.bloques.filter(b=>b.id_horario!==hb.id_horario).concat(nuevos);
    } else {
      // Editaste este horario: se conservan tus bloques y solo se agregan los nuevos
      const key=b=>[b.materia,b.dia,b.hora_inicio].join("|"), have=new Set(mine.map(key));
      const conDia=new Set(nuevos.filter(b=>b.dia).map(b=>b.materia));
      const viejosSinDia=mine.filter(b=>!b.dia&&conDia.has(b.materia));
      nuevos.forEach(b=>{ if(have.has(key(b))) return; const v=viejosSinDia.find(x=>x.materia===b.materia); if(v&&v.profesor&&!b.profesor) b.profesor=v.profesor; st.bloques.push(b); });
      st.bloques=st.bloques.filter(b=>!viejosSinDia.includes(b));
      conservados.push((h.nivel==="Preparatoria"?"Prepa ":h.nivel==="Licenciatura"?"Uni ":h.nivel+" ")+h.semestre+"°");
    }
  });
  if(conservados.length) setTimeout(()=>toast("Datos actualizados. Conservé tus cambios en: "+conservados.join(", ")),700);
}

const DIA_N={Domingo:0,Lunes:1,Martes:2,"Miércoles":3,Jueves:4,Viernes:5,"Sábado":6};
const pd=s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fLarga=s=>cap(pd(s).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"}));
const fCorta=s=>pd(s).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"});
let calDia=null;
function calFin(c){ return c.ord?c.ord[1]:c.fin; }
function diaEstado(c,s){
  if(s<c.inicio||s>calFin(c)) return "out";
  if(c.sinClases) return "libre";
  if(c.fer.includes(s)) return "fer";
  if(c.vac.some(([a,b])=>s>=a&&s<=b)) return "vac";
  if(c.ord&&s>=c.ord[0]&&s<=c.ord[1]) return "ord";
  if(s>c.fin) return "out";
  return "clase";
}
function bloquesDia(id,c,s){
  const wd=pd(s).getDay(), r=c.rangos||{};
  return bloquesDe(id).filter(b=>b.dia&&b.hora_inicio&&b.cursada==="Sí"&&DIA_N[b.dia]===wd&&(!r[b.materia]||(s>=r[b.materia][0]&&s<=r[b.materia][1])))
    .sort((a,b)=>min(a.hora_inicio)-min(b.hora_inicio));
}
function sesionesDia(id,c,s){ return diaEstado(c,s)==="clase"?bloquesDia(id,c,s):[]; }
function eventosDia(c,s){ return c.ev.filter(([a,b])=>b?(s>=a&&s<=b):s===a); }
function* diasEntre(a,b){ for(let d=pd(a);ymd(d)<=b;d.setDate(d.getDate()+1)) yield ymd(d); }
function resumenCal(id,c){
  const per={}; let dias=0, ses=0, mins=0; const semanas=new Set(); let perdidas=0;
  for(const s of diasEntre(c.inicio,c.fin)){
    const plan=bloquesDia(id,c,s); const est=diaEstado(c,s);
    plan.forEach(b=>{ const a=per[b.materia]??={plan:0,real:0,min:0}; a.plan++; if(est==="clase"){ a.real++; a.min+=min(b.hora_fin)-min(b.hora_inicio); } });
    if(est==="clase"&&plan.length){ dias++; ses+=plan.length; mins+=plan.reduce((t,b)=>t+min(b.hora_fin)-min(b.hora_inicio),0);
      const d=pd(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); semanas.add(ymd(d)); }
    if(est!=="clase"&&plan.length) perdidas++;

  return {per,dias,ses,mins,semanas:semanas.size,perdidas};
}

  const evs=c.ev.concat(extra).sort((a,b)=>a[0]<b[0]?-1:1);
  return `${semCab(h)}<div class="xmeses" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${meses.join("")}</div>
    <div class="xleg"><span><i class="c"></i>Día con clase</span><span><i class="f"></i>Feriado</span><span><i class="v"></i>Vacaciones</span>${c.ord?`<span><i class="r"></i>Ordinarios</span>`:""}<span><i class="ev"></i>Examen o entrega</span></div>
    <ul class="xevs">${evs.map(e=>`<li><b>${esc(fCorta(e[0]))}${e[1]?" – "+esc(fCorta(e[1])):""}</b> ${esc(e[2])}</li>`).join("")}</ul>`;
}
function hojaResumen(hs,o){
  return `<div class="xh"><div><span class="xk">Resumen</span><h2>Todos los semestres</h2></div><p>${hs.length} horarios en este reporte</p></div>
  <table class="xt xres"><tr><th>Semestre</th><th>Periodo</th><th>Institución</th><th class="n">Horas/sem.</th><th class="n">Materias</th><th class="n">Créditos</th><th class="n">Promedio</th><th>Estado</th></tr>${hs.map(h=>{
    const ms=materiasDe(h.id_horario), cal=ms.filter(x=>!isNaN(x.cal)), cr=ms.reduce((s,x)=>s+(isNaN(x.cred)?0:x.cred),0), hsem=horasSem(h.id_horario);
    return `<tr><td><b>${esc(labH(h))}</b></td><td>${esc(h.periodo)}</td><td>${esc(h.institucion)}</td><td class="n">${hsem?fmtH(hsem):"—"}</td><td class="n">${ms.length}</td><td class="n">${cr||"—"}</td><td class="n">${cal.length?(cal.reduce((s,x)=>s+x.cal,0)/cal.length).toFixed(2):"—"}</td><td>${esc(estado(h)[0])}</td></tr>`; }).join("")}</table>
  <p class="xnota">Estado: «Completo» = horario con día y hora confirmado por tus documentos; «Por validar» = hay horas probables; «Sin horario» = solo materias.</p>`;
}
function hojaPortada(o,hs,indice){
  const lic=hs.filter(h=>h.nivel==="Licenciatura").flatMap(h=>materiasDe(h.id_horario)).filter(x=>!isNaN(x.cal));
  const anios=hs.map(h=>(h.periodo||"").match(/\d{4}/)?.[0]).filter(Boolean).sort();
  return `<div class="xport"><span class="xk">Mis Horarios</span><h1>${esc(o.titulo)}</h1><p class="xaut">${esc(o.autor)}</p>
    <p class="xsub">${[...new Set(hs.map(h=>NIV_NOMBRE[h.nivel]||h.nivel))].join(", ")}${anios.length?` · ${anios[0]}–${anios[anios.length-1]}`:""}</p>
    <div class="xkpis"><div><b>${hs.length}</b>horarios</div><div><b>${hs.filter(h=>bloquesDe(h.id_horario).some(b=>b.dia)).length}</b>con día y hora</div>${lic.length?`<div><b>${(lic.reduce((s,x)=>s+x.cal,0)/lic.length).toFixed(2)}</b>promedio licenciatura</div>`:""}</div>
    <h3>Contenido</h3><ol class="xidx">${indice.map(([t,p])=>`<li><span>${esc(t)}</span><i></i><b>${p}</b></li>`).join("")}</ol>
    <p class="xfecha">Generado el ${esc(new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"}))}</p></div>`;
}
function capturaGraficas(){
  const vw=$("#view"); vGraficas(); const ch=vw.querySelector(".charts"); if(!ch) return "";
  ch.querySelectorAll(".ch-h button,.chips").forEach(e=>e.remove()); return ch.outerHTML;
}
function construirHojas(o){
  const hs=exIds(o).map(id=>state.horarios.find(h=>h.id_horario===id)).filter(Boolean);
  const [W,H]=dimsEx(o); const hojas=[], indice=[];
  const hoja=(html,cls="")=>{ hojas.push({html,cls}); return hojas.length; };
  if(o.portada) hoja("","portada");
  if(o.resumen){ indice.push(["Resumen de todos los semestres",hojas.length+1]); hoja(hojaResumen(hs,o)); }
  const conDia=h=>bloquesEx(h,o).some(b=>b.dia);
  const mens=[];
  if(o.semanal){
    if(o.porHoja===2){
      const buf=hs.filter(conDia); for(let i=0;i<buf.length;i+=2){ indice.push([labH(buf[i])+(buf[i+1]?" y "+labH(buf[i+1]):""),hojas.length+1]); hoja(hojaDoble(buf[i],buf[i+1],o),"doble"); }
      if(o.sinHorario==="lista") hs.filter(h=>!conDia(h)).forEach(h=>{ indice.push([labH(h)+" (lista)",hojas.length+1]); hoja(hojaSemana(h,o)); });
      if(o.mensual) hs.filter(h=>CAL[h.id_horario]).forEach(h=>{ indice.push(["Calendario · "+labH(h),hojas.length+1]); hoja(hojaMensual(h,o),"mensual"); });
    } else {
      hs.forEach(h=>{
        if(conDia(h)||o.sinHorario==="lista"){ indice.push([labH(h)+(labH(h).includes(h.periodo||"~")?"":" · "+(h.periodo||"")),hojas.length+1]); hoja(hojaSemana(h,o)); }
        if(o.mensual&&CAL[h.id_horario]) hoja(hojaMensual(h,o),"mensual");
      });
    }
  } else if(o.mensual){ hs.filter(h=>CAL[h.id_horario]).forEach(h=>{ indice.push(["Calendario · "+labH(h),hojas.length+1]); hoja(hojaMensual(h,o),"mensual"); }); }
  let graf=""; if(o.graficas){ graf=capturaGraficas(); indice.push(["Gráficas",hojas.length+1]); }
  if(o.portada) hojas[0].html=hojaPortada(o,hs,indice);
  const N=hojas.length+(graf?1:0);
  const pie=n=>`<div class="xpie"><span>${esc(o.titulo)} · ${esc(o.autor)}</span><span>${n} / ${N}</span></div>`;
  const out=hojas.map((p,i)=>`<section class="pg d-${o.diseno} ${o.orient==="h"?"hz":"vt"} ${p.cls}" style="width:${W}mm;height:${H}mm"><div class="pgi">${p.html}</div>${p.cls==="portada"?"":pie(i+1)}</section>`);
  if(graf) out.push(`<section class="pg flujo d-${o.diseno==="plano"?"clasico":o.diseno} ${o.orient==="h"?"hz":"vt"}" style="width:${W}mm;min-height:${H}mm"><div class="pgi"><div class="xh"><div><span class="xk">Gráficas</span><h2>Tu historial en números</h2></div></div>${graf}</div>${pie(N)}</section>`);
  return {html:out.join(""),n:N};
}
function vExportar(){
  const o=ex(); const R=construirHojas(o); const [W,H]=dimsEx(o);
  const hs=[...state.horarios].sort(ordenH), ids=exIds(o);
  const seg=(k,ops)=>`<div class="seg">${ops.map(([v,t])=>`<button class="${o[k]===v?"on":""}" onclick="setEx('${k}',${typeof v==="number"?v:`'${v}'`})">${t}</button>`).join("")}</div>`;
  const chk=(k,t)=>`<label><input type="checkbox" ${o[k]?"checked":""} onchange="setEx('${k}',this.checked)"> ${t}</label>`;
  const dis=DISENOS.map(([k,n,d])=>`<button class="dz ${o.diseno===k?"on":""}" onclick="setEx('diseno','${k}')" aria-pressed="${o.diseno===k}"><span class="dzp d-${k}"><i></i><i></i><i></i></span><b>${n}</b><small>${d}</small></button>`).join("");
  $("#view").innerHTML=`<div class="card noprint expctl">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3>Exportar reporte en PDF</h3><p class="mute" style="margin:0 0 10px">Arma el reporte, revísalo en la vista previa y guárdalo como PDF.</p></div>
      <div class="row"><span class="mute">${R.n} hoja${R.n===1?"":"s"} · ${esc(PAPEL[o.papel][2])} ${o.orient==="h"?"horizontal":"vertical"}</span><button class="pri" onclick="exportarPDF()">Exportar PDF</button></div></div>
    <div class="dzs">${dis}</div>
    <div class="expgrid">
      <div><small>Orientación</small>${seg("orient",[["h","Horizontal"],["v","Vertical"]])}</div>
      <div><small>Papel</small>${seg("papel",[["carta","Carta"],["a4","A4"],["oficio","Oficio"],["tabloide","Tabloide"]])}</div>
      <div><small>Horarios por hoja</small>${seg("porHoja",[[1,"Uno"],[2,"Dos"]])}</div>
      <div><small>Semestres sin horario</small>${seg("sinHorario",[["lista","Como lista"],["omitir","Omitir"]])}</div>
    </div>
    <div class="row expchk">${chk("portada","Portada e índice")}${chk("resumen","Resumen")}${chk("semanal","Horarios semanales")}${chk("lista","Lista de materias")}${chk("mensual","Calendarios mensuales")}${chk("graficas","Gráficas")}${chk("noCursadas","Materias no cursadas")}</div>
    <div class="row" style="margin-top:8px"><label class="mute" style="font-size:12.5px">Título <input value="${esc(o.titulo)}" onchange="setEx('titulo',this.value)" style="width:220px"></label>
      <label class="mute" style="font-size:12.5px">Nombre <input value="${esc(o.autor)}" onchange="setEx('autor',this.value)" style="width:260px"></label></div>
    <div style="margin-top:10px"><small class="mute">Semestres (${ids.length} de ${hs.length}) ·
      <button class="go" onclick="selEx('todos')">todos</button> · <button class="go" onclick="selEx('conHorario')">solo con horario</button> · <button class="go" onclick="selEx('lic')">licenciatura</button> · <button class="go" onclick="selEx('bach')">bachillerato</button> · <button class="go" onclick="selEx('ninguno')">ninguno</button></small>
      <div class="chips" style="margin-top:6px">${hs.map(h=>`<button class="${ids.includes(h.id_horario)?"on":""}" onclick="togEx('${esc(h.id_horario)}')">${esc(labH(h))}</button>`).join("")}</div></div>
    <p class="mute" style="font-size:12px;margin:10px 0 0">Al exportar se abre la ventana de impresión: en «Destino» elige <b>Guardar como PDF</b>. Si no salen los colores, activa <b>Gráficos de fondo</b> en «Más opciones».</p>
  </div>
  <div class="pages" id="pages">${R.html||`<div class="empty">Elige al menos un semestre y una sección.</div>`}</div>`;
  ajustarZoom();
  let st=$("#pgSize"); if(!st){ st=document.createElement("style"); st.id="pgSize"; document.head.appendChild(st); }
  st.textContent=`@page{size:${W}mm ${H}mm;margin:0}`;
}
function ajustarZoom(){ const p=$("#pages"); if(!p) return; const o=ex(), [W]=dimsEx(o), px=W*3.7795; const z=Math.min(1,(p.clientWidth-24)/px); p.style.setProperty("--z",z>0?z:1); }
window.addEventListener("resize",()=>{ if(tab==="exportar") ajustarZoom(); });
function exportarPDF(){
  const o=ex(), t=document.title; document.title=`${o.titulo} - ${stamp()}`;
  document.body.classList.add("exportando");
  try{ window.print(); } finally { document.body.classList.remove("exportando"); document.title=t; }
}

aplicarCfg();
render();
</script>
