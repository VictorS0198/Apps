<script>
'use strict';
/* ===== DOMINIO (puro, sin I/O) ===== */
const LB=0.45359237;
const Units={toKg:(v,u)=>u==='lb'?v*LB:v,fromKg:(k,u)=>u==='lb'?k/LB:k,r:n=>Math.round(n*100)/100};
const LOAD={total:'Total',per_hand:'c/u',per_side:'por lado',bodyweight:'Peso corporal'};
const TYPES={machine:'Máquina',cable:'Polea',barbell:'Barra',dumbbell:'Mancuernas',bodyweight:'Peso corporal',cardio:'Cardio',other:'Otro'};
const Calc={
 effKg:s=>s.weight_kg*(s.load_mode==='per_hand'||s.load_mode==='per_side'?2:1),
 volume:s=>Calc.effKg(s)*(s.reps||0),
 e1rm:(kg,r)=>r<=1?kg:kg*(1+r/30)
};
const Val={
 set(s){if(s.load_mode!=='bodyweight'&&!(s.weight_kg>0))throw Error('El peso debe ser mayor a 0.');if(!(s.reps>=0))throw Error('Las repeticiones deben ser 0 o más.')},
 exercise(e){if(!e.name.trim())throw Error('El ejercicio necesita un nombre.')}
};
/* ===== PERSISTENCIA (IndexedDB + migraciones) ===== */
const DATA_VERSION=3,APP_VERSION='0.4.1';
const CAL_MIN=2025,CAL_MAX=2100;
const STORES_V1=['settings','gyms','muscle_groups','exercises','workouts','workout_exercises','sets'];
const STORES=[...STORES_V1,'attendance','timers','app_notes'];
const MIGRATIONS={1:d=>STORES_V1.forEach(n=>d.createObjectStore(n,{keyPath:n==='settings'?'key':'id'})),
 2:d=>['attendance','timers'].forEach(n=>d.createObjectStore(n,{keyPath:'id'})),
 3:d=>d.createObjectStore('app_notes',{keyPath:'id'})};
let db;
const openDb=()=>new Promise((ok,no)=>{const r=indexedDB.open('fitness_tracker',DATA_VERSION);
 r.onupgradeneeded=e=>{for(let v=e.oldVersion+1;v<=e.newVersion;v++)MIGRATIONS[v](r.result)};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(s,m,f)=>new Promise((ok,no)=>{const r=f(db.transaction(s,m).objectStore(s));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const now=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36).padStart(9,'0')+Math.random().toString(36).slice(2,8);
const Repo={
 raw:s=>tx(s,'readonly',o=>o.getAll()),
 all:async s=>(await Repo.raw(s)).filter(x=>!x.deleted_at),
 get:(s,id)=>tx(s,'readonly',o=>o.get(id)),
 put:(s,o)=>{const t=now();o.created_at=o.created_at||t;o.updated_at=t;return tx(s,'readwrite',x=>x.put(o))},
 del:async(s,id)=>{const o=await Repo.get(s,id);o.deleted_at=now();await Repo.put(s,o)}
};
/* ===== SERVICIOS ===== */
const Ex={
 async save(e){Val.exercise(e);e.name=e.name.trim();if(!e.id)Object.assign(e,{id:uid(),active:true,source:'app'});await Repo.put('exercises',e)},
 async toggle(id){const e=await Repo.get('exercises',id);e.active=!e.active;await Repo.put('exercises',e)}
};
const W={
 async active(){return(await Repo.all('workouts')).find(w=>w.status==='active')},
 async start(gym_id){if(await W.active())throw Error('Ya hay un entrenamiento activo.');const t=new Date();
  const w={id:uid(),date:ymd(t),started_at:t.toISOString(),ended_at:null,duration_s:0,gym_id,routine_id:null,status:'active',notes:'',source:'app'};await Repo.put('workouts',w);await Att.checkIn(gym_id,w.id,'workout')},
 async exs(wid){return(await Repo.all('workout_exercises')).filter(x=>x.workout_id===wid).sort((a,b)=>a.position-b.position)},
 async sets(weid){return(await Repo.all('sets')).filter(x=>x.workout_exercise_id===weid).sort((a,b)=>a.set_number-b.set_number)},
 async last(exId,wid){const ws=(await Repo.all('workouts')).filter(w=>w.status==='completed'&&w.id!==wid).sort((a,b)=>b.started_at.localeCompare(a.started_at));
  const wes=await Repo.all('workout_exercises');
  for(const w of ws){const we=wes.find(x=>x.workout_id===w.id&&x.exercise_id===exId);if(we)return{date:w.date,sets:await W.sets(we.id)}}return null},
 async addEx(wid,exId){const ex=await Repo.get('exercises',exId);const mg=await Repo.get('muscle_groups',ex.muscle_id);
  const we={id:uid(),workout_id:wid,exercise_id:exId,position:(await W.exs(wid)).length,exercise_name_snapshot:ex.name,primary_muscle_snapshot:mg?mg.name:'',notes:''};
  await Repo.put('workout_exercises',we);await W.addSet(we.id)},
 async addSet(weid){const we=await Repo.get('workout_exercises',weid);const ex=await Repo.get('exercises',we.exercise_id);
  const cur=await W.sets(weid);let t=cur[cur.length-1];
  if(!t){const l=await W.last(we.exercise_id,we.workout_id);t=l&&l.sets[0]}
  await Repo.put('sets',{id:uid(),workout_exercise_id:weid,set_number:cur.length+1,
   weight_kg:t?t.weight_kg:0,input_value:t?t.input_value:0,input_unit:t?t.input_unit:S.cfg.units,
   load_mode:t?t.load_mode:ex.load_mode,reps:t?t.reps:0,rir:null,rpe:null,rest_s:null,notes:'',is_estimated:false,done:false,completed_at:null})},
 async setVal(id,f,v){const s=await Repo.get('sets',id);
  if(f==='load_mode')s.load_mode=v;
  else if(f==='input_value'){const n=parseFloat(v);if(isNaN(n)||n<0)throw Error('Peso inválido.');s.input_value=n;s.input_unit=S.cfg.units;s.weight_kg=Units.toKg(n,s.input_unit)}
  else{const n=v===''?null:parseFloat(v);if(f==='reps'&&!(n>=0))throw Error('Las repeticiones deben ser 0 o más.');s[f]=n}
  await Repo.put('sets',s)},
 async delSet(id){const s=await Repo.get('sets',id);await Repo.del('sets',id);
  (await W.sets(s.workout_exercise_id)).forEach((x,i)=>{if(x.set_number!==i+1){x.set_number=i+1;Repo.put('sets',x)}})},
 async delEx(weid){for(const s of await W.sets(weid))await Repo.del('sets',s.id);await Repo.del('workout_exercises',weid)},
 async move(weid,d){const we=await Repo.get('workout_exercises',weid);const l=await W.exs(we.workout_id);const i=l.findIndex(x=>x.id===weid),j=i+d;
  if(j<0||j>=l.length)return;[l[i].position,l[j].position]=[l[j].position,l[i].position];await Repo.put('workout_exercises',l[i]);await Repo.put('workout_exercises',l[j])},
 async finish(w){const l=await W.exs(w.id);if(!l.length)throw Error('Agrega al menos un ejercicio o descarta el entrenamiento.');
  for(const we of l)for(const s of await W.sets(we.id)){try{Val.set(s)}catch(e){throw Error(we.exercise_name_snapshot+', serie '+s.set_number+': '+e.message)}}
  for(const we of l)for(const s of await W.sets(we.id))if(s.done!==true){s.done=true;await Repo.put('sets',s)}
  w.ended_at=now();w.duration_s=Math.round((Date.parse(w.ended_at)-Date.parse(w.started_at))/1000);w.status='completed';await Repo.put('workouts',w);
  await Att.out(w.id);Rest.stop();
  const d=await W.detail(w.id),cur=Rec.best(d.flatMap(we=>we.sets.map(s=>({exId:we.exercise_id,date:w.date,s})))),bef=Rec.best(await history(w.id));
  return Object.keys(cur).filter(k=>bef[k]&&bef[k].e&&cur[k].e&&cur[k].e.e1>bef[k].e.e1+1e-6).length},
 async discard(w){w.status='discarded';await Repo.put('workouts',w);await Att.drop(w.id);Rest.stop()},
 async toggle(id){const s=await Repo.get('sets',id);
  if(s.done){s.done=false;s.completed_at=null;await Repo.put('sets',s);return}
  Val.set(s);s.done=true;s.completed_at=now();await Repo.put('sets',s);
  const prev=(await W.sets(s.workout_exercise_id)).find(x=>x.set_number===s.set_number-1);
  if(prev&&prev.completed_at){const d=Math.round((Date.parse(s.completed_at)-Date.parse(prev.completed_at))/1000);if(d>0&&d<3600){prev.rest_s=d;await Repo.put('sets',prev)}}
  Rest.start(S.cfg.rest,'Descanso')},
 async detail(wid){const l=await W.exs(wid);for(const we of l)we.sets=await W.sets(we.id);return l}
};
/* ===== ASISTENCIA, TIEMPOS, RÉCORDS, RESPALDO ===== */
const DEFAULT_TYPES=['Empuje (pecho, hombro, tríceps)','Jalón (espalda, bíceps)','Pierna','Core','Cardio','Full body','Otro'];
const adate=r=>r.date||ymd(new Date(r.check_in));
const stripA=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const hhmm=d=>{const t=new Date(d);return pad(t.getHours())+':'+pad(t.getMinutes())};
const isoAt=(d,t)=>new Date(`${d}T${t||'12:00'}:00`).toISOString();
function parseDate(s){s=String(s||'').trim();let m=/^(\d{4})[-\/. ](\d{1,2})[-\/. ](\d{1,2})$/.exec(s),y,mo,d;
 if(m){y=+m[1];mo=+m[2];d=+m[3]}else if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(s))){d=+m[1];mo=+m[2];y=+m[3]}else return null;
 const t=new Date(y,mo-1,d);return t.getFullYear()===y&&t.getMonth()===mo-1&&t.getDate()===d?`${y}-${pad(mo)}-${pad(d)}`:null}
function parseTime(s){s=String(s||'').trim().toLowerCase();if(!s)return'';const m=/^(\d{1,2})[:.](\d{2})\s*(a\.?\s?m\.?|p\.?\s?m\.?)?$/.exec(s);if(!m)return null;
 let hr=+m[1];const mi=+m[2];if(m[3]){if(m[3][0]==='p'&&hr<12)hr+=12;if(m[3][0]==='a'&&hr===12)hr=0}
 return hr>23||mi>59?null:pad(hr)+':'+pad(mi)}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const first=t.split(/\r?\n/)[0],d=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
 const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===d){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}
  else c+=ch}
 r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
const toCSV=rows=>rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\r\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
const IMPF=[['fecha','Fecha *',['fecha','date']],['hora','Hora de entrada',['hora_entrada','hora','entrada','hora de entrada']],['salida','Hora de salida',['hora_salida','salida','hora de salida']],
 ['tipo','Tipo de sesión',['tipo_sesion','tipo de sesion','tipo','sesion','rutina']],['extra','Tipo adicional',['tipo_adicional','adicional']],['energia','Energía',['energia']],
 ['evidencia','Evidencia',['evidencia']],['conf','Confirmación',['confirmacion']],['notas','Notas',['notas','nota','notes']],['obs','Observaciones',['observaciones','observacion']]];
async function impAnalyze(){const I=S.imp,byDate={},seen={},out={nuevos:[],dups:[],errs:[]};
 (await Repo.all('attendance')).forEach(r=>{(byDate[adate(r)]=byDate[adate(r)]||[]).push(r)});
 I.rows.forEach((row,i)=>{const get=k=>I.map[k]>=0?String(row[I.map[k]]==null?'':row[I.map[k]]).trim():'';
  const date=parseDate(get('fecha')),st=parseTime(get('hora')),en=parseTime(get('salida'));
  const err=!date?'Fecha inválida o vacía':st===null?'Hora de entrada inválida':en===null?'Hora de salida inválida':(st&&en&&en<st)?'La salida es antes de la entrada':'';
  const ev=get('evidencia');let notes=[get('notas'),get('obs')].filter(Boolean).join(' · ');
  if(!notes){const m=/texto:\s*(.+)$/i.exec(ev);if(m)notes=m[1].trim()}
  const e2=parseInt(get('energia'),10);
  const rec={line:i+2,date,start:st||'',end:en||'',type:get('tipo'),extra:get('extra'),energy:e2>=1&&e2<=5?e2:null,evidence:ev,confirmed:get('conf'),notes};
  if(err){out.errs.push({...rec,err});return}
  if(byDate[date]||seen[date]){rec.existing=byDate[date]?byDate[date][0]:null;out.dups.push(rec)}else out.nuevos.push(rec);
  seen[date]=true});
 return out}
const Bit={async save(f){
