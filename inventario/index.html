<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cuarto · Inventario</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<meta name="theme-color" content="#1C2430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: barra superior "chrome" fija oscura + vistas en una columna (teléfono) o con barra lateral (escritorio).
   Los colores se derivan de un tono de paleta (--h/--hs) y un color de acento (--tag) que el usuario elige en Ajustes. */
:root{
  --h:215; --hs:14%;
  --bg:hsl(var(--h) var(--hs) 94%); --surface:hsl(var(--h) 30% 100%); --surface2:hsl(var(--h) var(--hs) 97%);
  --ink:hsl(var(--h) 26% 14%); --ink2:hsl(var(--h) 14% 33%); --ink3:hsl(var(--h) 9% 50%); --line:hsl(var(--h) 16% 86%);
  --chrome:hsl(var(--h) 28% 15%); --chrome2:hsl(var(--h) 22% 22%); --chrome-ink:#FFFFFF; --chrome-ink2:hsl(var(--h) 18% 80%);
  --tag:#F2C230; --tag-ink:#231C00;
  --ok:#2E7D5B; --warn:#A66A12; --bad:#C2413A; --info:#2F6FB3; --c2:hsl(var(--h) 30% 55%);
  --radius-s:6px; --radius-m:10px; --radius-l:16px; --scale:1;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:hsl(var(--h) var(--hs) 8%); --surface:hsl(var(--h) var(--hs) 12%); --surface2:hsl(var(--h) var(--hs) 16%);
    --ink:hsl(var(--h) 22% 92%); --ink2:hsl(var(--h) 14% 75%); --ink3:hsl(var(--h) 10% 58%); --line:hsl(var(--h) 14% 22%);
    --chrome:hsl(var(--h) 26% 5%); --chrome2:hsl(var(--h) 20% 13%);
    --ok:#5DBB8E; --warn:#E3AE52; --bad:#EE7A72; --info:#79A9E0; --c2:hsl(var(--h) 30% 62%); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) var(--hs) 8%); --surface:hsl(var(--h) var(--hs) 12%); --surface2:hsl(var(--h) var(--hs) 16%);
  --ink:hsl(var(--h) 22% 92%); --ink2:hsl(var(--h) 14% 75%); --ink3:hsl(var(--h) 10% 58%); --line:hsl(var(--h) 14% 22%);
  --chrome:hsl(var(--h) 26% 5%); --chrome2:hsl(var(--h) 20% 13%);
  --ok:#5DBB8E; --warn:#E3AE52; --bad:#EE7A72; --info:#79A9E0; --c2:hsl(var(--h) 30% 62%); color-scheme:dark;
}
:root.amoled[data-theme="dark"]{ --bg:#000; --surface:hsl(var(--h) var(--hs) 7%); --surface2:hsl(var(--h) var(--hs) 11%); --line:hsl(var(--h) 12% 17%); --chrome:#000; --chrome2:hsl(var(--h) 14% 10%) }
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; min-height:100%; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:40; background:var(--chrome)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--info); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Layout */
.app{display:grid; grid-template-columns:1fr; min-height:100%}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--chrome); color:var(--chrome-ink); display:flex; align-items:center; gap:6px; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(10px, env(safe-area-inset-right,0px))}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-stretch:112%; font-size:18px; letter-spacing:-.01em}
.tagmini{background:var(--tag); color:var(--tag-ink); font-size:11px; font-weight:800; padding:2px 7px 2px 12px; border-radius:3px; position:relative}
.tagmini::before{content:""; position:absolute; left:4px; top:50%; width:4px; height:4px; margin-top:-2px; border-radius:50%; background:var(--chrome)}
.topbar .spacer{flex:1}
.cloud{font-size:12px; color:var(--chrome-ink2); display:flex; align-items:center; gap:6px; margin-right:4px}
.cloud i{width:8px; height:8px; border-radius:50%; background:#7A8494; display:inline-block; flex:none}
.cloud.on i{background:#5DBB8E} .cloud.busy i{background:var(--tag)} .cloud.err i{background:#EE7A72}
@media (max-width:420px){ .cloud span{display:none} }
.iconbtn{background:transparent; border:0; color:inherit; padding:7px; border-radius:8px; cursor:pointer; display:inline-flex}
.iconbtn:hover{background:var(--chrome2)}
.iconbtn svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8}
.side{display:none}
main{padding-block:16px 120px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); max-width:1180px; width:100%; margin:0 auto; zoom:var(--scale); min-width:0}
.bottomnav{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
.bottomnav button{flex:1; background:none; border:0; padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--ink3); cursor:pointer; min-width:0}
.bottomnav button[aria-current="page"]{color:var(--ink); font-weight:750}
.bottomnav button[aria-current="page"] svg{stroke:var(--ink)}
.bottomnav button[aria-current="page"]::after{content:""; width:18px; height:3px; border-radius:2px; background:var(--tag); margin-top:1px}
.bottomnav svg{width:22px; height:22px; stroke:var(--ink3); fill:none; stroke-width:1.8}
.fab{position:fixed; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:31; background:var(--tag); color:var(--tag-ink); border:0; border-radius:28px; padding:14px 20px; font-weight:800; display:flex; align-items:center; gap:8px; box-shadow:0 6px 18px rgba(10,14,20,.28); cursor:pointer}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none}

body.desk .app{grid-template-columns:230px minmax(0,1fr)}
body.desk .topbar{grid-column:1 / -1}
body.desk .side{display:flex; flex-direction:column; gap:2px; padding:16px 10px; position:sticky; top:52px; align-self:start; height:calc(100vh - 52px)}
body.desk .side button{display:flex; align-items:center; gap:10px; text-align:left; background:none; border:0; padding:10px 12px; border-radius:8px; cursor:pointer; color:var(--ink2); font-weight:600}
body.desk .side button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
body.desk .side button:hover{background:var(--surface)}
body.desk .side button[aria-current="page"]{background:var(--surface); color:var(--ink); box-shadow:inset 3px 0 0 var(--tag)}
body.desk .side .add{margin-top:10px; background:var(--tag); color:var(--tag-ink); font-weight:800; justify-content:center}
body.desk .side .add:hover{background:var(--tag)}
body.desk .bottomnav, body.desk .fab{display:none}
body.desk main{padding-block:22px 60px; padding-left:28px; padding-right:max(28px, env(safe-area-inset-right,0px))}

/* Generic */
h1{font-size:26px; font-stretch:110%; font-weight:800; letter-spacing:-.015em; margin:4px 0 14px; line-height:1.15; text-wrap:balance}
h2{font-size:17px; font-weight:750; margin:0 0 10px; text-wrap:balance}
h3{font-size:12px; font-weight:750; margin:0 0 8px; color:var(--ink3); text-transform:uppercase; letter-spacing:.06em}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; min-width:0}
.panel .head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px}
.panel .head h2{margin:0}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.grid{display:grid; gap:12px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:9px 14px; font-weight:650; cursor:pointer; min-height:40px; text-decoration:none}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--tag); color:var(--tag-ink); border-color:var(--tag)}
.btn.dark{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.danger{color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%, var(--line))}
.btn.ghost{background:transparent; border-color:transparent}
.btn.sm{padding:5px 10px; min-height:32px; font-size:13px}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-height:42px; min-width:0}
textarea{min-height:80px; resize:vertical}
.f{display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:600; color:var(--ink2); min-width:0}
.f .hint{font-weight:400; color:var(--ink3); font-size:12px}
.check{display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; min-height:42px}
.check input{width:20px; height:20px; accent-color:var(--tag); flex:none}
.tag{display:inline-block; background:var(--tag); color:var(--tag-ink); font-weight:800; font-size:11.5px; padding:2px 8px 2px 15px; border-radius:3px; position:relative; white-space:nowrap; font-variant-numeric:tabular-nums}
.tag::before{content:""; position:absolute; left:5px; top:50%; width:5px; height:5px; margin-top:-2.5px; border-radius:50%; background:var(--surface)}
.badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:650; padding:2px 7px; border-radius:20px; border:1px solid var(--line); color:var(--ink2); white-space:nowrap; background:var(--surface)}
.badge.ok{color:var(--ok); border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.badge.warn{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.badge.bad{color:var(--bad); border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.badge.info{color:var(--info); border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.badge.star{background:var(--chrome); color:var(--tag); border-color:var(--chrome)}
.empty{text-align:center; padding:30px 16px; color:var(--ink2)}
.empty b{display:block; font-size:17px; color:var(--ink); margin-bottom:4px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; padding:3px; background:var(--surface2); gap:2px; flex-wrap:wrap}
.seg button{border:0; background:transparent; padding:6px 12px; border-radius:6px; font-weight:650; font-size:13.5px; cursor:pointer; color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:6px 12px; font-size:13px; font-weight:650; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip .n{opacity:.7; font-weight:600; margin-left:3px}

/* Inicio / hero */
.hero{background:var(--chrome); color:var(--chrome-ink); border-radius:var(--radius-l); padding:20px 18px 18px; position:relative; overflow:hidden}
.hero .lbl{font-size:13.5px; color:var(--chrome-ink2)}
.hero .big{font-size:clamp(34px, 9vw, 54px); font-weight:800; font-stretch:118%; letter-spacing:-.02em; line-height:1.05; margin:4px 0 12px}
.hero .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px 18px}
.hero .stats div{border-top:1px solid color-mix(in srgb, var(--chrome-ink) 20%, transparent); padding-top:8px}
.hero .stats b{display:block; font-size:19px; font-weight:750}
.hero .stats span{font-size:12.5px; color:var(--chrome-ink2)}
.hero .hole{position:absolute; right:18px; top:18px; width:16px; height:16px; border-radius:50%; background:var(--bg); box-shadow:0 0 0 5px var(--tag)}
.dash{display:grid; gap:12px; margin-top:12px; grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){ .dash{grid-template-columns:repeat(2,minmax(0,1fr))} .dash .wide{grid-column:1 / -1} }
@media (min-width:1100px){ .dash.three{grid-template-columns:repeat(3,minmax(0,1fr))} }
.quick{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
@media (min-width:760px){ .quick{grid-template-columns:repeat(4,minmax(0,1fr))} }
.quick button{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; cursor:pointer}
.quick button b{font-size:14.5px} .quick button span{font-size:12px; color:var(--ink3)}
.quick button svg{width:22px;height:22px;stroke:var(--ink2);fill:none;stroke-width:1.8;margin-bottom:4px}

/* Charts */
.kpis{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
@media (min-width:760px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1100px){ .kpis{grid-template-columns:repeat(6,minmax(0,1fr))} }
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; min-width:0}
.kpi span{display:block; font-size:12px; color:var(--ink3)}
.kpi b{display:block; font-size:21px; font-weight:800; font-stretch:110%; margin-top:2px; overflow-wrap:anywhere}
.kpi small{font-size:11.5px; color:var(--ink2)}
.bars{display:flex; flex-direction:column; gap:8px}
.bar{display:grid; grid-template-columns:minmax(80px,38%) minmax(0,1fr) auto; gap:8px; align-items:center; font-size:13px}
.bar > span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar .track{height:10px; background:var(--surface2); border-radius:5px; overflow:hidden; display:flex}
.bar .fill{height:100%; background:var(--ink2)}
.bar .fill.alt{background:var(--tag)} .bar .fill.c2{background:var(--c2)} .bar .fill.warn{background:var(--warn)} .bar .fill.bad{background:var(--bad)} .bar .fill.info{background:var(--info)}
.bar .n{white-space:nowrap; color:var(--ink2)}
.cols{position:relative; display:flex; align-items:stretch; gap:4px; height:170px; padding-top:16px}
.cols::before{content:""; position:absolute; left:0; right:0; top:16px; bottom:20px; background:repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 25%); opacity:.7; pointer-events:none}
.cols .c{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; justify-content:flex-end; min-width:0; position:relative}
.cols .c .stack{width:100%; max-width:42px; display:flex; flex-direction:column-reverse; border-radius:4px 4px 0 0; overflow:hidden}
.cols .c .stack i{display:block; width:100%; background:var(--ink2)}
.cols .c .stack i.alt{background:var(--tag)} .cols .c .stack i.c2{background:var(--c2)} .cols .c .stack i.warn{background:var(--warn)}
.cols .c .vl{font-size:10px; color:var(--ink2); white-space:nowrap}
.cols .c .lb{font-size:10.5px; color:var(--ink3); height:16px; white-space:nowrap; overflow:hidden; text-overflow:clip; max-width:100%}
.cols .c.hi .stack i{background:var(--tag)}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin-top:8px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; background:var(--ink2)}
.legend i.alt{background:var(--tag)} .legend i.c2{background:var(--c2)} .legend i.warn{background:var(--warn)} .legend i.bad{background:var(--bad)} .legend i.info{background:var(--info)}
.donutwrap{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.donutwrap svg{width:130px; height:130px; flex:none}
.toplist{list-style:none; margin:0; padding:0}
.toplist li{display:grid; grid-template-columns:auto 44px minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); cursor:pointer}
.toplist li:first-child{border-top:0}
.toplist li > span:nth-child(3){min-width:0; overflow:hidden; text-overflow:ellipsis}
.toplist .rk{font-weight:800; color:var(--ink3); width:20px; text-align:right}
.thumb{width:44px; height:44px; border-radius:8px; background:var(--surface2); object-fit:cover; display:flex; align-items:center; justify-content:center; color:var(--ink3); font-weight:800; font-size:15px; overflow:hidden}
.alert{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line); font-size:14px; cursor:pointer}
.alert:first-child{border-top:0}
.alert .dot{width:8px; height:8px; border-radius:50%; margin-top:7px; flex:none}

/* List */
.toolbar{display:grid; gap:8px; margin-bottom:12px}
.toolbar .filters{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
@media (min-width:760px){ .toolbar .filters{grid-template-columns:repeat(4,minmax(0,1fr))} }
.summary{font-size:13px; color:var(--ink2); margin:2px 0 10px}
.cards{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; display:flex; flex-direction:column; cursor:pointer; text-align:left; padding:0; min-width:0}
.card .ph{aspect-ratio:4/3; max-width:100%; background:var(--surface2); position:relative; display:flex; align-items:center; justify-content:center; color:var(--ink3); font-weight:800; font-size:34px; font-stretch:115%}
.card .ph img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0}
.card .ph .tag{position:absolute; left:10px; top:10px}
.card .ph .badge.star{position:absolute; right:10px; top:10px}
.card .bd{padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; min-width:0}
.card .nm{font-weight:750; font-size:15.5px; line-height:1.25}
.card .mm{font-size:12.5px; color:var(--ink3)}
.card .pr{display:flex; justify-content:space-between; align-items:baseline; margin-top:4px}
.card .pr b{font-size:17px; font-weight:800}
.card .bdg{display:flex; gap:4px; flex-wrap:wrap; margin-top:4px}
body.compact .card .ph{aspect-ratio:16/9; font-size:26px}
body.compact .panel{padding:11px}
body.compact .dash,body.compact .grid{gap:9px}
.tablewrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m)}
table.t{border-collapse:collapse; width:100%; font-size:13.5px; min-width:860px}
table.t th{text-align:left; font-weight:700; color:var(--ink2); background:var(--surface2); padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
table.t td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
table.t tbody tr{cursor:pointer}
table.t tr:hover td{background:var(--surface2)}
table.t td.r, table.t th.r{text-align:right}

/* Compras */
.wl{display:flex; flex-direction:column; gap:8px}
.wi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; display:grid; grid-template-columns:4px minmax(0,1fr) auto; gap:12px; align-items:start}
.wi .pri{align-self:stretch; border-radius:2px; background:var(--ink3)}
.wi .pri.Alta{background:var(--bad)} .wi .pri.Media{background:var(--warn)} .wi .pri.Baja{background:var(--info)}
.wi .nm{font-weight:750; font-size:15.5px}
.wi .mt{font-size:12.5px; color:var(--ink3); display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:3px}
.wi .pr{font-weight:800; font-size:17px; text-align:right; white-space:nowrap}
.wi .acts{grid-column:2 / -1; display:flex; gap:6px; flex-wrap:wrap}
.wi.done{opacity:.72}

/* Desplegables */
.lists{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){ .lists{grid-template-columns:repeat(2,minmax(0,1fr))} }
.li-row{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:6px; align-items:center; padding:5px 0; border-top:1px solid var(--line)}
.li-row.cat{grid-template-columns:auto minmax(0,1fr) 72px auto auto}
.li-row:first-of-type{border-top:0}
.li-row input{min-height:36px; padding:6px 9px}
.li-row .cnt{font-size:12px; color:var(--ink3); white-space:nowrap; min-width:48px; text-align:right}
.mv{display:flex; flex-direction:column}

function idb(){
  if (!idbP) idbP = new Promise((res, rej) => {
    const r = indexedDB.open("inventario-cuarto", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return idbP;
}
async function kvGet(k){ const d = await idb(); return new Promise((res, rej) => { const r = d.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kvSet(k, v){ const d = await idb(); return new Promise((res, rej) => { const tx = d.transaction("kv","readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
const persist = debounce(async () => {

      else if ((n.updatedAt || "") > (lc.updatedAt || "")){ Object.assign(lc, n); changed = true; }
      else if (full && (lc.updatedAt || "") > (n.updatedAt || "")) syncCompra(lc);
      continue;
    }
    const loc = map.get(r.id);
    if (!loc){ S.items.push(structuredClone(data)); changed = true; }
    else if ((data.updatedAt || "") > (loc.updatedAt || "")){
      const n = structuredClone(data); const locF = new Map((loc.fotos || []).map(f => [f.id, f]));
      n.fotos = (data.fotos || []).map(f => ({...f, data: (locF.get(f.id) || {}).data}));
      Object.keys(loc).forEach(k => delete loc[k]); Object.assign(loc, n); changed = true;
    } else if (full && (loc.updatedAt || "") > (data.updatedAt || "")) syncItem(loc);
  }
  if (full){
    for (const i of S.items) if (!remoteIds.has(i.id)) syncItem(i);
    for (const c of S.compras) if (!remoteIds.has(c.id)) syncCompra(c);
    if (!rows.find(r => r.id === "_ajustes")) syncSettings();
  }
  if (changed){ persist(); if (!dlg.open) render(); }
  downloadMissingPhotos();
}

let downloadsP = null;
async function saveFile(filename, data, mime){
  try {
    if (window.claude && window.claude.use){
      downloadsP = downloadsP || claude.use("downloads");
      const dl = await Promise.race([downloadsP, new Promise(r => setTimeout(() => r(null), 3000))]);
      if (dl){ const r = await dl.save({filename, data: data instanceof Blob ? data : new Blob([data], {type: mime})}); if (r && r.status === "saved") toast("Archivo listo: " + filename); return true; }
    }
  } catch (e) { if (e && (e.code === "declined" || e.code === "cancelled")) return false; }
  const blob = data instanceof Blob ? data : new Blob([data], {type: mime});
  try {
    const file = new File([blob], filename, {type: mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title: filename}); return true; }
  } catch (e) { if (e && e.name === "AbortError") return false; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true; }
  catch (e) { toast("No se pudo guardar el archivo en este navegador."); return false; }
}
function loadScript(src){
  return new Promise((res, rej) => { if ($(`script[src="${src}"]`)) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("No cargó " + src)); document.head.appendChild(s); });
}

function inkFor(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "#231C00";
  const n = parseInt(m[1], 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const L = c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
  return (0.2126*L(r) + 0.7152*L(g) + 0.0722*L(b)) > 0.33 ? "#1A1608" : "#FFFFFF";
}

function hbars(arr, opts = {}){
  // arr: [[label, {v, n?, parts?:[{v,cls}]}]]
  if (!arr.length) return `<p class="muted small" style="margin:0">Sin datos todavía.</p>`;
  const max = Math.max(1, ...arr.map(x => x[1].v));
  return `<div class="bars">${arr.slice(0, opts.limit || 8).map(([k,o]) => {
    const parts = o.parts || [{v:o.v, cls: opts.cls || ""}];
    const attr = opts.field ? ` data-action="goto-filter" data-f='${esc(JSON.stringify({[opts.field]: k === "Sin asignar" ? "" : k}))}' style="cursor:pointer"` : "";
    return `<div class="bar"${attr} title="${esc(k)}: ${esc(money(o.v))}"><span>${esc(k)}${o.n != null ? ` <span class="muted">(${o.n})</span>` : ""}</span><div class="track">${parts.map(p => `<div class="fill ${p.cls||""}" style="width:${Math.max(p.v ? 1.5 : 0, p.v/max*100)}%"></div>`).join("")}</div><span class="n num">${(opts.fmt || moneyShort)(o.v)}</span></div>`;
  }).join("")}</div>`;
}
function colChart(data, opts = {}){
  // data: [{label, parts:[{v, cls}], title, hi}]

  const tot = d => d.parts.reduce((s,p) => s + (p.v||0), 0);
  const max = Math.max(1, ...data.map(tot));
  const showV = data.length <= 8 || !window.matchMedia("(max-width:520px)").matches;
  return `<div class="cols">${data.map(d => { const t = tot(d); return `<div class="c ${d.hi ? "hi" : ""}" title="${esc(d.title || d.label)}: ${esc(money(t))}">${showV && t ? `<span class="vl num">${moneyK(t)}</span>` : ""}<div class="stack" style="height:calc((100% - 34px) * ${t/max})">${d.parts.map(p => `<i class="${p.cls||""}" style="height:${t ? p.v/t*100 : 0}%"></i>`).join("")}</div><span class="lb">${esc(d.label)}</span></div>`; }).join("")}</div>`;
}
function donut(parts){

function filtered(){
  const f = S.f; const q = norm(f.q);
  let arr = live().filter(i => {
    if (f.estado === "Activo" && !(((i.estado||"Activo") === "Activo") || i.estado === "Prestado")) return false;
    if (f.estado && f.estado !== "Activo" && f.estado !== "*" && (i.estado||"Activo") !== f.estado) return false;
    if (f.cat && i.categoria !== f.cat) return false;
    if (f.zona && i.zona !== f.zona) return false;
    if (f.alto && !isAlto(i)) return false;
    if (f.verif && !porVerificar(i)) return false;
    if (q){ const hay = norm([i.code,i.nombre,i.marca,i.modelo,i.serie,i.categoria,i.zona,i.tienda,i.folio,i.notas,(i.etiquetas||[]).join(" ")].join(" ")); if (!q.split(/\s+/).every(w => hay.includes(w))) return false; }
    return true;
  });
  const by = {
    "precio-desc": (a,b) => (b.precio||0) - (a.precio||0),
    "valor-desc": (a,b) => valorActual(b) - valorActual(a),
    "fecha-desc": (a,b) => (b.fechaCompra||"").localeCompare(a.fechaCompra||""),
    "fecha-asc": (a,b) => (a.fechaCompra||"9").localeCompare(b.fechaCompra||"9"),

    "reciente": (a,b) => (b.createdAt||"").localeCompare(a.createdAt||"")
  }[f.orden] || (() => 0);
  return arr.sort(by);
}

}

function parseCSV(text){
  text = text.replace(/^﻿/, ""); const sep = (text.split("\n")[0].match(/;/g)||[]).length > (text.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let n = 0; n < text.length; n++){
    const c = text[n];
    if (q){ if (c === '"'){ if (text[n+1] === '"'){ cur += '"'; n++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === sep){ row.push(cur); cur = ""; } else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; } else if (c !== "\r") cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  const hs = rows.shift() || []; return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(hs.map((h, n) => [h, r[n] ?? ""])));
}
function excelDate(v){
  if (v == null || v === "") return "";
  if (typeof v === "number"){ const d = new Date(Math.round((v - 25569) * 86400000)); return d.toISOString().slice(0,10); }
  const s = String(v).trim(); if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s); if (m){ const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return "";
}
const ALIASES = {

  metodoPago:["metodo de pago","forma de pago","pago","tarjeta"], folio:["folio","factura","ticket","pedido"], msi:["msi","meses sin intereses"], garantiaHasta:["garantia hasta","garantia","fin de garantia"],

function rowToItem(r){

  const nombre = String(get("nombre")).trim(); if (!nombre) return null;

const CONSUMIBLE = /crema|jab[oó]n|shampoo|champ[uú]|acondicionador|desodor|antitransp|protector solar|sun |serum|maquill|corrector|polvo|brochas|gel |cepillo|pasta dental|floss|hilo dental|vitamin|multivit|centrum|creatina|prote[ií]na|whey|enzima|probi[oó]t|inositol|leche|aceite|salsa|consom|caf[eé]|dulce|tabletas|c[aá]psulas|pa[nñ]al|toalla|papel|detergente|suavizante|pinzas para ropa|music|suscrip|recarga|mica|protector de pantalla|cable|adaptador|folder|carpeta|pegamento|tapones|sticker|calcoman|toothpaste|aerosol|tratamiento|bals[aá]mo|labial|fijador|perfume|loci[oó]n|agenda/i;
const CAT_RULES = [
  [/laptop|mouse|teclado|hub|ssd|disco duro|microsd|memoria|capturadora|monitor|nexode|docking|router|webcam/i, "Computación"],
  [/celular|galaxy|iphone|tablet|ipad|funda|smartwatch|reloj inteligente/i, "Celulares y tablets"],
  [/aud[ií]fono|bocina|speaker|sound|earbud|barra de sonido/i, "Audio"],
  [/tenis|zapat|playera|camis|pantal|sudadera|mochila|chamarra|jogger|calcet/i, "Ropa y calzado"],
  [/lego|funko|figura|coleccion/i, "Coleccionables"],
  [/foco|bombilla|led|l[aá]mpara|tira/i, "Decoración"],
  [/skate|bicic|pesas|mancuern|bal[oó]n|patin/i, "Deportes"],
  [/power bank|bater[ií]a|proyector|fire tv|c[aá]mara|smart|cargador|consola/i, "Electrónica"],
  [/prensa|taladro|desarmador|herramient|soldad|pinzas/i, "Herramientas"],
  [/libro|novela/i, "Libros"], [/reloj|anillo|collar|pulsera/i, "Relojes y joyería"], [/silla|mesa|escritorio|repisa|librero/i, "Muebles"]
];
const guessCat = n => (CAT_RULES.find(([r]) => r.test(n)) || [0, "Otros"])[1];
const cleanName = n => { let s = String(n).replace(/^(presentamos( el)?|1pc|\d+pcs?)\s+/i, "").split(/,| - | – | \| /)[0].trim(); if (s.length > 70) s = s.slice(0, 68).replace(/\s+\S*$/, "") + "…"; return s; };
function cobranzasCandidates(data){
  const M = new Map((data.movimientos || []).map(m => [m.id, m]));
  const T = Object.fromEntries((data.tarjetas || []).map(t => [t.cta, t.nom]));
  const L = Object.fromEntries((data.plasticos || []).filter(p => p.ult4).map(p => [p.ult4, T[p.cta] || p.banco]));
  const out = [];
  for (const p of (data.pedidos || [])){
    if (p.src === "Steam" || p.reemb) continue;
    const movs = (p.links || []).map(l => M.get(l)).filter(Boolean);
    const owners = movs.map(m => m.pq || "").filter(Boolean);
    if (owners.length && owners.every(o => !/^victor|por identificar/i.test(o))) continue;
    const metodo = movs[0] ? (T[movs[0].cta] || "") : (p.last4 || []).map(x => L[x] || "Tarjeta ····" + x)[0] || ((p.pago || []).join(" ").includes("PayPal") ? "PayPal" : "");
    const link = p.url || (p.src === "Amazon" && p.pedido ? `https://www.amazon.com.mx/gp/your-account/order-details?orderID=${p.pedido}` : "");
    (p.items || []).forEach((it, n) => {
      const precio = +(it.precio || 0) * (+(it.qty || 1));
      if (precio < 250 || CONSUMIBLE.test(it.nom)) return;
      const ya = live().some(i => (i.folio && i.folio === p.pedido && Math.abs((i.precio||0) - precio) < 1) || i.srcRef === p.id + "#" + n);
      out.push({ref: p.id + "#" + n, ya, nom: it.nom, item: {nombre: cleanName(it.nom) + (+it.qty > 1 ? ` (x${it.qty})` : ""), categoria: guessCat(it.nom), precio: Math.round(precio*100)/100, fechaCompra: p.f, tienda: p.src, metodoPago: metodo, folio: p.pedido || p.id, link, cantidad: 1, notas: `Importado de tus compras de ${p.src} (pedido ${p.pedido || p.id}). Nombre original: ${it.nom}`}});
    });
  }
  return out.sort((a,b) => (b.item.fechaCompra||"").localeCompare(a.item.fechaCompra||""));
}
function openCobranzasImport(data){
  const cands = cobranzasCandidates(data);
  if (!cands.length){ toast("No encontré artículos duraderos nuevos en ese archivo."); return; }

  <div class="body"><p class="small muted" style="margin-top:0">Encontré ${cands.length} artículo(s) de $250 o más que no parecen consumibles ni de otras personas. Los ya importados aparecen sin marcar. Revisa y elige cuáles agregar; llegarán con la etiqueta “por verificar”.</p>

$("#fileImport").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const name = file.name.toLowerCase();
    if (name.endsWith(".json")){
      const data = JSON.parse(await file.text());
      if (Array.isArray(data.pedidos) && Array.isArray(data.movimientos)) return openCobranzasImport(data);
      if (!Array.isArray(data.items)) throw new Error("formato");
      let mode = "replace";
      if (live().length) mode = await ask({title: "Importar respaldo", html: `<p style="margin:0">El respaldo tiene <b>${data.items.filter(i => !i.deleted).length}</b> objeto(s)${Array.isArray(data.compras) ? ` y ${data.compras.filter(c => !c.deleted).length} compra(s)` : ""}. ¿Qué hago con lo que ya tienes?</p>`, buttons: [{label:"Cancelar", value:null},{label:"Combinar", value:"merge", cls:"primary"},{label:"Reemplazar todo", value:"replace", cls:"danger"}]});
      if (!mode) return;
      if (mode === "replace"){ S.items = data.items; S.compras = data.compras || []; if (data.settings) S.settings = {...DEFAULT_SETTINGS, ...data.settings, seedCob1: true}; }
      else {
        const map = new Map(S.items.map(i => [i.id, i])); for (const it of data.items){ const loc = map.get(it.id); if (!loc) S.items.push(it); else if ((it.updatedAt||"") > (loc.updatedAt||"")) Object.assign(loc, it, {fotos: (it.fotos||[]).some(f => f.data) ? it.fotos : loc.fotos}); }
        const cm = new Map(S.compras.map(c => [c.id, c])); for (const c of (data.compras || [])){ const loc = cm.get(c.id); if (!loc) S.compras.push(c); else if ((c.updatedAt||"") > (loc.updatedAt||"")) Object.assign(loc, c); }
      }
      S.items.forEach(syncItem); S.compras.forEach(syncCompra); touchSettings(); persist(); applyLayout(); render(); toast("Respaldo importado");
      return;
    }
    let rows;
    if (name.endsWith(".csv")) rows = parseCSV(await file.text());
    else { await loadXLSX(); const wb = XLSX.read(await file.arrayBuffer(), {type:"array"}); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:"", raw:true}); }
    let added = 0, updated = 0;
    for (const r of rows){
      const it = rowToItem(r); if (!it) continue;
      const loc = (it.id && S.items.find(x => x.id === it.id)) || (it.code && S.items.find(x => x.code === it.code && !x.deleted));
      if (loc){ const keepF = loc.fotos, keepH = loc.historial || []; Object.assign(loc, Object.fromEntries(Object.entries(it).filter(([k,v]) => k !== "id" && v !== "" && v != null)), {fotos: keepF, updatedAt: nowISO(), historial: [...keepH, {t: nowISO(), accion: "Importado", detalle: "Actualizado desde " + file.name}]}); syncItem(loc); updated++; }
      else { const n = {...it, id: uid(), code: it.code || nextCode(), fotos: [], createdAt: nowISO(), updatedAt: nowISO(), historial: [{t: nowISO(), accion: "Alta", detalle: "Importado desde " + file.name}]}; S.items.push(n); syncItem(n); added++; }
    }
    persist(); render(); toast(`${added} agregado(s), ${updated} actualizado(s)`);
  } catch (err) { toast("No se pudo leer el archivo. Usa un respaldo de esta app, tu archivo de Cobranzas, o un CSV/Excel con encabezados."); }
});

      <div class="setrow"><span>Tamaño de texto</span>${seg("aEsc", [["0.92","Chico"],["1","Normal"],["1.1","Grande"],["1.2","Muy grande"]], st.escala || 1)}</div>
      <div class="setrow"><span>Densidad</span>${seg("aDen", [["comoda","Cómoda"],["compacta","Compacta"]], st.densidad || "comoda")}</div>
      <div class="setrow"><span>Diseño</span>${seg("aVista", [["auto","Automático"],["telefono","Teléfono"],["escritorio","Escritorio"]], st.vista || "auto")}</div>
      <div class="setrow"><button class="btn sm" id="aReset" style="justify-self:start">Restablecer apariencia</button></div>
    </div>
    <div class="panel"><h2>Preferencias</h2>
      <div class="setrow"><span>Pantalla al abrir</span><select id="pInicio">${VIEWS.map(([k,t]) => `<option value="${k}" ${st.inicio === k ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div class="setrow"><span>Formulario al agregar</span>${seg("pForm", [["rapido","Rápido"],["detalles","Detalles"]], st.formModo || "rapido")}</div>
      <div class="setrow"><span>Montos</span>${seg("pCent", [["auto","Con centavos"],["nunca","Redondeados"]], st.centavos || "auto")}<label class="check"><input type="checkbox" id="pPriv" ${st.privado ? "checked" : ""}> Ocultar montos (para enseñar la pantalla)</label></div>
      <div class="setrow"><span>Nombre en los reportes</span><input type="text" id="pDueno" value="${esc(st.dueno || "")}"></div>
      <div class="setrow"><div class="fg">
        <label class="f">Alto valor desde (MXN)<input type="number" min="0" step="100" id="sUmbral" value="${st.umbral}"></label>
        <label class="f">Valor residual mínimo (%)<input type="number" min="0" max="100" step="1" id="sRes" value="${st.residual ?? 15}"><span class="hint">Lo que conserva al terminar su vida útil</span></label>
      </div></div>
      <div class="setrow"><span>Listas de opciones</span><button class="btn sm" data-nav="listas" style="justify-self:start">Editar desplegables</button></div>
    </div>
    <div class="panel"><h2>Respaldo</h2>
      <p class="small muted" style="margin-top:0">Tus datos y fotos también se guardan en este navegador para que funcione sin internet. Exporta un respaldo completo de vez en cuando y guárdalo en Drive. Último respaldo: <b>${lr}</b>.</p>
      <div class="row"><button class="btn primary" id="eJson">Respaldo completo (con fotos)</button><button class="btn" id="eJsonNo">Sin fotos</button><button class="btn" id="eXlsx">Excel</button><button class="btn" id="eCsv">CSV</button></div>
      <p class="small muted">${cloud.col ? `Sincronizado con tu cuenta <b>${esc(cloud.email)}</b>: tus objetos, compras y fotos se guardan en la nube y aparecen en tu celular y tu computadora.` : "Estás usando la app sin cuenta: todo se queda solo en este dispositivo."}</p><div class="row">${cloud.col ? '<button class="btn" id="cOut">Cerrar sesión</button>' : '<button class="btn" id="cIn">Entrar con mi cuenta</button>'}</div>
    </div>
    <div class="panel"><h2>Importar</h2>
      <p class="small muted" style="margin-top:0">Acepta un respaldo de esta app, tu archivo de <b>Cobranzas</b> (.json, toma tus pedidos de Amazon, Mercado Libre y Temu) o un Excel/CSV con encabezados como Nombre, Precio y Fecha de compra.</p>
      <button class="btn" id="iFile">Elegir archivo para importar</button>
    </div>
    <div class="panel"><h2>Instalar en tu celular</h2><p class="small" style="margin:0">En Samsung Internet o Chrome abre el menú y elige <b>Agregar a pantalla de inicio</b> (o <b>Instalar app</b>). Con tu cuenta iniciada verás lo mismo en todos tus dispositivos.</p></div>
    <div class="panel"><h2>Zona de cuidado</h2><p class="small muted" style="margin-top:0">${live().length} objeto(s) y ${liveC().length} compra(s) guardados${storageOK ? "" : " · el guardado en este dispositivo falló, exporta un respaldo"}.</p><button class="btn danger" id="sWipe">Borrar todo de este dispositivo</button></div>
  </div>`;
  const segWire = (id, fn) => $$(`#${id} button`, el).forEach(b => b.onclick = () => { $$(`#${id} button`, el).forEach(x => x.setAttribute("aria-pressed", x === b)); fn(b.dataset.v); touchSettings(); applyLayout(); });
  segWire("aTema", v => st.tema = v);
  segWire("aEsc", v => st.escala = +v);
  segWire("aDen", v => st.densidad = v);
  segWire("aVista", v => st.vista = v);
  segWire("pForm", v => st.formModo = v);
  segWire("pCent", v => { st.centavos = v; });
  $$("[data-pal]", el).forEach(b => b.onclick = () => { st.paleta = b.dataset.pal; touchSettings(); applyLayout(); renderAjustes(); });
  $$("[data-acc]", el).forEach(b => b.onclick = () => { st.acento = b.dataset.acc; touchSettings(); applyLayout(); renderAjustes(); });
  $("#aColor").oninput = debounce(e => { st.acento = e.target.value; touchSettings(); applyLayout(); $$("[data-acc]", el).forEach(x => x.setAttribute("aria-pressed", "false")); }, 120);
  $("#aReset").onclick = () => { Object.assign(st, {tema:"auto", paleta:"grafito", acento:"#F2C230", escala:1, densidad:"comoda", vista:"auto"}); touchSettings(); applyLayout(); renderAjustes(); toast("Apariencia restablecida"); };
  $("#pInicio").onchange = e => { st.inicio = e.target.value; touchSettings(); };
  $("#pPriv").onchange = e => { st.privado = e.target.checked; touchSettings(); applyLayout(); };
  $("#pDueno").onchange = e => { st.dueno = e.target.value.trim(); touchSettings(); };
  $("#sUmbral").onchange = e => { st.umbral = parseNum(e.target.value) || 0; touchSettings(); };
  $("#sRes").onchange = e => { st.residual = Math.min(100, Math.max(0, parseNum(e.target.value) ?? 15)); touchSettings(); };
  $("#eJson").onclick = () => exportJSON(true);
  $("#eJsonNo").onclick = () => exportJSON(false);
  $("#eXlsx").onclick = () => exportXLSX(live(), `inventario-cuarto-${today()}.xlsx`, true);
  $("#eCsv").onclick = () => saveFile(`inventario-cuarto-${today()}.csv`, toCSV(rowsFor(live())), "text/csv");
  $("#iFile").onclick = () => $("#fileImport").click();
  if ($("#cOut")) $("#cOut").onclick = cloudLogout; if ($("#cIn")) $("#cIn").onclick = cloudLogin;
  $("#sWipe").onclick = async () => {
    const r = await ask({title: "Borrar todo", html: `<p style="margin:0">Se borrarán todos los objetos y compras de este dispositivo (y de la copia en la nube). No se puede deshacer; exporta un respaldo antes.</p>`, typeToConfirm: "BORRAR", buttons: [{label:"Cancelar", value:false},{label:"Borrar todo", value:true, cls:"danger", needsType:true}]});
    if (!r) return;
    for (const i of S.items){ const tomb = {id: i.id, code: i.code, deleted: true, updatedAt: nowISO()}; Object.keys(i).forEach(k => delete i[k]); Object.assign(i, tomb); syncItem(i); }
    for (const c of S.compras){ Object.keys(c).forEach(k => k !== "id" && delete c[k]); Object.assign(c, {deleted: true, updatedAt: nowISO()}); syncCompra(c); }
    persist(); render(); toast("Inventario borrado");
  };
}

/* ================= Inicio de la app ================= */
(async function start(){
  buildNav();
  try {
    const [items, settings, compras] = await Promise.all([kvGet("items"), kvGet("settings"), kvGet("compras")]);
    if (Array.isArray(items)) S.items = items;
    if (Array.isArray(compras)) S.compras = compras;
    if (settings){
      S.settings = {...structuredClone(DEFAULT_SETTINGS), ...settings};
      // Migración: listas nuevas y métodos con los nombres de tus tarjetas
      for (const k of ["tiendas","etiquetas"]) if (!Array.isArray(S.settings[k])) S.settings[k] = [...DEFAULT_SETTINGS[k]];
      for (const m of DEFAULT_SETTINGS.metodos) if (!S.settings.metodos.includes(m)) S.settings.metodos.push(m);
      if (!S.settings.categorias.some(c => c.nombre === "Accesorios personales")) S.settings.categorias.splice(9, 0, {nombre:"Accesorios personales", vida:3});
    }
  } catch (e) { storageOK = false; toast("Este navegador no permite guardar datos aquí. Exporta respaldos seguido.", 5000); }
  const n = applySeed();
  applyLayout(); setView(VIEWS.some(v => v[0] === S.settings.inicio) ? S.settings.inicio : "inicio");
  if (n) setTimeout(() => toast(`Agregué ${n} adquisiciones de tus compras. Revísalas en Objetos › Por verificar.`, 5200), 400);
  initCloud();
})();
</script>
</body>
</html>
