<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organizador de Secciones</title>
<style>
:root{--ac:#4f8cff;--ac2:#22c3a6;--ac3:#f5a524;--dn:#ef5b5b;--ok:#2fbf71;--r:10px;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
[data-tema=oscuro]{--bg:#0e1117;--pn:#151a23;--pn2:#1c2330;--bd:#283141;--tx:#e7eaf0;--mt:#8f9bb0;--mut:#3a4558;--mut2:#2a3342;color-scheme:dark}
[data-tema=claro]{--bg:#f3f5f9;--pn:#ffffff;--pn2:#f0f3f8;--bd:#dde3ec;--tx:#1b2230;--mt:#647086;--mut:#c4ccd8;--mut2:#e3e8f0;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-size:14px;height:100vh;display:grid;grid-template-rows:56px 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--pn2);border:1px solid var(--bd);border-radius:8px;padding:6px 11px}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.dn{color:var(--dn)}
button.sm{padding:3px 8px;font-size:12px}
input[type=text],input[type=search],select,textarea{background:var(--pn2);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
small,.mt{color:var(--mt)}
/* Encabezado */
header{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.ttl b{display:block;font-size:15px}.ttl small{font-size:11px}
header .sp{flex:1}
header select{width:auto;padding:5px 8px}
.saved{font-size:12px;color:var(--ok)}
.dd{position:relative}
.dd .menu{position:absolute;right:0;top:110%;background:var(--pn);border:1px solid var(--bd);border-radius:10px;min-width:250px;padding:6px;display:none;z-index:50;box-shadow:0 10px 30px #0006}
.dd.open .menu{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 9px}
.menu button:hover{background:var(--pn2)}
.menu hr{border:0;border-top:1px solid var(--bd);margin:5px 0}
.menu .lb{font-size:11px;color:var(--mt);padding:4px 9px;text-transform:uppercase;letter-spacing:.05em}
/* Layout */
.wrap{display:grid;grid-template-columns:250px 1fr;overflow:hidden}
nav{background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:10px}
nav .g{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mt);margin:14px 8px 4px}
nav a{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;color:var(--tx);text-decoration:none}
nav a:hover{background:var(--pn2)}
nav a.on{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font-weight:600}
nav a .c{margin-left:auto;font-size:11px;background:var(--pn2);border-radius:20px;padding:1px 7px;color:var(--mt)}
nav a.on .c{background:var(--ac);color:#fff}
main{overflow:auto;padding:22px 26px 80px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:22px 0 8px}
.info{background:var(--pn);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:var(--r);padding:12px 14px;margin:12px 0;line-height:1.5}
.info ul{margin:6px 0 0 0;padding-left:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.card.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.demo{height:130px;background:var(--pn2);border-bottom:1px solid var(--bd);padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.demo.tall{height:auto;min-height:130px}
.cb{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb p{margin:0;color:var(--mt);font-size:13px;line-height:1.4;flex:1}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600}
.chk input{width:17px;height:17px;accent-color:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ptx textarea{min-height:90px;font-size:12.5px;font-family:Consolas,monospace}
.ref{max-width:100%;max-height:120px;border-radius:6px;border:1px solid var(--bd);display:block}
.tag{font-size:10px;padding:1px 6px;border-radius:20px;background:var(--ac3);color:#000;font-weight:700}
.fld{display:grid;gap:4px;margin-bottom:12px}.fld label{font-size:12px;color:var(--mt);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
pre.rep{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);padding:16px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;max-height:65vh;overflow:auto}
.plist{display:grid;gap:6px}
.pit{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--pn2);cursor:pointer}
.pit.on{border-color:var(--ac)}
.pit span{flex:1}
/* Demos SVG */
.sv{width:100%;height:100%}
.f1{fill:var(--ac)}.f2{fill:var(--ac2)}.f3{fill:var(--ac3)}.fm{fill:var(--mut)}.fd{fill:var(--dn)}.fp{fill:var(--pn)}
.s1{stroke:var(--ac);fill:none;stroke-width:2}.s2{stroke:var(--ac2);fill:none;stroke-width:2}.sm{stroke:var(--mut);fill:none;stroke-width:1.2}.sd{stroke:var(--dn);fill:none;stroke-width:2}
.sk{stroke:var(--mt);fill:none;stroke-width:1}
.tx{font-size:6.5px;fill:var(--tx);font-family:system-ui}.txw{font-size:6px;fill:#fff;font-family:system-ui}
/* Wireframes */
.wf{display:grid;gap:3px;width:100%;height:100%}
.wf i{background:var(--mut2);border-radius:3px;border:1px solid var(--mut)}
.wf i.a{background:var(--ac);border-color:var(--ac)}
.wf i.b{background:color-mix(in srgb,var(--ac) 35%,var(--mut2))}
/* Mini UI */
.mh{display:flex;align-items:center;gap:6px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;width:100%;font-size:11px;flex-wrap:wrap}
.mh .sp{flex:1}
.pill{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--pn);border:1px solid var(--bd)}
.pill.a{background:var(--ac);color:#fff;border-color:var(--ac)}
.pill.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.pill.w{background:var(--ac3);color:#000;border-color:var(--ac3)}
.pill.d{background:var(--dn);color:#fff;border-color:var(--dn)}
.kpi{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:80px}
.kpi small{display:block;font-size:10px}.kpi b{font-size:17px}.kpi em{font-style:normal;font-size:10px;color:var(--ok);display:block}
.mini{display:flex;flex-direction:column;gap:6px;width:100%;font-size:11px}
.mini input,.mini select{padding:4px 6px;font-size:11px}
.tgl{appearance:none;width:34px;height:19px;border-radius:20px;background:var(--mut);position:relative;cursor:pointer;vertical-align:middle;transition:.2s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
.tgl:checked{background:var(--ac)}.tgl:checked::after{left:17px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 9px;font-size:11px;background:var(--pn)}
.seg button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips span{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--bd);cursor:pointer;background:var(--pn)}
.chips span.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.stars span{font-size:20px;cursor:pointer;color:var(--mut)}.stars span.on{color:var(--ac3)}
.swt{display:flex;gap:5px;flex-wrap:wrap}
.swt i{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.swt i.on{border-color:var(--tx)}
/* Drawer notas */
#notas{position:fixed;top:56px;right:0;bottom:0;width:380px;background:var(--pn);border-left:1px solid var(--bd);transform:translateX(105%);transition:.25s;z-index:40;display:flex;flex-direction:column;box-shadow:-10px 0 30px #0005}
#notas.open{transform:none}
#notas .hd{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
#notas .bd{padding:12px 14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.nota{border:1px solid var(--bd);border-radius:9px;padding:9px 10px;background:var(--pn2)}
.nota.hecha{opacity:.55}.nota.hecha .t{text-decoration:line-through}
.nota .t{white-space:pre-wrap;margin:4px 0 6px}
.fab{position:fixed;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:22px;box-shadow:0 6px 20px #0006;z-index:30}
.fab b{position:absolute;top:-4px;right:-4px;background:var(--dn);font-size:11px;border-radius:20px;padding:1px 6px}
/* Modal y toast */
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:100}
.mo{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:18px;width:min(560px,92vw);max-height:88vh;overflow:auto}
.mo h3{margin:0 0 12px}
.mo .act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:200}
#toast div{background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px #0005}
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--ac) 25%,transparent);border:3px dashed var(--ac);display:none;place-items:center;font-size:22px;font-weight:700;z-index:150}
.sug{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--pn);margin-bottom:8px}
.sug input{width:17px;height:17px;accent-color:var(--ac);margin-top:2px}
.sug b{display:block}
kbd{background:var(--pn2);border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}nav{display:none}.two{grid-template-columns:1fr}#notas{width:100%}}
@media print{header,nav,.fab,#notas,.noprint{display:none!important}body{display:block;overflow:visible;background:#fff;color:#000}.wrap{display:block}main{overflow:visible;padding:0}pre.rep{max-height:none;border:0;color:#000;background:#fff}}
</style>
</head>
<body data-tema="oscuro">
<svg width="0" height="0" style="position:absolute"><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--mt)"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--dn)"/></marker>
</defs></svg>

<header>
  <div class="logo">OS</div>
  <div class="ttl"><b>Organizador de Secciones</b><small>v1.1 · Estándar de apps</small></div>
  <select id="selPerfil" title="Proyecto (app) activo"></select>
  <select id="selTipo" title="Tipo de aplicación"></select>
  <span class="sp"></span>
  <span class="saved" id="saved">● Guardado</span>
  <button id="btnRep" class="pri" title="Ver reporte (Ctrl+R)">📄 Reporte</button>
  <div class="dd" id="ddExp"><button>⬇ Exportar ▾</button>
    <div class="menu">
      <div class="lb">Reporte para la IA</div>
      <button data-x="repmd">Reporte (.md)</button>
      <button data-x="rephtml">Reporte (.html, con tus imágenes subidas)</button>
      <button data-x="repcopy">Copiar reporte</button>
      <button data-x="print">Imprimir / PDF</button>
      <hr><div class="lb">Referencias visuales (imágenes)</div>
      <button data-x="vispack">Reporte + imágenes de referencia (.zip)</button>
      <button data-x="vishtml">Reporte visual (.html con imágenes)</button>
      <button data-x="laminas">Solo láminas de lo elegido (.zip)</button>
      <hr><div class="lb">Datos del organizador</div>
      <button data-x="full">Respaldo completo (.json) <kbd>Ctrl+S</kbd></button>
      <button data-x="perfil">Solo este proyecto (.json)</button>
      <button data-x="dicc">Solo diccionario: entradas, prompts, imágenes (.json)</button>
      <hr><div class="lb">Otros</div>
      <button data-x="manual">Manual completo del diccionario (.md)</button>
      <button data-x="notas">Notas como prompt de corrección (.md)</button>
    </div></div>
  <div class="dd" id="ddImp"><button>⬆ Importar ▾</button>
    <div class="menu">
      <button data-i="json">Importar .json (respaldo, proyecto o diccionario)</button>
      <button data-i="paste">Pegar JSON desde portapapeles</button>
      <hr><div class="lb">También puedes arrastrar un .json a la ventana</div>
    </div></div>
  <button id="btnTema" title="Cambiar tema">🌓</button>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<button class="fab" id="fab" title="Notas (Alt+N)">📝<b id="fabN">0</b></button>
<aside id="notas">
  <div class="hd"><b style="flex:1">📝 Notas de corrección</b><button class="sm" id="nExp">Exportar</button><button class="sm" id="nClose">✕</button></div>
  <div class="bd">
    <div class="panel" style="padding:10px">
      <textarea id="nTxt" placeholder="Escribe qué hay que corregir o agregar…"></textarea>
      <div class="row" style="margin-top:6px">
        <select id="nSec" style="flex:1"></select>
        <select id="nPrio" style="width:100px"><option value="alta">Alta</option><option value="media" selected>Media</option><option value="baja">Baja</option></select>
        <button class="pri" id="nAdd">Agregar</button>
      </div>
    </div>
    <div class="seg" id="nFil"><button data-f="pend" class="on">Pendientes</button><button data-f="hecha">Corregidas</button><button data-f="todas">Todas</button></div>
    <div id="nList"></div>
  </div>
</aside>
<div id="toast"></div>
<div class="drop" id="drop">Suelta el .json para importarlo</div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
   Utilidades
   ========================================================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const hoy=()=>new Date().toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'});
const fstamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`};
const slug=s=>String(s||'app').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'app';
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),2600)}
function descargar(nombre,contenido,tipo='text/plain'){const b=new Blob([contenido],{type:tipo+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function modal(titulo,html,botones){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="mo"><h3>${titulo}</h3><div class="mb">${html}</div><div class="act"></div></div>`;
  const act=ov.querySelector('.act');
  botones.forEach(b=>{const x=document.createElement('button');x.textContent=b.t;if(b.c)x.className=b.c;x.onclick=()=>{if(b.fn&&b.fn(ov)===false)return;ov.remove()};act.append(x)});
  ov.addEventListener('mousedown',e=>{if(e.target===ov)ov.remove()});
  document.body.append(ov);const f=ov.querySelector('input,textarea');if(f)f.focus();return ov;
}

/* =========================================================
   Helpers de demos (SVG / wireframes)
   ========================================================= */
const V=(inner,vb='0 0 120 70')=>`<svg viewBox="${vb}" class="sv" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
const WF=(tpl,cells)=>`<div class="wf" style="grid-template:${tpl}">${cells.map(c=>`<i ${c[1]?`class="${c[1]}"`:''} style="grid-area:${c[0]}"></i>`).join('')}</div>`;
const pr=(i)=>{let x=Math.sin(i*99.13)*10000;return x-Math.floor(x)}; // pseudoaleatorio fijo
const axis='<path class="sk" d="M6 62H116M6 62V6"/>';
const line=(x1,y1,x2,y2,c='sk',m=true)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}" ${m?'marker-end="url(#ar)"':''}/>`;
const box=(x,y,w,h,t,c='f1',tc='txw')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" class="${c}"/><text x="${x+w/2}" y="${y+h/2+2}" text-anchor="middle" class="${tc}">${t}</text>`;

/* =========================================================
   DICCIONARIO DE SECCIONES
   Cada sección: id, grupo, icono, titulo, desc, info (investigación / buenas prácticas),
   single (elección única), opts [{id,n,d,p (prompt para la IA),demo,def (preseleccionado)}]
   ========================================================= */
const SEC=[
/* ---------------- ESTRUCTURA ---------------- */
{id:'tipo',grupo:'Estructura',icono:'🧩',titulo:'Tipo de aplicación',single:true,
 desc:'Define la plataforma. Cambia las reglas técnicas que se le piden a la IA.',
 info:`<b>Cómo decidir:</b><ul><li><b>HTML local</b>: un solo archivo, abre con doble clic, cero servidor; el dato vive en el navegador y se respalda con exportar JSON.</li><li><b>Extensión</b> (Chrome/Edge, Manifest V3): cuando necesitas actuar sobre otras páginas, alarmas en segundo plano o un botón en la barra.</li><li><b>PWA</b>: el mismo HTML pero instalable y offline; requiere servirse por https (GitHub Pages).</li><li><b>HTML + Supabase</b>: cuando el dato debe sincronizarse entre equipos o personas.</li></ul>`,
 opts:[
  {id:'html',n:'HTML local (un archivo)',def:true,d:'Todo en un .html: estructura, estilos y script. Funciona sin internet.',
   p:'Entrega UNA sola aplicación en un único archivo .html autocontenido (HTML+CSS+JS en el mismo archivo), que funcione abriéndolo con doble clic, sin servidor ni instalación. Si usas librerías, que sean por CDN con alternativa de funcionamiento básico sin internet. Persistencia en el navegador y respaldo por exportar/importar JSON.',
   demo:V(`<rect x="38" y="6" width="44" height="58" rx="4" class="fm"/><path d="M70 6v12h12" class="sk"/><text x="60" y="40" text-anchor="middle" class="tx" style="font-size:10px;font-weight:700">.html</text><text x="60" y="52" text-anchor="middle" class="tx">1 archivo</text>`)},
  {id:'ext',n:'Extensión Chrome / Edge',d:'Manifest V3: popup, página de opciones, service worker, chrome.storage.',
   p:'Es una extensión de navegador para Chrome y Edge con Manifest V3. Entrega la carpeta completa: manifest.json, popup.html/js, options.html/js, background service worker e íconos (16/32/48/128). Pide los permisos mínimos y explica cada uno. Guarda datos en chrome.storage.local, incluye exportar/importar JSON en la página de opciones e instrucciones para cargarla "sin empaquetar".',
   demo:V(`<rect x="10" y="10" width="100" height="14" rx="3" class="fm"/><circle cx="98" cy="17" r="5" class="f1"/><rect x="62" y="27" width="46" height="36" rx="3" class="fp" stroke="var(--ac)"/><rect x="66" y="32" width="38" height="5" rx="2" class="f1"/><rect x="66" y="41" width="30" height="4" rx="2" class="fm"/><rect x="66" y="49" width="34" height="4" rx="2" class="fm"/><path d="M98 22v5" class="s1"/>`)},
  {id:'pwa',n:'PWA instalable',d:'HTML con manifest y service worker: se instala como app y trabaja offline.',
   p:'Hazla PWA: index.html + manifest.webmanifest + service-worker.js con caché offline, íconos y botón "Instalar". Debe funcionar sin conexión después de la primera carga y poder publicarse en GitHub Pages.',
   demo:V(`<rect x="44" y="6" width="32" height="58" rx="5" class="fm"/><rect x="48" y="12" width="24" height="40" rx="2" class="fp"/><rect x="52" y="17" width="7" height="7" rx="2" class="f1"/><rect x="61" y="17" width="7" height="7" rx="2" class="f2"/><rect x="52" y="26" width="7" height="7" rx="2" class="f3"/><circle cx="60" cy="58" r="2.5" class="fp"/>`)},
  {id:'supa',n:'HTML + Supabase',d:'Igual que HTML local pero sincroniza datos en la nube (auth + tablas).',

/* =========================================================
   Estado
   ========================================================= */
const KEY='organizadorSecciones.v1';
function nuevoPerfil(nombre){
  const sel={};SEC.forEach(s=>{sel[s.id]=s.opts.filter(o=>o.def).map(o=>o.id)});
  return {id:uid(),nombre:nombre||'Nueva app',tema:'',descripcion:'',usuario:'',promptBase:'',version:'1.0',sel,notasSec:{},creado:new Date().toISOString()};
}
function estadoInicial(){
  const p=nuevoPerfil('Organizador de Secciones');
  p.tema='Organizador para estandarizar mis aplicaciones HTML';
  p.descripcion='Diccionario de secciones (encabezado, menús, dashboards, gráficos, diagramas, selectores, notas, exportar/importar) con ejemplos visuales, para elegir características y generar un reporte/prompt para la IA.';
  p.usuario='Uso personal (Victor), en PC con 3 pantallas, Edge/Chrome.';
  return {app:'organizador-secciones',version:1,activo:p.id,perfiles:[p],custom:{},overrides:{},imgs:{},notas:[],ui:{tema:'oscuro',acento:'#4f8cff',vista:'proyecto',sug:{},filtroNotas:'pend'}};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||S.app!=='organizador-secciones')S=estadoInicial();
const P=()=>S.perfiles.find(p=>p.id===S.activo)||S.perfiles[0];
let tGuard;
function guardar(){
  $('#saved').textContent='Guardando…';$('#saved').style.color='var(--ac3)';
  clearTimeout(tGuard);tGuard=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(S));$('#saved').textContent='● Guardado';$('#saved').style.color='var(--ok)';$('#saved').title='Último guardado: '+hoy()}
    catch(e){$('#saved').textContent='⚠ Sin espacio';$('#saved').style.color='var(--dn)';toast('No se pudo guardar: quizá hay demasiadas imágenes. Exporta un respaldo.')}
  },250);
}
const secById=id=>SEC.find(s=>s.id===id);
const optsDe=sec=>sec.opts.concat((S.custom[sec.id]||[]).map(o=>({...o,custom:true})));
const kOf=(s,o)=>s+':'+o;
const promptDe=(secId,o)=>S.overrides[kOf(secId,o.id)]??o.p;

/* =========================================================
   Render: encabezado, nav
   ========================================================= */
function aplicarTema(){
  let t=S.ui.tema;if(t==='sistema')t=matchMedia('(prefers-color-scheme: light)').matches?'claro':'oscuro';
  document.body.dataset.tema=t;document.documentElement.style.setProperty('--ac',S.ui.acento);
}
function renderHeader(){
  $('#selPerfil').innerHTML=S.perfiles.map(p=>`<option value="${p.id}" ${p.id===S.activo?'selected':''}>${esc(p.nombre)}</option>`).join('');
  const tipo=(P().sel.tipo||[])[0];
  $('#selTipo').innerHTML=secById('tipo').opts.map(o=>`<option value="${o.id}" ${o.id===tipo?'selected':''}>${o.n}</option>`).join('');
  const pend=S.notas.filter(n=>n.estado!=='hecha').length;$('#fabN').textContent=pend;$('#fabN').style.display=pend?'':'none';
}
function renderNav(filtro=''){
  const p=P();let html=`<input type="search" id="buscar" placeholder="Buscar en el diccionario… Ctrl+K" value="${esc(filtro)}" style="margin-bottom:4px">`;
  const items=[VISTAS[0],...SEC,...VISTAS.slice(1)];
  let g='';const f=filtro.toLowerCase();
  items.forEach(it=>{
    let match=true,cnt='';
    if(SEC.includes(it)){
      const ops=optsDe(it);
      if(f)match=(it.titulo+' '+it.desc+' '+ops.map(o=>o.n+' '+o.d).join(' ')).toLowerCase().includes(f);
      cnt=`<span class="c">${(p.sel[it.id]||[]).length}/${ops.length}</span>`;
    }else if(f)match=it.titulo.toLowerCase().includes(f);
    if(!match)return;
    if(it.grupo!==g){g=it.grupo;html+=`<div class="g">${g}</div>`}
    html+=`<a data-v="${it.id}" class="${S.ui.vista===it.id?'on':''}"><span>${it.icono}</span>${it.titulo}${cnt}</a>`;
  });
  $('#nav').innerHTML=html;
  const b=$('#buscar');b.oninput=()=>{const v=b.value,pos=b.selectionStart;renderNav(v);const nb=$('#buscar');nb.focus();nb.setSelectionRange(pos,pos)};
}

/* =========================================================
   Render: vistas
   ========================================================= */
function render(){aplicarTema();renderHeader();renderNav($('#buscar')?.value||'');renderMain();renderNotas()}
function renderMain(){
  const v=S.ui.vista,m=$('#main');
  if(v==='proyecto')m.innerHTML=vistaProyecto();
  else if(v==='reporte')m.innerHTML=vistaReporte();
  else if(v==='manual')m.innerHTML=vistaManual();
  else if(v==='sugerencias')m.innerHTML=vistaSug();
  else{const s=secById(v);m.innerHTML=s?vistaSec(s):vistaProyecto()}
  m.scrollTop=0;marcarDemos();
}
function vistaProyecto(){
  const p=P();
  const tot=SEC.reduce((a,s)=>a+(p.sel[s.id]||[]).length,0);
  return `<h1>🏷 Proyecto</h1><p class="mt">Cada proyecto es una app que quieres pedir. El <b>tema principal</b> manda: las secciones dan la estructura estándar y la IA adapta todo al tema.</p>
  <div class="two">
   <div class="panel">
    <div class="fld"><label>Nombre de la app</label><input type="text" data-pf="nombre" value="${esc(p.nombre)}"></div>
    <div class="fld"><label>Tema principal (de qué trata, estilo, colores o marca)</label><input type="text" data-pf="tema" value="${esc(p.tema)}" placeholder="Ej. Control de obra para Grupo CGE, colores institucionales"></div>
    <div class="fld"><label>Qué hace / funciones principales</label><textarea data-pf="descripcion" placeholder="Describe las funciones…">${esc(p.descripcion)}</textarea></div>
    <div class="fld"><label>Quién la usa y dónde</label><input type="text" data-pf="usuario" value="${esc(p.usuario)}"></div>
    <div class="fld"><label>Prompt base / instrucción principal (opcional)</label><textarea data-pf="promptBase" placeholder="Instrucción libre que irá al inicio del reporte…">${esc(p.promptBase)}</textarea></div>
    <div class="fld" style="max-width:160px"><label>Versión</label><input type="text" data-pf="version" value="${esc(p.version||'1.0')}"></div>
   </div>
   <div>
    <div class="panel"><b>Proyectos</b><p class="mt" style="margin:4px 0 10px">Clic para activar.</p>
     <div class="plist">${S.perfiles.map(x=>`<div class="pit ${x.id===S.activo?'on':''}" data-pid="${x.id}"><span>${esc(x.nombre)}</span><small>${new Date(x.creado).toLocaleDateString('es-MX')}</small></div>`).join('')}</div>
     <div class="row" style="margin-top:10px"><button data-pa="nuevo">+ Nuevo</button><button data-pa="dup">Duplicar</button><button data-pa="del" class="dn">Borrar</button></div>
    </div>
    <div class="panel" style="margin-top:14px"><b>Resumen</b>
     <p class="mt" style="margin:6px 0">${tot} características elegidas en ${SEC.length} secciones.</p>
     ${SEC.map(s=>`<div class="row" style="justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd)"><a style="cursor:pointer" data-go="${s.id}">${s.icono} ${s.titulo}</a><small>${(p.sel[s.id]||[]).length}</small></div>`).join('')}
     <button class="pri" style="margin-top:12px;width:100%" data-go="reporte">📄 Generar reporte</button>
    </div>
   </div>
  </div>`;
}
function vistaSec(s){
  const p=P(),sel=p.sel[s.id]||[],ops=optsDe(s);
  let prev='';
  if(s.preview){const on=ops.filter(o=>sel.includes(o.id)&&o.hd);prev=`<h2>Vista previa combinada</h2><div class="mh" style="font-size:12px;padding:8px 10px">${on.map((o,i)=>(o.id==='guardado'?'<span class="sp"></span>':'')+o.hd).join(' ')||'<small>Elige elementos abajo</small>'}</div>`}
  return `<h1>${s.icono} ${s.titulo}</h1><p class="mt">${s.desc} ${s.single?'<span class="tag">ELECCIÓN ÚNICA</span>':''}</p>
  <div class="info">${s.info}</div>${prev}
  <div class="row" style="margin:16px 0 10px"><b style="flex:1">${sel.length} de ${ops.length} elegidas</b>
   ${s.single?'':`<button class="sm" data-sa="all">Todas</button><button class="sm" data-sa="none">Ninguna</button><button class="sm" data-sa="def">Predeterminadas</button>`}
   <button class="sm" data-sa="lamina" title="Descarga una imagen con las referencias visuales de lo que elegiste en esta sección">⬇ Lámina de lo elegido (PNG)</button><button class="sm pri" data-sa="add">+ Entrada propia</button></div>
  <div class="grid">${ops.map(o=>tarjeta(s,o,sel.includes(o.id))).join('')}</div>
  <h2>Nota de esta sección para la IA (este proyecto)</h2>
  <textarea data-ns="${s.id}" placeholder="Indicaciones extra de esta sección para este proyecto…">${esc(p.notasSec[s.id]||'')}</textarea>`;
}
function tarjeta(s,o,on){
  const k=kOf(s.id,o.id),img=S.imgs[k],ov=S.overrides[k]!=null;
  const demo=o.demo||(img?`<img src="${img}" style="max-width:100%;max-height:100%">`:`<div style="font-size:30px;opacity:.6">🧷</div>`);

const REGLAS=[
 'El TEMA PRINCIPAL manda: las secciones son la estructura estándar; adapta contenido, textos, íconos y (si se indica) colores al tema.',
 'Interfaz y textos en español (México); formatos de fecha dd/mm/aaaa, moneda MXN, hora 24 h.',
 'No perder datos nunca: autoguardado, confirmación antes de borrar y respaldo por exportación JSON.',
 'Entrega el código completo y funcional (no fragmentos), comentado por secciones.',
 'Si una imagen de referencia acompaña una característica, úsala como guía visual de forma y distribución, no como copia exacta.',
 'Al final, lista qué se implementó, qué quedó pendiente y sugerencias.'
];
function construir(p,{todo=false}={}){
  const bloques=[];
  SEC.forEach(s=>{
    const sel=p.sel[s.id]||[];
    const items=optsDe(s).filter(o=>todo||sel.includes(o.id)).map(o=>({n:o.n,d:o.d,p:promptDe(s.id,o),img:S.imgs[kOf(s.id,o.id)],k:kOf(s.id,o.id)}));
    const nota=todo?'':(p.notasSec[s.id]||'').trim();
    if(items.length||nota)bloques.push({s,items,nota});
  });
  return bloques;
}
function reporteMD(p,opc={}){const vis=opc.vis;
  const tipo=optsDe(secById('tipo')).find(o=>(p.sel.tipo||[])[0]===o.id);
  const bl=construir(p);let n=0;const imgs=[];
  let md=`# Especificación de aplicación: ${p.nombre}\n\n> Generado con Organizador de Secciones · ${hoy()} · versión solicitada ${p.version||'1.0'}\n\n`;
  md+=`## 1. Proyecto\n- **Nombre:** ${p.nombre}\n- **Tema principal:** ${p.tema||'(sin definir)'}\n- **Tipo:** ${tipo?tipo.n:'—'}\n`;
  if(p.descripcion)md+=`- **Qué hace:** ${p.descripcion}\n`;
  if(p.usuario)md+=`- **Usuario / entorno:** ${p.usuario}\n`;
  if(p.promptBase)md+=`\n## Instrucción principal\n${p.promptBase}\n`;
  md+=`\n## 2. Reglas generales\n${REGLAS.map(r=>'- '+r).join('\n')}\n`;
  n=2;
  bl.forEach(b=>{n++;md+=`\n## ${n}. ${b.s.titulo}\n`;
    b.items.forEach(it=>{md+=`- **${it.n}:** ${it.p}`;if(vis&&vis.has(it.k)){md+=` _(ver referencia visual ${vis.get(it.k).n})_`}else if(it.img){imgs.push(it);md+=` _(ver imagen de referencia ${imgs.length})_`}md+='\n'});
    if(b.nota)md+=`\n> Nota: ${b.nota}\n`;
  });
  if(imgs.length)md+=`\n## Imágenes de referencia\n${imgs.map((it,i)=>`${i+1}. ${it.n} — adjunta como imagen (${slug(it.n)}.jpg)`).join('\n')}\n`;
  if(vis&&vis.size)md+=`\n## Referencias visuales\nSe adjuntan láminas con imágenes numeradas. Úsalas como guía de forma, distribución y proporciones, no como copia exacta; si hay duda, manda el texto.\n`+[...vis.values()].map(v=>`${v.n}. ${v.sec} — ${v.nombre} → ${v.lam.split('/').pop()}`).join('\n')+'\n';
  return md;
}
function vistaReporte(){

function reporteHTML(p,todo=false,vis=null){
  const bl=construir(p,{todo});

    h+='<ul>'+b.items.map(it=>`<li><b>${esc(it.n)}</b>${todo?` — <span class="m">${esc(it.d)}</span><br>`:': '}${esc(it.p)}${vis&&vis.get(it.k)?`<img src="${vis.get(it.k).dataUrl}">`:it.img?`<img src="${it.img}">`:''}</li>`).join('')+'</ul>';
    if(b.nota)h+=`<p class="n">${esc(b.nota)}</p>`;});
  return (vis?h.replace('max-width:420px;max-height:300px','max-width:560px;max-height:460px'):h)+'</body></html>';

    modal('Importar proyecto',`<p>Proyecto: <b>${esc(d.perfil.nombre)}</b></p>`,[{t:'Cancelar'},{t:'Agregar como nuevo',c:'pri',fn:()=>{const np={...d.perfil,id:uid()};S.perfiles.push(np);S.activo=np.id;guardar();render();toast('Proyecto importado')}}]);

      {t:'Combinar',c:'pri',fn:()=>{const c=d.diccionario.custom||{};Object.keys(c).forEach(s=>{const a=S.custom[s]=S.custom[s]||[];c[s].forEach(o=>{const i=a.findIndex(x=>x.id===o.id);i>=0?a[i]=o:a.push(o)})});Object.assign(S.overrides,d.diccionario.overrides||{});Object.assign(S.imgs,d.diccionario.imgs||{});guardar();render();toast('Diccionario combinado')}}]);
  }else if(d.tipo==='completo'){
    const x=d.datos;
    modal('Importar respaldo completo',`<p>${x.perfiles.length} proyectos · ${x.notas.length} notas · exportado ${new Date(d.exportado).toLocaleString('es-MX')}</p><p class="mt">Antes de aplicar se descarga un respaldo de lo actual.</p>`,
     [{t:'Cancelar'},{t:'Reemplazar todo',fn:()=>{exportar('full');S=x;guardar();render();toast('Respaldo restaurado')}},
      {t:'Combinar',c:'pri',fn:()=>{exportar('full');x.perfiles.forEach(p=>{if(!S.perfiles.some(q=>q.id===p.id))S.perfiles.push(p)});x.notas.forEach(n=>{if(!S.notas.some(q=>q.id===n.id))S.notas.push(n)});
        Object.keys(x.custom||{}).forEach(s=>{const a=S.custom[s]=S.custom[s]||[];x.custom[s].forEach(o=>{if(!a.some(q=>q.id===o.id))a.push(o)})});S.overrides={...x.overrides,...S.overrides};S.imgs={...x.imgs,...S.imgs};guardar();render();toast('Respaldo combinado')}}]);
  }else toast('Tipo de archivo desconocido');
}

/* =========================================================
   Notas
   ========================================================= */
const secNombre=id=>id==='general'?'General':(secById(id)||VISTAS.find(v=>v.id===id)||{titulo:id}).titulo;
function renderNotas(){
  $('#nSec').innerHTML=`<option value="general">General</option>`+[...VISTAS.slice(0,1),...SEC,...VISTAS.slice(1)].map(s=>`<option value="${s.id}" ${s.id===S.ui.vista?'selected':''}>${s.titulo}</option>`).join('');
  const f=S.ui.filtroNotas||'pend';$$('#nFil button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  const ord={alta:0,media:1,baja:2};
  const L=S.notas.filter(n=>f==='todas'||(f==='pend'?n.estado!=='hecha':n.estado==='hecha')).sort((a,b)=>ord[a.prio]-ord[b.prio]||b.fecha.localeCompare(a.fecha));
  $('#nList').innerHTML=L.length?L.map(n=>`<div class="nota ${n.estado==='hecha'?'hecha':''}" data-nid="${n.id}">
   <div class="row"><span class="pill ${n.prio==='alta'?'d':n.prio==='media'?'w':''}">${n.prio}</span><small style="flex:1">📍 ${esc(secNombre(n.sec))} · ${new Date(n.fecha).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})}</small></div>
   <div class="t">${esc(n.txt)}</div>
   <div class="row"><button class="sm" data-na="ok">${n.estado==='hecha'?'↺ Reabrir':'✔ Corregida'}</button><button class="sm" data-na="edit">✎</button><button class="sm dn" data-na="del">🗑</button></div></div>`).join(''):'<p class="mt" style="text-align:center">Sin notas aquí.</p>';
  renderHeader();
}
function notasMD(){
  const p=P(),pend=S.notas.filter(n=>n.estado!=='hecha');
  let md=`# Correcciones solicitadas — ${p.nombre} (v${p.version||'1.0'})\n\n> ${hoy()} · ${pend.length} pendientes. Aplica estas correcciones sobre el archivo adjunto, sin romper lo que ya funciona, y devuelve el archivo completo con la versión incrementada.\n`;
  const g={};pend.forEach(n=>(g[n.sec]=g[n.sec]||[]).push(n));
  Object.keys(g).forEach(s=>{md+=`\n## ${secNombre(s)}\n`+g[s].map(n=>`- [${n.prio}] ${n.txt}`).join('\n')+'\n'});
  return md;
}
function abrirNotas(v){$('#notas').classList.toggle('open',v??!$('#notas').classList.contains('open'));if($('#notas').classList.contains('open')){renderNotas();$('#nTxt').focus()}}
$('#fab').onclick=()=>abrirNotas();$('#nClose').onclick=()=>abrirNotas(false);
$('#nExp').onclick=()=>modal('Exportar notas','<p>Las notas pendientes se exportan como "prompt de corrección" para pegarlo a la IA junto con el archivo de la app.</p>',[{t:'Cerrar'},{t:'Copiar',fn:()=>{navigator.clipboard.writeText(notasMD()).then(()=>toast('Copiado'))}},{t:'Descargar .md',c:'pri',fn:()=>exportar('notas')}]);
$('#nAdd').onclick=()=>{const t=$('#nTxt').value.trim();if(!t)return;S.notas.push({id:uid(),txt:t,sec:$('#nSec').value,prio:$('#nPrio').value,estado:'pend',fecha:new Date().toISOString()});$('#nTxt').value='';guardar();renderNotas();toast('Nota agregada')};
$('#nTxt').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('#nAdd').click()});
$('#nFil').onclick=e=>{const b=e.target.closest('button');if(b){S.ui.filtroNotas=b.dataset.f;guardar();renderNotas()}};
$('#nList').onclick=e=>{const b=e.target.closest('[data-na]');if(!b)return;const n=S.notas.find(x=>x.id===b.closest('[data-nid]').dataset.nid);
  if(b.dataset.na==='ok'){n.estado=n.estado==='hecha'?'pend':'hecha';guardar();renderNotas()}
  if(b.dataset.na==='edit')modal('Editar nota',`<textarea id="enT">${esc(n.txt)}</textarea>`,[{t:'Cancelar'},{t:'Guardar',c:'pri',fn:ov=>{n.txt=ov.querySelector('#enT').value;guardar();renderNotas()}}]);
  if(b.dataset.na==='del'){const i=S.notas.indexOf(n);S.notas.splice(i,1);guardar();renderNotas();toast('Nota borrada')}
};

addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportar('full')}

/* =========================================================
   Referencias visuales: descargar las demos como imagen PNG
   (para dárselas a la IA como guía visual, sin depender del prompt)
   ========================================================= */
const REFW=360,REFH=170,REFSC=2,REFPAD=14,REFHEAD=40;
const REFVARS=['--bg','--pn','--pn2','--bd','--tx','--mt','--mut','--mut2','--ac','--ac2','--ac3','--dn','--ok','--r'];
const refVars=()=>{const cs=getComputedStyle(document.body),o={};REFVARS.forEach(v=>o[v]=cs.getPropertyValue(v).trim());return o};
const cargarImg=src=>new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>ko(new Error('No cargó la imagen'));im.src=src});
const canvasBlob=c=>new Promise((ok,ko)=>c.toBlob(b=>b?ok(b):ko(new Error('canvas')),'image/png'));
const blobBytes=async b=>new Uint8Array(await b.arrayBuffer());
const txtBytes=t=>new TextEncoder().encode(t);
const pad2=n=>String(n).padStart(2,'0');
const corto=s=>slug(s).slice(0,40);
function descargarBlob(nombre,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2500)}
function opcPorK(k){const [sid,oid]=k.split(':'),s=secById(sid);return {s,o:s?optsDe(s).find(x=>x.id===oid):null}}

/* ZIP mínimo (sin compresión) para empaquetar varios archivos sin librerías */
function crc32(u8){if(!crc32.t){crc32.t=[];for(let n=0,c;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}
  let crc=-1;for(let i=0;i<u8.length;i++)crc=crc32.t[(crc^u8[i])&255]^(crc>>>8);return(crc^-1)>>>0}
function zip(files){
  const parts=[],cd=[];let off=0;
  const d=new Date(),dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(f=>{
    const nm=txtBytes(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+sz;
  });
  const cds=cd.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cds,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type:'application/zip'});
}

/* Dibuja el HTML/SVG de una demo con los mismos estilos de la app y lo devuelve como imagen */
async function demoAImagen(html){
  const vars=refVars();
  const host=document.createElement('div');
  host.style.cssText=`position:fixed;left:-9999px;top:0;width:${REFW}px;pointer-events:none`;
  host.innerHTML=`<div class="demo" style="width:${REFW}px;height:auto;min-height:${REFH}px;border:0">${html}</div>`;
  document.body.append(host);
  const d=host.firstElementChild,h=Math.max(REFH,Math.ceil(d.offsetHeight));
  d.style.minHeight='';d.style.height=h+'px';d.style.overflow='hidden';
  const xhtml=new XMLSerializer().serializeToString(d);
  host.remove();
  const css=document.querySelector('style').textContent;
  const defs=document.querySelector('svg defs')?.innerHTML||'';
  const st=Object.entries(vars).filter(([,v])=>v).map(([k,v])=>`${k}:${v}`).join(';');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${REFW}" height="${h}" viewBox="0 0 ${REFW} ${h}" style="${st};font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;color:${vars['--tx']}"><defs>${defs}</defs><style><![CDATA[${css}]]></style><foreignObject x="0" y="0" width="${REFW}" height="${h}">${xhtml}</foreignObject></svg>`;
  const img=await cargarImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
  return {img,h};
}

/* Imagen final de UNA referencia: nombre de la sección + de la opción arriba, la vista abajo */
async function renderReferencia(s,o,{num=0,preferUp=false}={}){
  const k=kOf(s.id,o.id),up=S.imgs[k];
  let src,h,dw=0,dh=0,esDemo=false;
  if(o.demo&&!(preferUp&&up)){const r=await demoAImagen(o.demo);src=r.img;h=r.h;esDemo=true}
  else if(up){src=await cargarImg(up);const sc=Math.min(REFW/src.width,280/src.height,1);dw=src.width*sc;dh=src.height*sc;h=Math.max(REFH,Math.round(dh))}
  else throw new Error('Sin referencia visual');
  const v=refVars(),W=REFW+REFPAD*2,H=REFHEAD+h+REFPAD*2,c=document.createElement('canvas');
  c.width=W*REFSC;c.height=H*REFSC;
  const x=c.getContext('2d');x.scale(REFSC,REFSC);
  const fuente='"Segoe UI",system-ui,sans-serif',fit=(t,mx)=>{while(t.length>3&&x.measureText(t).width>mx)t=t.slice(0,-2).trimEnd()+'…';return t};
  x.fillStyle=v['--pn']||'#151a23';x.fillRect(0,0,W,H);
  x.textBaseline='alphabetic';
  x.fillStyle=v['--mt']||'#8f9bb0';x.font='600 11px '+fuente;x.fillText(fit((num?num+' · ':'')+s.titulo,REFW),REFPAD,REFPAD+12);
  x.fillStyle=v['--tx']||'#e7eaf0';x.font='700 15px '+fuente;x.fillText(fit(o.n,REFW),REFPAD,REFPAD+32);
  const py=REFPAD+REFHEAD,rr=(a,b,w,hh,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+hh,r);x.arcTo(a+w,b+hh,a,b+hh,r);x.arcTo(a,b+hh,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
  x.save();rr(REFPAD,py,REFW,h,10);x.clip();
  if(esDemo)x.drawImage(src,REFPAD,py,REFW,h);
  else{x.fillStyle=v['--pn2']||'#1c2330';x.fillRect(REFPAD,py,REFW,h);x.drawImage(src,REFPAD+(REFW-dw)/2,py+(h-dh)/2,dw,dh)}
  x.restore();
  rr(REFPAD+.5,py+.5,REFW-1,h-1,10);x.strokeStyle=v['--bd']||'#283141';x.lineWidth=1;x.stroke();
  return c;
}

/* Junta varias referencias en una sola lámina (2 columnas) */
function componerLamina(cs,titulo){
  const cols=cs.length>1?2:1,gap=12*REFSC,top=44*REFSC,cw=cs[0].width;
  const filas=[];for(let i=0;i<cs.length;i+=cols)filas.push(cs.slice(i,i+cols));
  const hs=filas.map(f=>Math.max(...f.map(c=>c.height)));
  const W=cols*cw+(cols+1)*gap,H=top+hs.reduce((a,b)=>a+b+gap,0);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d'),v=refVars();
  x.fillStyle=v['--bg']||'#0e1117';x.fillRect(0,0,W,H);
  x.fillStyle=v['--tx']||'#e7eaf0';x.font=`700 ${16*REFSC}px "Segoe UI",system-ui,sans-serif`;x.textBaseline='middle';x.fillText(titulo,gap,top/2);
  let y=top;filas.forEach((f,i)=>{f.forEach((cc,j)=>x.drawImage(cc,gap+j*(cw+gap),y));y+=hs[i]+gap});
  return c;
}

/* --- Botón "⬇ Referencia" de cada tarjeta --- */
async function descargarReferencia(k){
  const {s,o}=opcPorK(k);if(!o)return;
  try{const c=await renderReferencia(s,o);descargarBlob(`Ref_${corto(s.titulo)}_${corto(o.n)}.png`,await canvasBlob(c));toast('Referencia descargada (PNG)')}
  catch(e){console.error(e);toast('No se pudo generar la imagen en este navegador')}
}
/* --- Botón "Lámina de lo elegido" de cada sección --- */
async function descargarLamina(s){
  const sel=P().sel[s.id]||[],ops=optsDe(s).filter(o=>sel.includes(o.id)&&(o.demo||S.imgs[kOf(s.id,o.id)]));
  if(!ops.length)return toast('Lo elegido en esta sección no tiene imagen de referencia');
  toast('Generando lámina…');
  try{
    const cs=[];for(let i=0;i<ops.length;i++)cs.push(await renderReferencia(s,ops[i],{num:i+1,preferUp:true}));
    const hojas=[];for(let i=0;i<cs.length;i+=6)hojas.push(componerLamina(cs.slice(i,i+6),`${s.titulo} — ${P().nombre}`));
    if(hojas.length===1)descargarBlob(`Lamina_${corto(s.titulo)}_${fstamp()}.png`,await canvasBlob(hojas[0]));
    else{const fl=[];for(let i=0;i<hojas.length;i++)fl.push({name:`Lamina_${corto(s.titulo)}_${i+1}.png`,data:await blobBytes(await canvasBlob(hojas[i]))});descargarBlob(`Laminas_${corto(s.titulo)}_${fstamp()}.zip`,zip(fl))}
    toast('Lámina descargada')
  }catch(e){console.error(e);toast('No se pudo generar la lámina')}
}
/* --- Exportaciones del reporte con imágenes --- */
function visualesDelReporte(p){
  const its=[];let n=0;
  construir(p).forEach(b=>b.items.forEach(it=>{
    const {s,o}=opcPorK(it.k);if(!o||(!o.demo&&!it.img))return;
    n++;its.push({n,k:it.k,s,o,sec:s.titulo,nombre:it.n});
  }));
  return its;
}
async function paqueteVisual(p,modo='todo'){
  toast('Generando imágenes…');
  try{
    const its=visualesDelReporte(p);
    if(!its.length)return toast('Lo elegido no tiene imágenes de referencia');
    const files=[],porSec=new Map(),nom=slug(p.nombre);
    for(const it of its){
      it.c=await renderReferencia(it.s,it.o,{num:it.n,preferUp:true});
      it.file=`Individuales/${pad2(it.n)}_${corto(it.s.titulo)}_${corto(it.o.n)}.png`;
      if(modo==='todo')files.push({name:it.file,data:await blobBytes(await canvasBlob(it.c))});
      if(!porSec.has(it.s.id))porSec.set(it.s.id,[]);porSec.get(it.s.id).push(it);
    }
    let ls=0;
    for(const arr of porSec.values()){ls++;
      const hojas=[];for(let i=0;i<arr.length;i+=6)hojas.push(arr.slice(i,i+6));
      for(let i=0;i<hojas.length;i++){
        const nm=`Laminas/Lamina_${pad2(ls)}_${corto(arr[0].s.titulo)}${hojas.length>1?'_'+(i+1):''}.png`;
        hojas[i].forEach(a=>a.lam=nm);
        files.push({name:nm,data:await blobBytes(await canvasBlob(componerLamina(hojas[i].map(a=>a.c),`${arr[0].s.titulo} — ${p.nombre}`)))});
      }
    }
    if(modo==='todo'){
      const vis=new Map();its.forEach(a=>vis.set(a.k,{n:a.n,file:a.file,lam:a.lam,sec:a.sec,nombre:a.nombre}));
      files.unshift({name:`Reporte_${nom}.md`,data:txtBytes(reporteMD(p,{vis}))});
      files.push({name:'LEEME.txt',data:txtBytes('Cómo usarlo con Claude\r\n\r\n1) Adjunta Reporte_'+nom+'.md (o pega su contenido).\r\n2) Adjunta las imágenes de la carpeta Laminas (una por sección, numeradas).\r\n3) Pide los cambios citando el número de referencia, por ejemplo: "usa la distribución de la referencia 3".\r\n\r\nLa carpeta Individuales trae cada referencia por separado por si solo quieres adjuntar una.\r\n')});
    }
    descargarBlob(`${modo==='todo'?'Reporte_visual':'Laminas'}_${nom}_${fstamp()}.zip`,zip(files));
    toast(`Listo: ${its.length} referencias`);
  }catch(e){console.error(e);toast('No se pudo generar el paquete de imágenes')}
}
async function reporteVisual(p){
  toast('Generando imágenes…');
  try{
    const its=visualesDelReporte(p),vis=new Map();
    if(!its.length)return toast('Lo elegido no tiene imágenes de referencia');
    for(const it of its){const c=await renderReferencia(it.s,it.o,{num:it.n,preferUp:true});vis.set(it.k,{dataUrl:c.toDataURL('image/png')})}
    descargar(`Reporte_visual_${slug(p.nombre)}_${fstamp()}.html`,reporteHTML(p,false,vis),'text/html');
    toast('Reporte visual descargado');
  }catch(e){console.error(e);toast('No se pudo generar el reporte visual')}
}
