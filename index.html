<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis apps</title>
<meta name="theme-color" content="#121821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis apps">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121821'/%3E%3Cg fill='%23F5B82E'%3E%3Crect x='14' y='14' width='15' height='15' rx='4'/%3E%3Crect x='35' y='14' width='15' height='15' rx='4'/%3E%3Crect x='14' y='35' width='15' height='15' rx='4'/%3E%3Crect x='35' y='35' width='15' height='15' rx='4' opacity='.55'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--bg:#F3F5F8;--sf:#FFFFFF;--ink:#16202B;--mu:#5C6878;--ln:#DCE2EA;--acc:#C98A0A;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E131A;--sf:#161D27;--ink:#E8EDF3;--mu:#94A0B0;--ln:#253040;--acc:#F5B82E;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0E131A;--sf:#161D27;--ink:#E8EDF3;--mu:#94A0B0;--ln:#253040;--acc:#F5B82E;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 16px 48px}
header{margin-bottom:24px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
a.app{display:flex;gap:14px;align-items:center;padding:18px;border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
a.app:hover{transform:translateY(-2px);border-color:var(--acc)}
a.app:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff}
.ic svg{width:28px;height:28px}
.tx b{display:block;font-size:17px}
.tx span{display:block;color:var(--mu);font-size:14px;margin-top:2px}
.go{margin-left:auto;color:var(--acc);font-size:22px;font-weight:700}
footer{margin-top:28px;color:var(--mu);font-size:13px}
</style>
</head>
<body>
<main>
<header>
<h1>Mis apps</h1>
<p>Toca una para abrirla. Guarda esta página en favoritos o en la pantalla de inicio.</p>
</header>
<div class="grid" id="apps"></div>
<footer>Cada app guarda tus datos en tu cuenta; esta página solo tiene los accesos.</footer>
</main>
<script>
/* Para agregar una app nueva: súmala a esta lista con el nombre de su carpeta. */
var APPS=[
 {dir:'registro-cripto',name:'Registro de actividad',desc:'Ciclos de compra y venta de cripto, posiciones y brokers',color:'#1F8A7E',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>'},
 {dir:'inventario',name:'Mi cuarto · Inventario',desc:'Lo que tengo, cuándo lo compré y cuánto costó',color:'#4472D8',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>'}
];
document.getElementById('apps').innerHTML=APPS.map(function(a){
 return '<a class="app" href="./'+a.dir+'/"><span class="ic" style="background:'+a.color+'">'+a.icon+'</span><span class="tx"><b>'+a.name+'</b><span>'+a.desc+'</span></span><span class="go" aria-hidden="true">›</span></a>';
}).join('');
</script>
</body>
</html>
