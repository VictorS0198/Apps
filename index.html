<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis apps</title>
<meta name="theme-color" content="#121821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis apps">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121821'/%3E%3Cg fill='%23F5B82E'%3E%3Crect x='14' y='14' width='15' height='15' rx='4'/%3E%3Crect x='35' y='14' width='15' height='15' rx='4'/%3E%3Crect x='14' y='35' width='15' height='15' rx='4'/%3E%3Crect x='35' y='35' width='15' height='15' rx='4' opacity='.55'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--bg:#F3F5F8;--sf:#FFFFFF;--ink:#16202B;--mu:#5C6878;--ln:#DCE2EA;--acc:#C98A0A;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E131A;--sf:#161D27;--ink:#E8EDF3;--mu:#94A0B0;--ln:#253040;--acc:#F5B82E;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0E131A;--sf:#161D27;--ink:#E8EDF3;--mu:#94A0B0;--ln:#253040;--acc:#F5B82E;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 16px 48px}
header{margin-bottom:24px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
a.app{display:flex;gap:14px;align-items:center;padding:18px;border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
a.app:hover{transform:translateY(-2px);border-color:var(--acc)}
a.app:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff}
.ic svg{width:28px;height:28px}
.tx b{display:block;font-size:17px}
.tx span{display:block;color:var(--mu);font-size:14px;margin-top:2px}
.go{margin-left:auto;color:var(--acc);font-size:22px;font-weight:700}
footer{margin-top:28px;color:var(--mu);font-size:13px}
</style>
</head>
<body>
<main>
<header>
<h1>Mis apps</h1>
<p>Toca una para abrirla. Guarda esta página en favoritos o en la pantalla de inicio.</p>
</header>
<div class="grid" id="apps"></div>
<footer>Cada app guarda tus datos en tu cuenta; esta página solo tiene los accesos.</footer>
</main>
<script>
/* Para agregar una app nueva: súmala a esta lista con el nombre de su carpeta. */
var APPS=[
 {dir:'registro-cripto',name:'Registro de actividad',desc:'Ciclos de compra y venta de cripto, posiciones y brokers',color:'#1F8A7E',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>'},
 {dir:'mapa-flujos',name:'Mapa de flujos cripto',desc:'Cómo entra, se mueve y sale tu dinero: cuentas, exchanges, grupos de monedas y tiendas',color:'#C9962B',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 6h9"/><path d="M6.5 8.2l4 7.5"/><path d="M17.5 8.2l-4 7.5"/></svg>'},
 {dir:'llavero',name:'Llavero',desc:'Control y auditoría de tus cuentas. Se abre vacío; tus datos quedan en tu navegador y, si quieres, en Supabase cifrados',color:'#7A5AC8',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3"/><path d="M16 7l3 3"/><path d="M14 9l2 2"/></svg>'},
 {dir:'cotizador',name:'Cotizador de arquitectura',desc:'Honorarios de proyectos: alcance, catálogo de precios, documento e historial',color:'#2D5C88',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6"/><path d="M2 21h20"/></svg>'},
 {dir:'inventario',name:'Mi cuarto · Inventario',desc:'Lo que tengo, cuándo lo compré y cuánto costó',color:'#4472D8',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>'},
 {dir:'laminas',name:'Editor de Láminas',desc:'Compón láminas con imágenes, texto y cajetín; recorta, quita fondos y exporta a PDF, PowerPoint, PNG, TIFF o SVG',color:'#E07A1F',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="16" rx="1.5"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/><path d="M11 15h4"/></svg>'},
 {dir:'estados-de-cuenta',name:'Estados de cuenta',desc:'Unifica, cuadra y grafica tus estados de cuenta. Se abre vacío; tus datos los importas tú o viven en tu Supabase',color:'#B8742A',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>'},
 {dir:'horarios',name:'Mis Horarios',desc:'Tus horarios de prepa, idiomas y Arquitectura: semana, calendario, gráficas y reporte en PDF',color:'#3A7D5C',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M8 13h3v3H8z"/></svg>'},
 {dir:'organizador-secciones',name:'Organizador de Secciones',desc:'Estandariza tus apps: elige secciones y referencias visuales, y genera el reporte con imágenes para la IA',color:'#4F8CFF',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7"/><path d="M17.5 14v7"/></svg>'},
 {dir:'optica',name:'Banco Óptico',desc:'Laboratorio de óptica: Snell y Fresnel, lentes, espejos, prisma, interferencia y polarización, con fórmulas y gráficas',color:'#2746C2',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.5 3 2.5 15 0 18c-2.5-3-2.5-15 0-18z"/><path d="M2 8h8"/><path d="M2 16h8"/><path d="M14 9l8 3"/><path d="M14 15l8-3"/></svg>'},
 {dir:'aula-apps',name:'Aula de Apps',desc:'Aprende cómo funcionan las apps de Android y Windows: proyectos, ciclo de vida, comparador de frameworks, lenguajes y portabilidad',color:'#0F7A4D',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="13" height="10" rx="1.5"/><path d="M6 18h5"/><path d="M8.5 14v4"/><rect x="16" y="8" width="6" height="12" rx="1.5"/><path d="M18.5 17h1"/></svg>'},
 {dir:'gimnasio',name:'Gimnasio · Bitácora',desc:'Entrenamientos, asistencia con calendario, cronómetros y descansos, y notas de cambios. Se abre vacío; tus datos quedan en tu navegador',color:'#D6402F',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3.5 9v6"/><path d="M20.5 9v6"/><path d="M6.5 12h11"/></svg>'},
 {dir:'gta-online',name:'Registro Los Santos',desc:'Lo que tienes en GTA Online: vehículos, propiedades, negocios y mejoras, con avance, ahorro y lista de deseos',color:'#B83280',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2.5-5h10l4 5H21v4h-2"/><path d="M3 13v4h2"/><path d="M9 17h6"/><path d="M3 13h18"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>'},
 {dir:'materia',name:'Laboratorio de la Materia',desc:'Ondas en líquidos, tabla periódica con estados de la materia, reacciones, dinámica de fluidos y simulador de fuego',color:'#1D58C8',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/></svg>'},
];
document.getElementById('apps').innerHTML=APPS.map(function(a){
 return '<a class="app" href="./'+a.dir+'/"><span class="ic" style="background:'+a.color+'">'+a.icon+'</span><span class="tx"><b>'+a.name+'</b><span>'+a.desc+'</span></span><span class="go" aria-hidden="true">›</span></a>';
}).join('');
</script>
</body>
</html>
