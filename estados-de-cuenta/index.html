const cl=C.reduce((a,x)=>a+x.length,0);return new Blob([...P,...C,new Uint8Array([0x50,0x4B,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cl),...u32(off),0,0])],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
const colL=i=>{let s="";for(i++;i>0;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s};
function sheetXml(rows){const cols=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(!cols.includes(k))cols.push(k)}));
const cell=(v,r,c)=>{const ref=colL(c)+r;if(v===""||v==null)return"";if(typeof v=="number"&&isFinite(v))return`<c r="${ref}"><v>${v}</v></c>`;if(typeof v=="boolean")return`<c r="${ref}" t="b"><v>${v?1:0}</v></c>`;return`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`};

async function unzip(buf){const v=new DataView(buf),u=new Uint8Array(buf);let e=u.length-22;while(e>=0&&v.getUint32(e,true)!=0x06054b50)e--;if(e<0)throw new Error("no es un archivo Excel válido");

const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true),raw=u.subarray(ds,ds+cs);
