<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de actividad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#E9EEF2;--sf:#fff;--ink:#16212C;--mu:#5B6B7A;--ln:#D3DBE2;--sell:#B23A48;--buy:#1B7F79;--amb:#B7791F;--sell-bg:#F6E3E5;--buy-bg:#DDF0EE;--amb-bg:#F7EBD2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1720;--sf:#18232F;--ink:#E6EDF3;--mu:#93A3B3;--ln:#2C3B4A;--sell:#F0808C;--buy:#5CC7BF;--amb:#E5B45A;--sell-bg:#3A2226;--buy-bg:#17322F;--amb-bg:#372D18}}
:root[data-theme="dark"]{--bg:#0F1720;--sf:#18232F;--ink:#E6EDF3;--mu:#93A3B3;--ln:#2C3B4A;--sell:#F0808C;--buy:#5CC7BF;--amb:#E5B45A;--sell-bg:#3A2226;--buy-bg:#17322F;--amb-bg:#372D18}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,Arial,sans-serif;position:relative}
main{max-width:none;margin:0;padding:20px clamp(14px,2vw,32px) 60px;position:relative;z-index:1}
h1{font-size:26px;margin:0 0 4px;font-weight:600}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.sub{color:var(--mu);margin:0 0 10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mu)}
.wide2{grid-column:span 2}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;margin-top:3px;padding:8px;border:2px solid var(--ln);border-radius:6px;background:var(--bg)}
input[readonly]{color:var(--mu)}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:8px 12px}
button.p{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
button.p:disabled{opacity:.4;cursor:not-allowed}
button.ghost{border:0;background:none;text-decoration:underline;padding:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.pair{display:grid;grid-template-columns:1fr 92px;gap:6px}
.tabs button{border-radius:20px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tabs .tab-ord{border-radius:20px;min-width:40px;color:var(--mu)}
.tabs.reorder button[id^="t"]:not(#tabOrd){cursor:grab;border-style:dashed;padding-left:4px;padding-right:4px}
.tabs.reorder .tab-ord{color:var(--ink);font-weight:600}
.tabs .tmv{display:inline-block;padding:0 7px;font-weight:700;opacity:.65;cursor:pointer}
.tabs .tmv:hover{opacity:1}
.tabs .dragging{opacity:.4}
.hold-wrap{margin-top:12px;border-top:1px solid var(--ln);padding-top:10px}
.hold-wrap>summary{cursor:pointer}
.hold-in{margin-top:10px}.hold-in>h2{display:none}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;border:0;cursor:pointer}
.abierto{background:var(--sell-bg);color:var(--sell)}.parcial{background:var(--amb-bg);color:var(--amb)}.cerrado{background:var(--buy-bg);color:var(--buy)}
.VENTA{color:var(--sell)}.COMPRA{color:var(--buy)}
.bar{height:7px;border-radius:4px;background:var(--sell-bg);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--buy)}
.bar.b{background:var(--buy-bg)}.bar.b i{background:var(--sell)}
.mv{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;padding:2px 0;border-top:1px dashed var(--ln);font-size:13px}
.mv:first-of-type{border-top:0}
.cyc-card{padding:10px 12px}
.cyc-head{gap:6px;margin-bottom:2px}
.cyc-foot{margin-top:6px;gap:8px}
.mu{color:var(--mu);font-size:13px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln);font-size:13px;white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:12px}
.x{padding:2px 8px;color:var(--sell);background:transparent;border-color:transparent;text-decoration:underline}
.empty{color:var(--mu);padding:18px;text-align:center}
.pricebox{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pricebox button{background:var(--bg);font-size:13px}
.pricebox button b{font-family:"IBM Plex Mono",monospace}
.chartgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
svg.chart{width:100%;height:auto;display:block}
.chart text{font:11px "IBM Plex Sans",sans-serif;fill:var(--mu)}
.fxrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.fxrow>div{flex:1;min-width:160px}
.req.invalid{border-color:var(--sell);background:var(--sell-bg)}
.req.valid{border-color:var(--buy);background:var(--buy-bg)}
.taglist{display:flex;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:3px 4px 3px 8px;margin:3px 5px 3px 0;font-size:13px}
.tag button{border:0;background:none;color:var(--sell);cursor:pointer;padding:0 6px;font-size:15px;line-height:1}
.addrow{margin-top:10px}
.addrow input{max-width:170px;display:inline-block;width:auto}
.coin-ic{vertical-align:middle;border-radius:50%;margin-right:5px;flex:none;object-fit:cover}
.coin-ic-fb{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ln);color:var(--ink);font-weight:600;flex:none;margin-right:5px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.brand-logo{width:60px;height:60px;border-radius:14px;object-fit:cover;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.banner{display:none;background:var(--amb-bg);color:var(--amb);padding:8px 10px;border-radius:8px;margin-bottom:10px;gap:10px;align-items:center}
.banner button{color:var(--amb)}
#watermark{position:fixed;z-index:0;pointer-events:none}
#watermark.text-mode{inset:-10%;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;gap:28px;transform:rotate(-14deg) scale(1.3);opacity:.05;font-weight:700;font-size:40px;color:var(--ink);user-select:none}
#watermark.img-mode{inset:0;background-repeat:no-repeat;background-position:center;background-size:55% auto;opacity:.10}
#watermark span{white-space:nowrap}
.bgrow{align-items:center;margin-bottom:6px}
.bgthumb{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--ln)}
.lot{border-top:1px dashed var(--ln);padding:6px 0}
.lot-head{gap:6px}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--sf);border:1px solid var(--ln);border-radius:8px;max-height:240px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.22);margin-top:2px}
.combo-item{padding:7px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
.combo-item:hover,.combo-item.on{background:var(--bg)}
.combo-item[data-v="__add__"]{color:var(--buy);border-top:1px solid var(--ln)}
details>summary{padding:4px 0}
#printArea{display:none}
@media print{
 @page{margin:14mm}
 body.printing main,body.printing #watermark{display:none!important}
 body.printing #printArea{display:block}
 body.printing{background:#fff!important}
 #printArea,#printArea *{color:#111!important;background:transparent!important}
 #printArea h1{font-size:20px;margin:0 0 2px}
 #printArea h2{font-size:15px;margin:14px 0 4px;border-bottom:1px solid #999;padding-bottom:2px}
 #printArea table{width:100%;min-width:0;border-collapse:collapse}
 #printArea th,#printArea td{border-bottom:1px solid #ccc;padding:4px 6px;font-size:12px;text-align:left}
 #printArea th.r,#printArea td.r{text-align:right}
 .rep-head{display:flex;gap:12px;align-items:center;margin-bottom:8px}
 .rep-head img{width:56px;height:56px;border-radius:10px}
}
:root[data-theme="medianoche"]{--bg:#0B1020;--sf:#131A33;--ink:#E8ECFF;--mu:#9AA6D1;--ln:#263056;--sell:#FF7A8A;--buy:#5EE0C0;--amb:#F2C063;--sell-bg:#3A1F2C;--buy-bg:#123A3A;--amb-bg:#3A3015}
:root[data-theme="oro"]{--bg:#0D0D0D;--sf:#1A1A1A;--ink:#F3E7C4;--mu:#B5A47A;--ln:#3A3220;--sell:#E57373;--buy:#7FD18B;--amb:#D4AF37;--sell-bg:#3A1E1E;--buy-bg:#1E3322;--amb-bg:#3A3115}
:root[data-theme="grafito"]{--bg:#1E1F22;--sf:#2A2C30;--ink:#E6E6E6;--mu:#A0A3A8;--ln:#3F4248;--sell:#F28B82;--buy:#81C995;--amb:#FDD663;--sell-bg:#3B2626;--buy-bg:#243A2B;--amb-bg:#3B3520}
:root[data-theme="oceano"]{--bg:#E3F2F7;--sf:#FFFFFF;--ink:#0B2E3B;--mu:#4F7686;--ln:#BCD9E3;--sell:#C0392B;--buy:#0E8C7F;--amb:#B7791F;--sell-bg:#FBE4E1;--buy-bg:#D9F1EE;--amb-bg:#F7EBD2}
:root[data-theme="bosque"]{--bg:#E8F0E4;--sf:#FBFDF9;--ink:#1E2F1F;--mu:#5C7060;--ln:#C9D9C3;--sell:#B23A48;--buy:#2E7D32;--amb:#9A6B12;--sell-bg:#F6E3E5;--buy-bg:#DCEFD9;--amb-bg:#F3E8CB}
:root[data-theme="atardecer"]{--bg:#FBEFE6;--sf:#FFFDFB;--ink:#3B2418;--mu:#8A6A58;--ln:#EBD3C2;--sell:#C0392B;--buy:#2F7D6B;--amb:#B7611F;--sell-bg:#FBE0DA;--buy-bg:#DDF0EA;--amb-bg:#FAE5CF}
:root[data-theme="lavanda"]{--bg:#EFEAF7;--sf:#FFFFFF;--ink:#2A1F44;--mu:#6F6590;--ln:#D5CCE8;--sell:#C0392B;--buy:#1E8A74;--amb:#9A6B12;--sell-bg:#FBE4E4;--buy-bg:#D9F1EC;--amb-bg:#F3E8CB}
:root[data-theme="contraste"]{--bg:#000000;--sf:#000000;--ink:#FFFFFF;--mu:#E0E0E0;--ln:#FFFFFF;--sell:#FF6B6B;--buy:#4DFF88;--amb:#FFD84D;--sell-bg:#330000;--buy-bg:#003311;--amb-bg:#332B00}
.topright{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.bkgen{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:380px}
.bkgen .row{justify-content:flex-end;gap:6px}
button.sm,.lbtn{padding:5px 9px;font-size:13px}
.lbtn{display:inline-block;border:1px solid var(--ln);background:var(--sf);border-radius:6px;color:var(--ink);cursor:pointer;margin:0}
#bkInfo{font-size:12px;text-align:left}
.timewrap{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.timewrap button{margin-top:3px}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:4px}
.themebtn{text-align:left;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.themebtn.on{outline:2px solid var(--buy);outline-offset:1px}
.sw{display:flex;height:16px;border-radius:4px;overflow:hidden;border:1px solid var(--ln)}
.sw i{flex:1}
.chartgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px;margin-top:8px}
.chartbox{border:1px solid var(--ln);border-radius:8px;padding:8px}
.chartbox h3{font-size:13px;margin:0 0 4px;color:var(--mu);font-weight:500}
.chipbtn{padding:3px 10px;border-radius:14px;font-size:12px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.ovl[hidden]{display:none}
.ovl-box{background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:12px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.ovl-box.wide{max-width:900px}
.paper{background:#fff;border-radius:8px;padding:16px;border:1px solid var(--ln)}
.paper,.paper *{color:#111}
.rep h1{font-size:20px;margin:0 0 2px}
.rname{font-size:15px;font-weight:600}
.rmeta{font-size:12px}
.rsec h2{font-size:15px;margin:14px 0 4px;border-bottom:1px solid #999;padding-bottom:2px}
.rsec table{width:100%;min-width:0;border-collapse:collapse}
.rsec th,.rsec td{border-bottom:1px solid #ccc;padding:4px 6px;font-size:12px;text-align:left;white-space:normal}
.rsec th.r,.rsec td.r{text-align:right}
.rsub{margin:4px 0 0;font-size:12px}
.rcharts .chartbox{border:0;padding:0;page-break-inside:avoid;max-width:540px;margin-bottom:10px}
.rcharts .chartbox h3{color:#111;font-weight:600}
.rep-head{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.rep-head img{width:56px;height:56px;border-radius:10px}
@media print{body.printing #ovl{display:none!important}}
.rcharts{display:grid;gap:14px 18px;grid-template-columns:repeat(2,minmax(0,1fr))}
.rcharts.rc1{grid-template-columns:minmax(0,1fr)}.rcharts.rc3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rcharts .chartbox{max-width:none}.rcharts .rwide{grid-column:1/-1}
.rep{--mu:#555;--ln:#d6d6d6;--sf:#fff;--ink:#111}
.rep-classic svg{filter:grayscale(1)}
.rep-classic h2{border-bottom-color:#111}
.rep-compact .rsec th,.rep-compact .rsec td{font-size:10.5px;padding:2px 4px}.rep-compact .rsec h2{font-size:13px;margin-top:10px}
.rep-large .rsec th,.rep-large .rsec td{font-size:14px;padding:5px 7px}.rep-large .rsec h2{font-size:17px}.rep-large h1{font-size:24px}
.rnote{font-size:13px;margin:4px 0}
.rp-leg{font-size:11px;margin-bottom:4px;color:#555}
.rp-heat svg,.rp-scat svg{width:100%;height:auto}
.rp-grid{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:18px;margin-top:6px}
.rp-grid h3{margin:0 0 8px;font-size:15px}
.rp-chk{display:flex!important;gap:8px;align-items:center;margin:0 0 6px;color:var(--ink)}
.rp-chk input{width:auto;margin:0}
.rp-fmt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp-fmt label,.rp-note,.rp-movn{margin:0}
.rp-note textarea{width:100%}
.rp-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.rp-thumb{border:2px solid var(--ln);border-radius:12px;padding:8px;cursor:pointer;background:var(--sf);display:flex;flex-direction:column;gap:6px;transition:border-color .12s,opacity .12s;opacity:.62}
.rp-thumb.on{border-color:var(--acc,#2E93BE);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc,#2E93BE) 22%,transparent)}
.rp-thumb:focus-visible{outline:3px solid var(--acc,#2E93BE);outline-offset:2px}
.rp-prev{--mu:#555;--ln:#ddd;--sf:#fff;--ink:#111;background:#fff;border-radius:8px;height:120px;overflow:hidden;display:grid;place-items:center;padding:4px;pointer-events:none}
.rp-prev>*{width:100%;max-height:112px;display:flex;justify-content:center;align-items:center}
.rp-prev .cv-pie{display:flex!important}.rp-prev .cv-pie>:not(svg){display:none}
.rp-prev svg{max-height:110px!important;max-width:100%!important;width:auto!important;height:auto;display:block}
.rp-prev .rp-leg{display:none}.rp-prev .rp-heat,.rp-prev .rp-scat{display:block}.rp-prev .rp-heat svg,.rp-prev .rp-scat svg{width:100%!important}
.rp-prev .hist-empty{font-size:11px;text-align:center}
.rp-tl{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;line-height:1.25}
.rp-tick{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--ln);display:grid;place-items:center;font-size:13px;color:#fff}
.rp-thumb.on .rp-tick{background:var(--acc,#2E93BE);border-color:var(--acc,#2E93BE)}
.rp-thumb select{height:32px;font-size:13px}
@media (max-width:700px){.rp-grid{grid-template-columns:minmax(0,1fr)}}

[hidden]{display:none!important}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select{height:40px;padding:0 10px}
td input:not([type=checkbox]){height:34px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid>label{display:flex;flex-direction:column;gap:4px;margin:0;min-width:0}
.fgrid .lt{display:block;height:18px;line-height:18px;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fgrid input:not([type=checkbox]),.fgrid select,.fgrid .combo input{height:40px;margin:0;width:100%}
.fgrid .pair{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px}
.fgrid .combo{width:100%}
.fb{width:100%;height:40px;padding:0 12px}
.fb.c3{grid-column:3}
.fmsg{align-self:center;min-height:40px;display:flex;align-items:center}
.fmsg.s2{grid-column:span 2}
.fmsg.s3{grid-column:span 3}
.fbtns{display:flex;gap:8px}
.fbtns .fb{flex:1}
.fgrid>label.chk{flex-direction:row;align-items:center;gap:8px;height:40px;color:var(--ink);font-size:14px}
.fgrid>label.chk input{width:auto;height:auto;margin:0}
@media(max-width:900px){.fgrid,.fgrid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}.fb.c3{grid-column:auto}}
@media(max-width:520px){.fgrid,.fgrid.c3{grid-template-columns:minmax(0,1fr)}.fmsg.s2,.fmsg.s3{grid-column:auto}}
.dtfield{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:6px;align-items:center}
.dtbtn{height:40px;width:40px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.dtp-ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}
.dtp{background:var(--sf);color:var(--ink);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.45);width:min(372px,100%)}
.dtp-head{background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:18px 18px 0 0}
.dtp-eyebrow{font-size:12px;letter-spacing:.04em;opacity:.8;text-transform:uppercase}
.dtp-big{font-size:22px;font-weight:500;margin-top:4px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.dtp-body{padding:12px 16px 4px}
.dtp-nav{display:grid;grid-template-columns:36px minmax(0,1fr) 92px 36px;gap:6px;align-items:end}
.dtp-ic{height:48px;width:36px;padding:0;font-size:22px;border:0;background:transparent;border-radius:50%}
.dtp-ic:hover{background:var(--bg)}
.mdsel-f{width:100%;height:48px;display:flex;flex-direction:column;justify-content:center;position:relative;text-align:left;padding:4px 28px 4px 10px;background:var(--bg);border:0;border-bottom:2px solid var(--ink);border-radius:6px 6px 0 0;color:var(--ink)}
.mdsel-l{font-size:11px;color:var(--mu);line-height:12px}
.mdsel-v{font-size:15px;line-height:20px}
.mdsel-a{position:absolute;right:6px;top:50%;margin-top:-10px;color:var(--mu)}
.mdsel-f:focus-visible,.dtp-d:focus-visible,.tbtn:focus-visible{outline:2px solid var(--buy);outline-offset:1px}
.dtp-dow,.dtp-days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dtp-dow{font-size:12px;color:var(--mu);margin:10px 0 4px}
.dtp-days{gap:2px}
.dtp-d{height:38px;padding:0;border:0;background:transparent;border-radius:50%;font-size:14px;color:var(--ink)}
.dtp-d:hover{background:var(--bg)}
.dtp-d.today{box-shadow:inset 0 0 0 1px var(--ink)}
.dtp-d.sel{background:var(--ink);color:var(--bg)}
.dtp-time{display:grid;grid-template-columns:minmax(0,1fr) 10px minmax(0,1fr) 10px minmax(0,1fr);gap:4px;align-items:center;margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--ln)}

.sc-pt{cursor:pointer;transition:r .12s}.sc-pt:hover,.sc-pt.on{r:7;stroke:var(--ink);stroke-width:2}
.sc-card{margin-top:8px;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
#chHeat,#chScatter{margin-bottom:12px}

 return y+'-'+p2(mo)+'-'+p2(da)+'T'+p2(hh)+':'+p2(mi)+':'+p2(se);

function cycles(){

  var a=g[k],o=a.filter(function(m){return m.id==m.ciclo})[0]||a[0];
  var c=a.filter(function(m){return m!==o}).sort(function(x,y){return x.time<y.time?-1:1});
  var sell=o.action=='VENTA',byQ=!sell&&o.qty>0;
  var me=function(m){return byQ?(m.qty||0):m.usdt};
  var tot=byQ?netQty(o):o.usdt,done=c.reduce(function(s,m){return s+me(m)},0);
  var st=o.closedManual?'cerrado':(!c.length?'abierto':done>=tot*0.995?'cerrado':'parcial');
  var delta=null,unit='',pct=null;
  if(c.length&&o.qty>0&&c.every(function(m){return m.qty>0})){
   var r=done/tot,sq=c.reduce(function(s,m){return s+netQty(m)},0),su=c.reduce(function(s,m){return s+m.usdt},0);
   if(sell){delta=sq-o.qty*r;unit=o.coin}else{delta=su-o.usdt*r;unit='USD'}
   var base=sell?o.qty*r:o.usdt*r;pct=base?delta/base*100:null;
  }
  var fees=a.reduce(function(s,m){return s+(m.fee||0)},0),rem=Math.max(0,tot-done);
  var p=refPrice(o.coin),op=o.price>0?o.price:(o.qty>0&&o.usdt>0?o.usdt/o.qty:null),chg=null,gain=null,gainUnit='',remUsd=null;
  if(p&&op)chg=(p/op-1)*100;
  if(sell){remUsd=rem;if(p&&o.qty>0&&o.usdt>0){gain=rem/p-o.qty*(rem/o.usdt);gainUnit=o.coin}}
  else if(byQ){remUsd=(p||op)?rem*(p||op):null;if(p){gain=rem*p-o.usdt*(rem/o.qty);gainUnit='USD'}}
  else remUsd=rem;
  return{o:o,c:c,st:st,tot:tot,done:done,rem:rem,pctDone:Math.min(100,tot?done/tot*100:0),byQ:byQ,delta:delta,unit:unit,retPct:pct,fees:fees,all:[o].concat(c),p:p,op:op,chg:chg,gain:gain,gainUnit:gainUnit,remUsd:remUsd}
 });
}

function svgBars(data,opts){
 opts=opts||{};var w=560,h=opts.h||200,pad=34,maxv=Math.max.apply(null,data.map(function(d){return Math.abs(d.value)}).concat([1]));
 var zero=opts.zero?h/2:h-pad;var usable=opts.zero?h/2-14:h-pad-10;
 var bw=(w-pad*1.2)/(data.length||1);
 var bars=data.map(function(d,i){
  var bh=usable*(Math.abs(d.value)/maxv),x=pad*0.6+i*bw+bw*0.15,bw2=bw*0.7;
  var y=opts.zero?(d.value>=0?zero-bh:zero):zero-bh;
  return '<rect x="'+x+'" y="'+y+'" width="'+bw2+'" height="'+Math.max(1,bh)+'" fill="'+(d.color||(d.value>=0?'var(--buy)':'var(--sell)'))+'" rx="2"></rect>'+
  '<text x="'+(x+bw2/2)+'" y="'+(h-6)+'" text-anchor="middle">'+esc(d.label)+'</text>';
 }).join('');
 var zeroLine=opts.zero?'<line x1="'+pad*0.3+'" y1="'+zero+'" x2="'+(w-6)+'" y2="'+zero+'" stroke="var(--ln)"></line>':'';
 return data.length?'<svg class="chart" viewBox="0 0 '+w+' '+h+'">'+zeroLine+bars+'</svg>':'<p class="mu empty">Sin datos.</p>';
}
function svgLine(values,opts){
 opts=opts||{};var w=560,h=opts.h||180,pad=10;
 if(!values||!values.length)return '<p class="mu empty">Sin datos.</p>';
 var mn=Math.min.apply(null,values),mx=Math.max.apply(null,values);if(mx==mn){mx+=1;mn-=1}

function csvRows(txt){
 var rows=[],row=[],cur='',q=false;txt=String(txt).replace(/^\ufeff/,'');
 for(var i=0;i<txt.length;i++){var c=txt[i];
  if(q){if(c=='"'){if(txt[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c=='"')q=true;else if(c==','){row.push(cur);cur=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&txt[i+1]=='\n')i++;row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}else cur+=c}
 if(cur!==''||row.length){row.push(cur);rows.push(row)}
 return rows;
}

/* estados de cuenta de Bitso: funding (depósitos) y withdrawal (retiros); solo se toman los pesos */
function importBitsoCsv(txt){
 var r=csvRows(txt);if(!r.length)return{err:'archivo vacío'};
 var h=r[0].map(function(x){return x.trim().toLowerCase()}),ix=function(k){return h.indexOf(k)};
 var type=ix('net amount')>-1?'in':(ix('amount')>-1&&ix('gross')<0?'out':null);
 if(!type||ix('currency')<0||ix('timestamp')<0)return{err:'no parece un estado de cuenta de Bitso (depósitos o retiros)'};
 var have={},add=0,dup=0,skip=0,nid=FLW.reduce(function(a,f){return Math.max(a,f.id||0)},0);
 FLW.forEach(function(f){if(f.key)have[f.key]=1});
 r.slice(1).forEach(function(c){
  if((c[ix('currency')]||'').toLowerCase()!='mxn'){skip++;return}
  var a=parseFloat(c[ix(type=='in'?'net amount':'amount')]),ts=c[ix('timestamp')];if(!(a>0)||!ts){skip++;return}
  var key=type+'|'+ts+'|'+a.toFixed(2);if(have[key]){dup++;return}
  have[key]=1;FLW.push({id:++nid,type:type,amount:a,curr:'MXN',mxn:a,time:tsLocal(ts),plat:'BITSO',method:c[ix('method')]||'SPEI',src:'bitso',key:key});add++;
 });
 return{type:type,add:add,dup:dup,skip:skip};
}

function isCash(c){return c=='MXN'||c=='USDT'}

function reflected(m){var t=snapTime(m.plat);return t!=null&&m.time<t}

/* efectivo: una venta acredita USDT (o MXN si el monto se capturó en pesos) en el mismo broker; una compra lo descuenta */
/* en las compras (con cantidad y precio) la comisión se cobra en la cripto recibida; en las ventas, en USDT/pesos */
function feeInCoin(m){return m.action=='COMPRA'&&m.qty>0&&m.price>0}
function netQty(m){return feeInCoin(m)?Math.max(0,m.qty-(m.fee||0)/m.price):(m.qty||0)}
function cashEffect(m){
 var gross=m.amountOrig||0,fee=m.curr=='MXN'?(m.fee||0)*(m.fxRate||FX):(m.fee||0);
 return m.action=='VENTA'?gross-fee:-(gross+(feeInCoin(m)?0:fee));
}
function cashMap(){
 var map={};
 function get(p,a){var k=p+'|'+a;return map[k]||(map[k]={plat:p,asset:a,base:null,baseTime:null,baseId:null,eff:0,n:0})}
 H.forEach(function(h){if(!isCash(h.coin))return;var o=get(h.plat||'SIN BROKER',h.coin);if(o.baseTime==null||h.time>=o.baseTime){o.base=h.qty;o.baseTime=h.time;o.baseId=h.id}});
 M.forEach(function(m){
  var o=get(m.plat||'SIN BROKER',m.curr=='MXN'?'MXN':'USDT');
  if(o.baseTime!=null&&m.time<o.baseTime)return;
  o.eff+=cashEffect(m);o.n++;
 });
 return Object.keys(map).map(function(k){var o=map[k];o.cur=(o.base||0)+o.eff;return o});
}

function lots(){
 var out=[],byKey={};
 H.forEach(function(h){if(isCash(h.coin))return;out.push({key:'H'+h.id,code:'TI-'+String(h.id).padStart(4,'0'),src:'H',h:h,coin:h.coin,qty:h.qty,price:h.price,time:h.time,plat:h.plat,fee:0})});
 M.forEach(function(m){if(m.action=='COMPRA'&&m.qty>0&&m.price>0&&!reflected(m))out.push({key:'M'+m.id,code:'EN-'+String(m.id).padStart(4,'0'),src:'M',m:m,coin:m.coin,qty:netQty(m),price:m.price,time:m.time,plat:m.plat,fee:m.fee||0})});
 out.forEach(function(l){l.sales=[];byKey[l.key]=l});
 M.forEach(function(s){if(s.action=='VENTA'&&s.qty>0&&s.lote&&byKey[s.lote])byKey[s.lote].sales.push(s)});
 out.forEach(function(l){
  l.sold=l.sales.reduce(function(a,s){return a+s.qty},0);
  l.rem=l.qty-l.sold;
  l.realized=l.sales.reduce(function(a,s){return a+(s.price-l.price)*s.qty-(s.fee||0)-(l.qty?l.fee*(s.qty/l.qty):0)},0);
  l.st=l.rem<=l.qty*0.0001?'cerrada':(l.sold>0?'parcial':'abierta');
 });
 return out;
}

function brokerData(){
 var L=lots(),keys={},res={};L.forEach(function(l){keys[l.key]=1});
 function get(p){return res[p]||(res[p]={plat:p,crypto:{},cash:{},lq:{},lc:{}})}
 L.forEach(function(l){if(l.rem>0){var b=get(l.plat||'SIN BROKER');b.crypto[l.coin]=(b.crypto[l.coin]||0)+l.rem;b.lq[l.coin]=(b.lq[l.coin]||0)+l.rem;b.lc[l.coin]=(b.lc[l.coin]||0)+l.rem*l.price}});
 M.forEach(function(s){if(s.action=='VENTA'&&s.qty>0&&!reflected(s)&&!(s.lote&&keys[s.lote])){var b=get(s.plat||'SIN BROKER');b.crypto[s.coin]=(b.crypto[s.coin]||0)-s.qty}});
 cashMap().forEach(function(o){get(o.plat).cash[o.asset]=o});
 return Object.keys(res).sort().map(function(k){
  var b=res[k],rows=[];
  ['MXN','USDT'].forEach(function(a){var o=b.cash[a];if(o&&(o.base!=null||o.n))rows.push({asset:a,qty:o.cur,price:null,avg:a=='USDT'?1:null,cost:a=='USDT'?o.cur:null,val:a=='USDT'?o.cur:null})});
  Object.keys(b.crypto).sort().forEach(function(c){var q=b.crypto[c];if(Math.abs(q)<1e-9)return;var p=refPrice(c),avg=b.lq[c]>0?b.lc[c]/b.lq[c]:null;
   rows.push({asset:c,qty:q,price:p,avg:avg,cost:avg!=null?q*avg:null,val:p?q*p:null})});
  return{plat:k,rows:rows};
 }).filter(function(b){return b.rows.length});
}

function accountTotals(fx){

 brokerData().forEach(function(b){b.rows.forEach(function(r){

/* ---------- listas con búsqueda: escribe y se completa, o elige ---------- */
function makeCombo(sel){
 if(!sel||sel._combo)return;sel._combo=true;
 var wrap=document.createElement('div');wrap.className='combo';
 var inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.placeholder='Escribe o elige…';
 var list=document.createElement('div');list.className='combo-list';list.hidden=true;
 sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(inp);wrap.appendChild(list);wrap.appendChild(sel);
 sel.style.display='none';sel.focus=function(){inp.focus()};
 var items=[],vis=[],act=-1,isOpen=false,choosing=false;
 function readItems(){items=[].slice.call(sel.options).filter(function(o){return o.value!==''}).map(function(o){return{value:o.value,text:o.textContent}})}
 function curText(){var o=sel.options[sel.selectedIndex];return(o&&o.value!==''&&o.value!=='__add__')?o.textContent:''}
 function syncText(){if(document.activeElement!==inp)inp.value=curText()}
 function syncCls(){['req','valid','invalid'].forEach(function(c){inp.classList.toggle(c,sel.classList.contains(c))})}
 function paint(){[].slice.call(list.children).forEach(function(el,i){el.classList.toggle('on',i==act)});var a=list.children[act];if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest'})}
 function show(filter){
  readItems();var q=(filter||'').trim().toLowerCase();
  vis=items.filter(function(it){return it.value==='__add__'||!q||it.text.toLowerCase().indexOf(q)>-1});
  if(q)vis.sort(function(a,b){if(a.value==='__add__')return 1;if(b.value==='__add__')return -1;return(a.text.toLowerCase().indexOf(q)==0?0:1)-(b.text.toLowerCase().indexOf(q)==0?0:1)});
  list.innerHTML=vis.map(function(it){return '<div class="combo-item" data-v="'+esc(it.value)+'">'+esc(it.text)+'</div>'}).join('');
  act=(q&&vis.length&&vis[0].value!=='__add__')?0:-1;paint();list.hidden=false;isOpen=true;
 }
 function close(){list.hidden=true;isOpen=false;act=-1}
 function choose(v){
  var it=items.filter(function(i){return i.value===v})[0];
  inp.value=(it&&v!=='__add__'&&v!=='')?it.text:'';
  close();choosing=true;sel.value=v;
  sel.dispatchEvent(new Event('change',{bubbles:true}));
  inp.blur();choosing=false;syncText();
 }
 inp.addEventListener('focus',function(){inp.select();show('')});
 inp.addEventListener('click',function(){if(!isOpen)show('');inp.select()});
 inp.addEventListener('input',function(){show(inp.value)});
 inp.addEventListener('keydown',function(e){
  if(e.key=='ArrowDown'){e.preventDefault();if(!isOpen)show('');act=Math.min(vis.length-1,act+1);paint()}
  else if(e.key=='ArrowUp'){e.preventDefault();act=Math.max(0,act-1);paint()}
  else if(e.key=='Enter'){e.preventDefault();if(!isOpen)return;var t=inp.value.trim().toLowerCase();var pick=(act>-1&&vis[act])||vis.filter(function(i){return i.text.toLowerCase()===t})[0]||vis.filter(function(i){return i.value!=='__add__'})[0];if(pick)choose(pick.value)}
  else if(e.key=='Escape'){close();inp.value=curText();inp.blur()}
 });
 inp.addEventListener('blur',function(){
  if(choosing){close();return}
  close();var t=inp.value.trim().toLowerCase();readItems();
  if(t===''){if(sel.value!==''){sel.value='';sel.dispatchEvent(new Event('change',{bubbles:true}))}}
  else{var m=items.filter(function(i){return i.value!=='__add__'&&i.text.toLowerCase()===t})[0];if(m&&sel.value!==m.value){sel.value=m.value;sel.dispatchEvent(new Event('change',{bubbles:true}))}}
  syncText();
 });
 list.addEventListener('mousedown',function(e){e.preventDefault();var el=e.target.closest('.combo-item');if(el)choose(el.getAttribute('data-v'))});
 new MutationObserver(function(){readItems();syncText()}).observe(sel,{childList:true});
 function syncDis(){inp.disabled=sel.disabled;if(sel.disabled)close()}
 new MutationObserver(function(){syncCls();syncDis()}).observe(sel,{attributes:true,attributeFilter:['class','disabled']});syncDis();
 readItems();syncText();syncCls();
}

function pt(c,r,a){return (c+r*Math.cos(a)).toFixed(2)+','+(c+r*Math.sin(a)).toFixed(2)}
function roundBar(x,y,w,h,r,down){
 r=Math.max(0,Math.min(r,w/2,h));
 if(!down)return 'M'+x+','+(y+h)+' V'+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' H'+(x+w-r)+' Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+' V'+(y+h)+' Z';
 return 'M'+x+','+y+' H'+(x+w)+' V'+(y+h-r)+' Q'+(x+w)+','+(y+h)+' '+(x+w-r)+','+(y+h)+' H'+(x+r)+' Q'+x+','+(y+h)+' '+x+','+(y+h-r)+' Z';
}

/* mosaico (treemap) */
function tmLayout(items,x,y,w,h,out){
 if(!items.length)return;
 if(items.length==1){out.push({it:items[0],x:x,y:y,w:w,h:h});return}
 var tot=sumOf(items),acc=items[0].value,k=1;
 while(k<items.length-1&&acc+items[k].value<=tot/2){acc+=items[k].value;k++}
 var A=items.slice(0,k),B=items.slice(k),f=acc/tot;
 if(w>=h){tmLayout(A,x,y,w*f,h,out);tmLayout(B,x+w*f,y,w*(1-f),h,out)}
 else{tmLayout(A,x,y,w,h*f,out);tmLayout(B,x,y+h*f,w,h*(1-f),out)}
}
function treemapSvg(items,o){
 o=o||{};items=prepPos(items,10);var total=sumOf(items);if(!total)return emptyChart();
 var W=560,H=300,lay=[],idx={};items.forEach(function(it,i){idx[it.label]=i});
 tmLayout(items,0,0,W,H,lay);
 var out=lay.map(function(b){
  var g=2,x=b.x+g,y=b.y+g,w=Math.max(0,b.w-2*g),h=Math.max(0,b.h-2*g),f=b.it.value/total,col=colOf(b.it,idx[b.it.label]);
  var s='<rect class="sl"'+ckA(b.it)+' x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="8" fill="'+col+'"><title>'+esc(b.it.label)+': '+n(f*100,1)+'% · '+n(b.it.value,2)+' USD</title></rect>';
  var mc=Math.floor((w-16)/7.5);
  if(w>48&&h>28)s+='<text x="'+(x+10).toFixed(1)+'" y="'+(y+21).toFixed(1)+'" style="font-size:13px;font-weight:600;fill:#fff;pointer-events:none">'+esc(shortLbl(b.it.sub?b.it.label:(b.it.disp||b.it.label),Math.max(3,mc-(b.it.exp?2:0))))+arT(b.it)+'</text>';
  if(w>70&&h>48)s+='<text x="'+(x+10).toFixed(1)+'" y="'+(y+38).toFixed(1)+'" style="font-size:12px;fill:#fff;opacity:.9;pointer-events:none">'+n(f*100,1)+'% · '+sh(b.it.value)+'</text>';
  return s;
 }).join('');
 return '<svg class="chart2 gpop" viewBox="0 0 '+W+' '+H+'" role="img">'+out+'</svg>'+legendHtml(items,total,true);
}

function portfolio(fx,base){
 var byA={},byB={},pl={},cv={},det={asset:{},broker:{}};
 brokerData().forEach(function(b){
  var tot=0;
  b.rows.forEach(function(r){
   var v=r.asset=='MXN'?r.qty/fx:(r.asset=='USDT'?r.qty:(base=='cost'?r.cost:r.val));
   if(v==null||!(v>0))return;
   var k=r.asset=='MXN'?'MXN (pesos)':r.asset;byA[k]=(byA[k]||0)+v;tot+=v;
   var da=det.asset[k]||(det.asset[k]={}),db=det.broker[b.plat]||(det.broker[b.plat]={});da[b.plat]=(da[b.plat]||0)+v;db[k]=(db[k]||0)+v;
  });
  if(tot>0)byB[b.plat]=tot;
 });
 lots().forEach(function(l){if(l.rem>0){
  var p=refPrice(l.coin),o=cv[l.coin]||(cv[l.coin]={label:l.coin,a:0,b:0,miss:false});
  o.a+=l.price*l.rem;
  if(p){pl[l.coin]=(pl[l.coin]||0)+(p-l.price)*l.rem;o.b+=p*l.rem}else o.miss=true;
 }});
 var arr=function(o){return Object.keys(o).map(function(k){return{label:k,value:o[k]}}).sort(function(a,b){return b.value-a.value})};
 return{det:det,asset:arr(byA),broker:arr(byB),pl:arr(pl),cv:Object.keys(cv).map(function(k){var o=cv[k];if(o.miss)o.b=null;return o})};
}
function chartsHtml(fx,ink,base){

 return box('Composición por activo ('+bl+', USD)',donutSvg(d.asset,o))+box('Distribución por broker ('+bl+', USD)',donutSvg(d.broker,o))+
  box('Ganancia/pérdida abierta por cripto (USD)',hbarSvg(d.pl,Object.assign({signed:true},o)))+box('Costo vs valor actual por cripto (USD)',groupSvg(d.cv,o));
}

 lots().forEach(function(l){

 });
 return{cost:cost,val:val,pl:val-costP,rea:rea,miss:miss};
}

function stampF(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+'-'+p2(d.getMinutes())+'-'+p2(d.getSeconds())}
function csvOf(sheets){
 return '\ufeff'+sheets.map(function(s){
  var rows=s[1].map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  return sheets.length>1?('"# '+s[0]+'"\r\n'+rows):rows;
 }).join('\r\n\r\n');
}
function objsOf(aoa){var h=aoa[0];return aoa.slice(1).map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]});return o})}
function needX(){if(typeof XLSX=='undefined'){alert('No se pudo cargar el componente de Excel (revisa tu conexión a internet) e inténtalo de nuevo.');return false}return true}
function xlsxOut(name,sheets){if(!needX())return;var wb=XLSX.utils.book_new();sheets.forEach(function(s){XLSX.utils.book_append_sheet(wb,aoaSheet(s[1]),s[0])});XLSX.writeFile(wb,name)}

function readText(file,cb){var r=new FileReader();r.onload=function(){cb(r.result)};r.readAsText(file)}
function readXlsx(file,cb){if(!needX())return;var r=new FileReader();r.onload=function(){var wb;try{wb=XLSX.read(new Uint8Array(r.result),{type:'array'})}catch(e){alert('No se pudo leer el archivo de Excel.');return}cb(wb)};r.readAsArrayBuffer(file)}

function parseJson(txt){try{return JSON.parse(txt)}catch(e){alert('El archivo no es un JSON válido.');return null}}
function tenFromRows(rows){return rows.map(function(r){return{id:+r[0]||0,coin:String(r[1]||'').toUpperCase(),qty:+r[2]||0,price:+r[3]||0,plat:String(r[4]||'').toUpperCase(),time:normTime(r[5])}})}

function recordHist(){
 try{
  if(!MKT||!Object.keys(MKT).length)return;
  var at=accountTotals(FX);if(!(at.total>0)||at.miss&&at.cripto<=0)return;
  var now=Date.now(),last=HIST[HIST.length-1];
  if(last&&now-last[0]<30*60e3){last[1]=+at.total.toFixed(2);}
  else HIST.push([now,+at.total.toFixed(2)]);
  /* compacta: >2 días → 1 por hora; >45 días → 1 por día */
  var out=[],seen={};
  HIST.forEach(function(p){var age=now-p[0],k=age>45*864e5?'d'+Math.floor(p[0]/864e5):age>2*864e5?'h'+Math.floor(p[0]/36e5):'r'+p[0];seen[k]=p});
  Object.keys(seen).forEach(function(k){out.push(seen[k])});out.sort(function(a,b){return a[0]-b[0]});HIST=out;
  localStorage.setItem(KHIST,JSON.stringify(HIST));

}

/* ================= Gráficas: "Qué días" (mapa de calor) y "Cada movimiento" (dispersión logarítmica) ================= */
var CHV={},CHPTS={};
var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],DSEM=['L','M','M','J','V','S','D'],DSEML=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
function chState(id){return CHV[id]||(CHV[id]={table:false,metric:'count'})}
function chHead(id,title,sub,extra){var st=chState(id);return '<div class="ch-head"><div><h3 class="ch-t">'+title+'</h3><div class="mu ch-s">'+sub+'</div></div><span class="sp"></span>'+(extra||'')+'<button type="button" class="sm" data-chtable="'+id+'">'+(st.table?'Ver gráfica':'Ver tabla')+'</button></div>'}
function heatHtml(id,events,title){
 var st=chState(id),now=new Date(),months=[];
 for(var i=11;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
 var grid={};events.forEach(function(e){var d=new Date(e.t);if(isNaN(d))return;var mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(months.indexOf(mk)<0)return;var wd=(d.getDay()+6)%7,k=wd+'|'+mk,g=grid[k]||(grid[k]={c:0,v:0});g.c++;g.v+=e.v||0});
 var val=function(g){return g?(st.metric=='usd'?g.v:g.c):0},mx=0;Object.keys(grid).forEach(function(k){mx=Math.max(mx,val(grid[k]))});
 var seg='<div class="seg sm-seg" role="group"><button type="button" data-chmetric="'+id+'" data-v="count" aria-pressed="'+(st.metric=='count')+'">Operaciones</button><button type="button" data-chmetric="'+id+'" data-v="usd" aria-pressed="'+(st.metric=='usd')+'">Monto</button></div>';
 var head=chHead(id,title||'Qué días','día de la semana × mes · '+(st.metric=='usd'?'monto en USD':'número de operaciones'),seg);
 if(st.table){
  return head+'<div class="wrap"><table class="ptable" style="min-width:640px"><thead><tr><th>Día</th>'+months.map(function(m){return '<th>'+MESES[+m.slice(5)-1]+' '+m.slice(2,4)+'</th>'}).join('')+'<th>Total</th></tr></thead><tbody>'+
   DSEML.map(function(dn,wd){var tot=0;return '<tr><td>'+dn+'</td>'+months.map(function(m){var v=val(grid[wd+'|'+m]);tot+=v;return '<td class="num">'+(v?n(v,st.metric=='usd'?0:0):'')+'</td>'}).join('')+'<td class="num"><b>'+n(tot,0)+'</b></td></tr>'}).join('')+'</tbody></table></div>';
 }
 var cw=40,ch=22,gap=5,lm=28,tm=6,W=lm+months.length*(cw+gap),H=tm+7*(ch+gap)+24,out='';
 DSEM.forEach(function(d,wd){out+='<text x="'+(lm-12)+'" y="'+(tm+wd*(ch+gap)+ch/2+4)+'" text-anchor="middle" style="font-size:12px;fill:var(--mu)">'+d+'</text>'});
 months.forEach(function(m,ci){
  for(var wd=0;wd<7;wd++){var g=grid[wd+'|'+m],v=val(g),f=mx?v/mx:0;
   out+='<rect x="'+(lm+ci*(cw+gap))+'" y="'+(tm+wd*(ch+gap))+'" width="'+cw+'" height="'+ch+'" rx="5" fill="var(--hm)" fill-opacity="'+(v?(0.18+0.82*f).toFixed(2):0.06)+'"><title>'+DSEML[wd]+' · '+MESES[+m.slice(5)-1]+' '+m.slice(0,4)+': '+(g?g.c+' operación'+(g.c==1?'':'es')+' · '+n(g.v,2)+' USD':'sin operaciones')+'</title></rect>'}
  if(ci%2==0)out+='<text x="'+(lm+ci*(cw+gap)+cw/2)+'" y="'+(H-6)+'" text-anchor="middle" style="font-size:11px;fill:var(--mu)">'+MESES[+m.slice(5)-1]+' '+m.slice(2,4)+'</text>';
 });
 return head+'<svg class="heat" viewBox="0 0 '+W+' '+H+'" style="max-width:'+W*1.4+'px">'+out+'</svg><div class="heat-leg mu"><span>menos</span><i></i><span>más</span></div>';
}
function scatterHtml(id,pts,title,wpx){
 var st=chState(id);CHPTS[id]=pts;
 var head=chHead(id,title||'Cada movimiento','escala logarítmica · clic en un punto para verlo',
  '<span class="sc-leg"><i style="background:var(--sc-buy)"></i>Compra <i style="background:var(--sc-sell)"></i>Venta</span>');
 if(!pts.length)return head+'<p class="mu empty">Sin movimientos.</p>';
 if(st.table)return head+'<div class="wrap" style="max-height:420px;overflow:auto"><table class="ptable" style="min-width:560px"><thead><tr><th>Fecha</th><th>Acción</th><th>Moneda</th><th>Monto (USD)</th><th>Detalle</th></tr></thead><tbody>'+
  pts.slice().sort(function(a,b){return a.t<b.t?1:-1}).map(function(p){return '<tr><td>'+fd(p.t)+'</td><td class="'+(p.k=='SELL'?'VENTA':'COMPRA')+'"><b>'+(p.k=='SELL'?'VENTA':'COMPRA')+'</b></td><td>'+coinIcon(p.c,16)+esc(p.c)+'</td><td class="num">'+n(p.v,2)+'</td><td class="mu">'+esc(p.d||'')+'</td></tr>'}).join('')+'</tbody></table></div>';
 var W=Math.max(560,wpx||900),H=260,lm=52,rm=12,tm=12,bm=28,pw=W-lm-rm,ph=H-tm-bm;
 var ts=pts.map(function(p){return new Date(p.t).getTime()}),t0=Math.min.apply(null,ts),t1=Math.max.apply(null,ts);if(t1==t0)t1=t0+864e5;
 var vs=pts.map(function(p){return Math.max(p.v,0.5)}),lo=Math.floor(Math.log10(Math.min.apply(null,vs))),hi=Math.ceil(Math.log10(Math.max.apply(null,vs)));if(hi==lo)hi=lo+1;
 var X=function(t){return lm+(t-t0)/(t1-t0)*pw},Y=function(v){return tm+(hi-Math.log10(Math.max(v,0.5)))/(hi-lo)*ph},out='';
 for(var e=lo;e<=hi;e++){var y=Y(Math.pow(10,e)).toFixed(1),lab=e>=3?'$'+(Math.pow(10,e-3)).toFixed(e>=4?0:1)+'k':'$'+Math.pow(10,e);
  out+='<line x1="'+lm+'" y1="'+y+'" x2="'+(W-rm)+'" y2="'+y+'" stroke="var(--ln)"/><text x="'+(lm-8)+'" y="'+(+y+4)+'" text-anchor="end" style="font-size:11px;fill:var(--mu)">'+lab+'</text>'}
 var d=new Date(t0);d=new Date(d.getFullYear(),d.getMonth()+1,1);var months=[];while(d.getTime()<=t1){months.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth()+1,1)}
 var every=Math.ceil(months.length/12);months.forEach(function(m,i){if(i%every)return;var x=X(m.getTime()).toFixed(1);out+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" style="font-size:11px;fill:var(--mu)">'+MESES[m.getMonth()]+' '+String(m.getFullYear()).slice(2)+'</text>'});
 pts.forEach(function(p,i){out+='<circle class="sc-pt" data-sp="'+id+'|'+i+'" cx="'+X(new Date(p.t).getTime()).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4.5" fill="'+(p.k=='SELL'?'var(--sc-sell)':'var(--sc-buy)')+'" stroke="var(--sf)" stroke-width="1"><title>'+fd(p.t).slice(0,16)+' · '+(p.k=='SELL'?'Venta':'Compra')+' '+esc(p.c)+' · '+n(p.v,2)+' USD</title></circle>'});
 return head+'<svg class="chart2 scat" viewBox="0 0 '+W+' '+H+'">'+out+'</svg><div class="sc-detail" id="scd-'+id+'"></div>';
}

});

/* ================= Nube: Supabase personal (misma cuenta y tabla que tus otras apps) =================
   Cada dato guardado en este navegador (movimientos, tenencias, ingresos/retiros, estados de cuenta, reportes…)
   se sube como un renglón de la tabla "registros" (app = registro-cripto). Gana la versión más reciente. */
var SUPA={url:'https://gosfucaweteaqrvftgfq.supabase.co',key:'sb_publishable_ooOdrO4PNPyeOUdxqEB4pQ_xuYIo59d',app:'registro-cripto'};
var CLOUD={sb:null,uid:null,email:'',state:'off',timer:null,busy:false,again:false};
function cloudPill(state,txt){
 CLOUD.state=state;var b=$('#cloudBtn');if(!b)return;
 b.className='cloud-pill '+state;
 b.innerHTML='<span class="cdot"></span>'+esc(txt||({on:'Sincronizado',busy:'Guardando en la nube…',err:'Sin conexión con la nube',off:'Solo en este navegador · Entrar'}[state]||''));
 b.title=state=='off'?'Entra con tu cuenta para guardar tus datos en tu Supabase':(CLOUD.email?'Sesión: '+CLOUD.email+' · toca para cerrar sesión':'');
}
function syncMarkAll(){var t=new Date().toISOString();SYNC_KEYS.forEach(function(k){if(localStorage.getItem(k)!=null&&!SYNC_META[k]){SYNC_META[k]=t;CLOUD_DIRTY[k]=1}});saveSyncMeta()}
function cloudSchedule(){if(!CLOUD.sb)return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudFlush,1500);cloudPill('busy')}
function cloudFlush(){
 if(!CLOUD.sb)return Promise.resolve();
 if(CLOUD.busy){CLOUD.again=true;return Promise.resolve()}
 var keys=Object.keys(CLOUD_DIRTY);if(!keys.length){cloudPill('on');return Promise.resolve()}
 CLOUD.busy=true;CLOUD_DIRTY={};
 var rows=keys.map(function(k){return{app:SUPA.app,id:'rc/'+k,owner:CLOUD.uid,data:{v:localStorage.getItem(k),t:SYNC_META[k]||new Date().toISOString()}}});
 var one=function(row){return CLOUD.sb.from('registros').upsert(row).then(function(r){if(r.error)throw r.error})};
 var send=function(){return rows.reduce(function(p,row){return p.then(function(){return one(row)})},Promise.resolve())};
 return send().catch(function(){return new Promise(function(ok){setTimeout(ok,1800)}).then(send)}).then(function(){cloudPill('on')},function(e){
  keys.forEach(function(k){CLOUD_DIRTY[k]=1});cloudPill('err',/quota|exceed|size|large/i.test(String(e&&e.message))?'Nube llena':'Sin conexión con la nube');
 }).then(function(){CLOUD.busy=false;if(CLOUD.again){CLOUD.again=false;cloudSchedule()}});
}
/* trae la nube; devuelve true si cambió algo en este navegador */
function cloudPull(full){
 return CLOUD.sb.from('registros').select('id,data').eq('app',SUPA.app).then(function(r){
  if(r.error)throw r.error;
  var changed=false,seen={};
  (r.data||[]).forEach(function(row){
   var k=String(row.id).replace(/^rc\//,''),d=row.data||{};if(SYNC_KEYS.indexOf(k)<0||d.v==null)return;seen[k]=1;
   if((d.t||'')>(SYNC_META[k]||'')&&!full){changed=true;return}
   if((d.t||'')>(SYNC_META[k]||'')){CLOUD_APPLYING=true;try{localStorage.setItem(k,d.v)}catch(e){}CLOUD_APPLYING=false;SYNC_META[k]=d.t;changed=true}
   else if(full&&(SYNC_META[k]||'')>(d.t||''))CLOUD_DIRTY[k]=1;
  });
  if(full)SYNC_KEYS.forEach(function(k){if(!seen[k]&&localStorage.getItem(k)!=null){if(!SYNC_META[k])SYNC_META[k]=new Date().toISOString();CLOUD_DIRTY[k]=1}});
  saveSyncMeta();return changed;
 });
}

   '<p id="lgMsg" style="margin:0;color:var(--sell)">'+esc(msg||'')+'</p>'+
   '<label><span class="lt">Correo</span><input type="text" inputmode="email" id="lgE" autocomplete="username" required></label>'+
   '<label><span class="lt">Contraseña</span><input type="password" id="lgP" autocomplete="current-password" required></label>'+

    if(r.error){b.disabled=false;b.textContent='Entrar';$('#lgMsg').textContent=/invalid/i.test(r.error.message)?'Correo o contraseña incorrectos':/confirm/i.test(r.error.message)?'La cuenta no está confirmada en Supabase':'No se pudo entrar: '+r.error.message;return}
    ov.remove();res(r.data.session);
   });
  };

function initCloud(){
 var bar=document.querySelector('.bkgen .row');if(bar&&!$('#cloudBtn'))bar.insertAdjacentHTML('afterbegin','<button type="button" id="cloudBtn" class="cloud-pill off"></button>');
 $('#cloudBtn').onclick=function(){
  if(CLOUD.sb&&CLOUD.uid){if(confirm('¿Cerrar sesión ('+CLOUD.email+')? Tus datos se quedan guardados en la nube y en este navegador.'))CLOUD.sb.auth.signOut().then(function(){location.reload()})}
  else{try{localStorage.removeItem('registro-cripto.sololocal')}catch(e){}location.reload()}
 };
 if(!window.supabase||!window.supabase.createClient){cloudPill('off','Sin conexión: solo en este navegador');return}
 CLOUD.sb=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'registro-cripto-auth'}});
 CLOUD.sb.auth.getSession().then(function(r){
  var session=r.data&&r.data.session;
  if(session)return session;
  if(localStorage.getItem('registro-cripto.sololocal')==='1')return null;
  return cloudLogin().then(function(s){if(!s){try{localStorage.setItem('registro-cripto.sololocal','1')}catch(e){}}return s});
 }).then(function(session){
  if(!session){CLOUD.sb=null;cloudPill('off');return}
  try{localStorage.removeItem('registro-cripto.sololocal')}catch(e){}
  CLOUD.uid=session.user.id;CLOUD.email=session.user.email||'';
  cloudPill('busy','Revisando la nube…');
  return cloudPull(true).then(function(changed){
   if(changed){try{sessionStorage.setItem('rc-cloud-loaded','1')}catch(e){}location.reload();return}
   CLOUD_READY=true;
   if(Object.keys(CLOUD_DIRTY).length)cloudFlush();else cloudPill('on');
   try{if(sessionStorage.getItem('rc-cloud-loaded')){sessionStorage.removeItem('rc-cloud-loaded');var m=$('#msg');if(m)m.textContent='Se cargaron tus datos desde la nube.'}}catch(e){}
   try{CLOUD.sb.channel('rt-registro-cripto').on('postgres_changes',{event:'*',schema:'public',table:'registros',filter:'app=eq.'+SUPA.app},function(p){
    var d=p.new&&p.new.data,k=p.new&&String(p.new.id).replace(/^rc\//,'');if(d&&k&&(d.t||'')>(SYNC_META[k]||''))cloudBanner()}).subscribe()}catch(e){}
   document.addEventListener('visibilitychange',function(){if(document.visibilityState=='visible'&&CLOUD.sb)cloudPull(false).then(function(ch){if(ch)cloudBanner()}).catch(function(){})});
   CLOUD.sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')location.reload()});
  });
 }).catch(function(){cloudPill('err');CLOUD_READY=true});
}
initCloud();
