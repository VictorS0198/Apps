      </div>
      <div class="sect"><h4>Cuadrícula</h4>
        <div class="grid2">${this.num('gsize', 'c/', U.to(g.size), u, 'title="Separación de líneas principales"')}${this.num('gsub', '÷', g.sub, '', 'title="Subdivisiones" min="1" max="20" step="1"')}</div>
        <div class="row"><label class="lbl">Color</label><input type="color" data-f="gcolor" value="${g.color}"><label class="toggle hint" style="display:flex;gap:4px;align-items:center;margin-left:6px"><input type="checkbox" data-f="gshow" ${g.show ? 'checked' : ''}> Ver</label><label class="toggle hint" style="display:flex;gap:4px;align-items:center;margin-left:6px"><input type="checkbox" data-f="gsnap" ${g.snap ? 'checked' : ''}> Ajustar</label></div>
      </div>
      <div class="sect"><div class="hint">Selecciona un elemento para ver sus propiedades. Atajos: V seleccionar · T texto · R rectángulo · E elipse · L línea · I imagen · Espacio + arrastrar para moverte · Ctrl + rueda para zoom.</div></div>`;
  },

  elProps(sel) {
    const one = sel.length === 1 ? sel[0] : null, u = U.name, def = this.def.bind(this);
    const anyLocked = sel.some(e => isLk(e));
    const g = this.geom(sel);
    let h = '';
    // ---- geometría ----
    if (one && one.type === 'line') {
      def('lx', v => { const [a, b] = lineEnds(one); const nx = U.from(v); setLineEnds(one, { x: nx, y: a.y }, { x: b.x + nx - a.x, y: b.y }); }, 'Mover');
      def('ly', v => { const [a, b] = lineEnds(one); const ny = U.from(v); setLineEnds(one, { x: a.x, y: ny }, { x: b.x, y: b.y + ny - a.y }); }, 'Mover');
      def('len', v => { const [a] = lineEnds(one); const L = Math.max(0.1, U.from(v)), r = deg2rad(one.rot); setLineEnds(one, a, { x: a.x + Math.cos(r) * L, y: a.y + Math.sin(r) * L }); }, 'Longitud');
      def('ang', v => { const [a] = lineEnds(one); const r = deg2rad(-v); setLineEnds(one, a, { x: a.x + Math.cos(r) * one.w, y: a.y + Math.sin(r) * one.w }); }, 'Ángulo');
      h += `<div class="sect"><h4>Línea</h4><div class="grid2">${this.num('lx', 'X', g.lx, u)}${this.num('ly', 'Y', g.ly, u)}${this.num('len', 'L', g.len, u)}${this.num('ang', '∠', g.ang, '°')}</div><div class="hint">Mayús al arrastrar un extremo: ángulos de 15°.</div></div>`;
    } else {
      if (one) {
        def('x', v => { one.x = U.from(v); }, 'Mover');
        def('y', v => { one.y = U.from(v); }, 'Mover');
        def('w', v => {
          const nw = Math.max(0.5, U.from(v));
          if (one.type === 'text') { one.w = nw; fitTextHeight(one); }
          else { if (one.lockRatio) one.h = one.h * nw / one.w; one.w = nw; }
        }, 'Cambiar tamaño');
        def('h', v => { const nh = Math.max(0.5, U.from(v)); if (one.lockRatio) one.w = one.w * nh / one.h; one.h = nh; }, 'Cambiar tamaño');
        def('rot', v => { const c = elCenter(one); one.rot = ((+v + 180) % 360 + 360) % 360 - 180; }, 'Rotar');
      } else {
        const b0 = unionBox(sel.map(elAABB));
        const moveAll = (dx, dy) => sel.filter(e => !isLk(e)).forEach(e => { e.x += dx; e.y += dy; });
        const scaleAll = f => sel.filter(e => !isLk(e)).forEach(e => { const c = elCenter(e); const nc = { x: b0.x + (c.x - b0.x) * f, y: b0.y + (c.y - b0.y) * f }; e.w *= f; e.h *= f; e.x = nc.x - e.w / 2; e.y = nc.y - e.h / 2; if (e.type === 'text') e.size = round(e.size * f, 2); });
        def('x', v => moveAll(U.from(v) - b0.x, 0), 'Mover');
        def('y', v => moveAll(0, U.from(v) - b0.y), 'Mover');
        def('w', v => scaleAll(Math.max(0.5, U.from(v)) / b0.w), 'Cambiar tamaño');
        def('h', v => scaleAll(Math.max(0.5, U.from(v)) / b0.h), 'Cambiar tamaño');
      }
      const textH = one && one.type === 'text';
      h += `<div class="sect"><h4>${one ? esc(elDisplayName(one)) : sel.length + ' elementos'}${anyLocked ? ' <span class="hint">bloqueado</span>' : ''}</h4>
        <div class="grid2">${this.num('x', 'X', g.x, u)}${this.num('y', 'Y', g.y, u)}</div>
        <div class="row">${this.num('w', 'An', g.w, u)}${one && one.type !== 'text' && one.type !== 'zone' ? `<button class="btn ico ${one.lockRatio ? 'on' : ''}" data-act="lockRatio" title="${one.lockRatio ? 'Proporción bloqueada' : 'Proporción libre'}" type="button">${ICONS.chain}</button>` : ''}${this.num('h', 'Al', g.h, u, textH ? 'disabled title="El alto del texto se calcula solo"' : '')}</div>
        ${one && one.type === 'zone' ? '' : `<div class="row">${one ? this.num('rot', '∠', g.rot, '°') : '<div style="flex:1"></div>'}
          <button class="btn ico" data-act="rotL" title="Girar 90° a la izquierda" type="button">${ICONS.rotL}</button><button class="btn ico" data-act="rotR" title="Girar 90° a la derecha" type="button">${ICONS.rotR}</button>
          <button class="btn ico" data-act="flipH" title="Voltear horizontal" type="button">${ICONS.flipH}</button><button class="btn ico" data-act="flipV" title="Voltear vertical" type="button">${ICONS.flipV}</button></div>`}
      </div>`;
    }
    // ---- alinear ----
    const at = I.alignTo;
    h += `<div class="sect"><h4>Alinear</h4>
      <div class="btnrow" style="margin-bottom:6px">
        <button class="btn ico" data-act="al-left" title="Alinear a la izquierda" type="button">${ICONS.alL}</button><button class="btn ico" data-act="al-hcenter" title="Centrar horizontalmente" type="button">${ICONS.alC}</button><button class="btn ico" data-act="al-right" title="Alinear a la derecha" type="button">${ICONS.alR}</button>
        <button class="btn ico" data-act="al-top" title="Alinear arriba" type="button">${ICONS.alT}</button><button class="btn ico" data-act="al-vcenter" title="Centrar verticalmente" type="button">${ICONS.alM}</button><button class="btn ico" data-act="al-bottom" title="Alinear abajo" type="button">${ICONS.alB}</button>
        <button class="btn ico" data-act="dis-h" title="Distribuir horizontalmente (3 o más)" type="button">${ICONS.disH}</button><button class="btn ico" data-act="dis-v" title="Distribuir verticalmente (3 o más)" type="button">${ICONS.disV}</button>
      </div>
      <div class="row"><label class="lbl">Respecto a</label><select data-f="alignTo"><option value="auto" ${at === 'auto' ? 'selected' : ''}>Automático</option><option value="sel" ${at === 'sel' ? 'selected' : ''}>Selección</option><option value="lamina" ${at === 'lamina' ? 'selected' : ''}>Lámina</option><option value="margin" ${at === 'margin' ? 'selected' : ''}>Márgenes</option></select></div>
      <div class="hint">Automático: con un elemento se alinea a la lámina; con varios, entre ellos.</div></div>`;
    def('alignTo', v => { I.alignTo = v; }, null);
    // ---- apariencia ----
    const op = Math.round((one ? one.opacity : sel[0].opacity) * 100);
    def('op', v => { sel.forEach(e => e.opacity = clamp(+v, 0, 100) / 100); const o = $('#tab-props [data-f=opn]'); if (o) o.value = Math.round(+v); }, 'Opacidad', { live: true });
    def('opn', v => { sel.forEach(e => e.opacity = clamp(+v, 0, 100) / 100); const o = $('#tab-props [data-f=op]'); if (o) o.value = +v; }, 'Opacidad');
    h += `<div class="sect"><h4>Opacidad</h4><div class="row"><input type="range" min="0" max="100" step="1" data-f="op" value="${op}"><div class="fld" style="flex:none;width:70px"><input type="number" data-f="opn" value="${op}" min="0" max="100" step="1" style="padding-left:7px" class="has-u"><span class="u">%</span></div></div></div>`;
    // ---- específicos ----
    if (one && one.type === 'zone') h += this.zoneProps(one);
    else if (one) h += this.typeProps(one);
    else {
      const types = new Set(sel.map(e => e.type));
      if (types.size === 1 && (types.has('rect') || types.has('ellipse') || types.has('line'))) h += this.strokeFillProps(sel, sel[0]);
    }
    // ---- organizar ----
    const grouped = sel.some(e => e.groupId);
    h += `<div class="sect"><h4>Organizar</h4>
      <div class="btnrow" style="margin-bottom:6px">
        <button class="btn ico" data-act="ord-front" title="Traer al frente" type="button">${ICONS.front}</button><button class="btn ico" data-act="ord-up" title="Traer adelante" type="button">${ICONS.up}</button><button class="btn ico" data-act="ord-down" title="Enviar atrás" type="button">${ICONS.down}</button><button class="btn ico" data-act="ord-back" title="Enviar al fondo" type="button">${ICONS.back}</button>
        <button class="btn ico" data-act="dup" title="Duplicar (Ctrl+D)" type="button">${ICONS.copy}</button>
        <button class="btn ico ${sel.every(e => e.locked) ? 'on' : ''}" data-act="lock" title="Bloquear" type="button">${ICONS.lock}</button>
        <button class="btn ico danger" data-act="del" title="Eliminar (Supr)" type="button">${ICONS.trash}</button>
      </div>
      <div class="btnrow fill">${sel.length > 1 ? `<button class="btn" data-act="group" type="button">${ICONS.group} Agrupar</button>` : ''}${grouped ? `<button class="btn" data-act="ungroup" type="button">Desagrupar</button>` : ''}<button class="btn" data-act="toLam" type="button">Copiar a láminas…</button><button class="btn" data-act="fav" type="button" title="Guardar en la biblioteca para otros proyectos">★ Favorito</button></div>
      ${grouped && sel.length > 1 ? '<div class="hint" style="margin-top:6px">Ctrl + clic en el lienzo selecciona un solo elemento del grupo.</div>' : ''}
    </div>`;
    return h;
  },

  typeProps(e) {
    const def = this.def.bind(this);
    if (e.type === 'image') {
      const a = S.assets.get(e.assetId);
      if (!a) return `<div class="sect"><h4>Imagen</h4><div class="warn">No se encontró el archivo de esta imagen. Usa “Reemplazar” para volver a vincularla.</div><div class="btnrow" style="margin-top:8px"><button class="btn" data-act="replace" type="button">Reemplazar…</button></div></div>`;
      const cr = e.crop || { x: 0, y: 0, w: a.w, h: a.h };
      const dpiX = cr.w / (e.w / 25.4), dpiY = cr.h / (e.h / 25.4);
      const dpi = Math.round(Math.min(dpiX, dpiY));
      const cropped = cr.x > 0.5 || cr.y > 0.5 || Math.abs(cr.w - a.w) > 0.5 || Math.abs(cr.h - a.h) > 0.5;
      const dpiCls = dpi < 150 ? 'warn' : '';
      return `<div class="sect"><h4>Imagen</h4>
        <div class="hint" style="margin-bottom:8px">${esc(a.name)}<br>Original: ${a.w} × ${a.h} px${cropped ? ` · recorte ${Math.round(cr.w)} × ${Math.round(cr.h)} px` : ''}<br>
        <span class="${dpiCls}">Resolución al tamaño actual: <b>${dpi} ppp</b>${dpi < 150 ? ' — puede verse pixelada al imprimir' : ''}</span></div>
        <div class="btnrow fill" style="margin-bottom:6px"><button class="btn" data-act="crop" type="button">Recortar…</button>${cropped ? '<button class="btn" data-act="uncrop" type="button">Quitar recorte</button>' : ''}<button class="btn" data-act="replace" type="button">Reemplazar…</button></div>
        <div class="btnrow fill"><button class="btn" data-act="sz-fitMargins" type="button" title="Ajustar dentro de los márgenes">Ajustar</button><button class="btn" data-act="sz-fill" type="button" title="Cubrir toda la lámina">Llenar</button><button class="btn" data-act="sz-native" type="button" title="Tamaño a ${settings().importDpi} ppp">Original</button></div>
        <div class="btnrow fill" style="margin-top:6px"><button class="btn" data-act="fitLam" type="button" title="La lámina toma el tamaño y la proporción de esta imagen">Ajustar lámina a esta imagen</button></div>
      </div>` + this.imagePixProps(e, a);
    }
    if (e.type === 'text') {
      def('text', v => { e.text = v; fitTextHeight(e); }, 'Editar texto', { live: true });
      def('font', v => { if (v === '__import') { $('#fileFont').click(); UI.props(); return 'skip'; } e.font = v; I.lastStyle.text.font = v; fitTextHeight(e); }, 'Fuente');
      def('size', v => { e.size = clamp(+v, 1, 2000); I.lastStyle.text.size = e.size; fitTextHeight(e); }, 'Tamaño de texto');
      def('weight', v => { e.weight = +v; I.lastStyle.text.weight = e.weight; fitTextHeight(e); }, 'Peso');
      def('lh', v => { e.lh = clamp(+v, 0.5, 5); fitTextHeight(e); }, 'Interlineado');
      def('ls', v => { e.ls = clamp(+v, -20, 200); fitTextHeight(e); }, 'Espaciado');
      def('color', v => { e.color = v; I.lastStyle.text.color = v; }, 'Color de texto', { live: true });
      const fonts = [...new Set([...S.project.fonts.map(f => f.family), ...(UI.localFonts || []), ...SYSTEM_FONTS, e.font])];
      const imported = new Set(S.project.fonts.map(f => f.family));
      return `<div class="sect"><h4>Texto</h4>
        <textarea class="ta" data-f="text" rows="3">${esc(e.text)}</textarea>
        <div class="hint" style="margin:4px 0 8px">Campos automáticos: ${['{proyecto}', '{lamina}', '{n}', '{total}', '{fecha}'].map(t => `<span class="chip tok" data-act="tok" data-tok="${t}">${t}</span>`).join('')}</div>
        <div class="row"><select data-f="font">${fonts.map(f => `<option value="${esc(f)}" ${f === e.font ? 'selected' : ''} style="font-family:'${esc(f)}'">${esc(f)}${imported.has(f) ? ' · importada' : ''}</option>`).join('')}<option value="__import">Importar fuente TTF/OTF…</option></select></div>
        ${window.queryLocalFonts && !UI.localFonts ? '<div class="row"><button class="btn" data-act="localFonts" type="button" style="flex:1">Ver todas las fuentes instaladas</button></div>' : ''}
        <div class="grid2">${this.num('size', 'T', e.size, 'pt', 'min="1"')}<select data-f="weight">${[[100, 'Delgada'], [300, 'Ligera'], [400, 'Normal'], [500, 'Media'], [600, 'Seminegrita'], [700, 'Negrita'], [800, 'Extra negrita'], [900, 'Negra']].map(([v, n]) => `<option value="${v}" ${+e.weight === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="row"><div class="seg">${['left', 'center', 'right'].map(a => `<button type="button" data-act="align-${a}" class="${(e.align || 'left') === a ? 'on' : ''}" title="${{ left: 'Izquierda', center: 'Centro', right: 'Derecha' }[a]}">${{ left: '⯇≡', center: '≡', right: '≡⯈' }[a]}</button>`).join('')}</div>
          <button class="btn ico ${e.italic ? 'on' : ''}" data-act="italic" title="Cursiva" type="button"><i style="font-family:Georgia;font-size:15px">I</i></button>
          <input type="color" data-f="color" value="${e.color || '#000000'}" title="Color"></div>${this.swatches('color')}
        <div class="grid2">${this.num('lh', '↕', e.lh || 1.2, '×', 'step="0.05" title="Interlineado"')}${this.num('ls', '↔', e.ls || 0, 'pt', 'step="0.1" title="Espaciado entre letras"')}</div>
        <div class="hint">Doble clic en el texto para escribir directamente en la lámina.</div>
      </div>`;
    }
    return this.strokeFillProps([e], e);
  },

  versionsSect(l) {
    const vs = l.versions || [];
    return `<div class="sect"><h4>Versiones para comparar <span class="hint">${vs.length}</span></h4>
      <div class="btnrow fill" style="margin-bottom:${vs.length ? 8 : 0}px"><button class="btn primary" data-act="ver-mark" type="button">Guardar versión</button>${vs.length ? '<button class="btn" data-act="ver-cmp" type="button">Comparar…</button>' : ''}</div>
      ${vs.length ? `<div class="ver-list">${vs.slice().reverse().map(v => { const a = S.assets.get(v.assetId); if (a && !a._url) a._url = URL.createObjectURL(a.blob); return `<div class="ver" data-vid="${v.id}"><img src="${a ? a._url : ''}" alt=""><div style="flex:1;min-width:0"><div class="ver-n">${esc(v.name)}</div><div class="hint">${Versions.fmtDate(v.date)}</div></div><button class="btn ico" data-act="ver-c" data-vid="${v.id}" title="Comparar con la actual"><svg viewBox="0 0 24 24"><path d="M12 3v18M4 6h5v12H4zM15 6h5v12h-5z"/></svg></button><button class="btn ico" data-act="ver-r" data-vid="${v.id}" title="Renombrar"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button><button class="btn ico danger" data-act="ver-d" data-vid="${v.id}" title="Eliminar">${ICONS.trash}</button></div>`; }).join('')}</div>`
      : '<div class="hint" style="margin-top:6px">Guarda una foto de la lámina cuando llegues a un resultado que te guste; después puedes compararla con los cambios nuevos.</div>'}</div>`;
  },

  /* ---- fase 2: opciones de herramienta ---- */
  toolOptions() {
    const t = S.tool, o = Pix.opt, def = this.def.bind(this);
    if (!isPixTool(t) && t !== 'eyedrop' && t !== 'zone') return '';
    const names = { selRect: 'Selección rectangular', selEllipse: 'Selección elíptica', selPoly: 'Selección poligonal', selLasso: 'Lazo', wand: 'Varita mágica', brush: 'Pincel de máscara', eyedrop: 'Cuentagotas', zone: 'Zona de exportación' };
    const tgt = Pix.target();
    let h = `<div class="sect tool-opts"><h4>${names[t]}</h4>`;
    if (t === 'eyedrop') return h + `<div class="hint">Pasa el cursor sobre la lámina para ver el color. Clic: lo aplica al texto o forma seleccionada (relleno; con Alt, contorno) y lo copia en HEX. Los colores quedan en la pestaña Colores.</div></div>`;
    if (t === 'zone') return h + `<div class="hint">Arrastra sobre la lámina para marcar un área. Las zonas no se imprimen: sirven para exportar partes de la lámina como archivos aparte desde Exportar → Zonas.</div></div>`;
    if (!tgt) h += `<div class="hint warn" style="margin-bottom:8px">Selecciona una imagen con la flecha (V). Estas herramientas trabajan sobre los píxeles de una imagen.</div>`;
    if (t !== 'brush') {
      def('pmode', v => { o.mode = v; Pix.saveOpt(); }, null);
      def('pfeather', v => { o.feather = clamp(+v, 0, 100); Pix.saveOpt(); }, null);
      h += `<div class="row"><label class="lbl">Modo</label><div class="seg">${[['new', 'Nueva'], ['add', 'Sumar'], ['sub', 'Restar'], ['int', 'Cruce']].map(([v, n]) => `<button type="button" data-act="pmode-${v}" class="${o.mode === v ? 'on' : ''}">${n}</button>`).join('')}</div></div>
        <div class="row"><label class="lbl">Suavizado</label><input type="range" min="0" max="40" step="1" data-f="pfeather" value="${o.feather}"><span class="hint" style="width:26px;text-align:right">${o.feather}</span></div>`;
    }
    if (t === 'wand') {
      def('ptol', v => { o.tol = clamp(+v, 0, 255); Pix.saveOpt(); const s = $('#ptolv'); if (s) s.textContent = o.tol; }, null, { live: true });
      def('pcont', v => { o.contiguous = v; Pix.saveOpt(); }, null);
      h += `<div class="row"><label class="lbl">Tolerancia</label><input type="range" min="0" max="160" step="1" data-f="ptol" value="${o.tol}"><span class="hint" id="ptolv" style="width:26px;text-align:right">${o.tol}</span></div>
        <label class="row" style="gap:6px;cursor:pointer"><input type="checkbox" data-f="pcont" ${o.contiguous ? 'checked' : ''}> Solo píxeles conectados</label>`;
    }
    if (t === 'brush') {
      def('psize', v => { o.size = clamp(+v, 2, 400); Pix.saveOpt(); R.request(); const s = $('#psizev'); if (s) s.textContent = o.size; }, null, { live: true });
      def('phard', v => { o.hard = clamp(+v, 0, 100); Pix.saveOpt(); const s = $('#phardv'); if (s) s.textContent = o.hard; }, null, { live: true });
      h += `<div class="row"><label class="lbl">Acción</label><div class="seg"><button type="button" data-act="bmode-hide" class="${o.brushMode === 'hide' ? 'on' : ''}">Ocultar</button><button type="button" data-act="bmode-show" class="${o.brushMode === 'show' ? 'on' : ''}">Restaurar</button></div></div>
        <div class="row"><label class="lbl">Tamaño</label><input type="range" min="2" max="300" step="1" data-f="psize" value="${o.size}"><span class="hint" id="psizev" style="width:26px;text-align:right">${o.size}</span></div>
        <div class="row"><label class="lbl">Dureza</label><input type="range" min="0" max="100" step="1" data-f="phard" value="${o.hard}"><span class="hint" id="phardv" style="width:26px;text-align:right">${o.hard}</span></div>
        <div class="hint">Pinta sobre la imagen para ocultar o devolver partes. Alt invierte la acción mientras pintas. Nada se borra de verdad: la máscara se puede quitar.</div>`;
    } else {
      const tips = { selPoly: 'Clic en cada vértice. Cierra con clic en el primer punto, doble clic o Intro. Retroceso borra el último punto; Esc cancela.', selLasso: 'Mantén presionado y dibuja el contorno.', wand: 'Clic sobre un color para seleccionar los parecidos. Sube la tolerancia para abarcar más tonos.', selRect: 'Arrastra sobre la imagen. Mayús: cuadrado.', selEllipse: 'Arrastra sobre la imagen. Mayús: círculo.' };
      h += `<div class="hint" style="margin-top:4px">${tips[t]} Mayús suma y Alt resta a la selección.</div>`;
    }
    return h + '</div>';
  },
  imagePixProps(e, a) {
    const def = this.def.bind(this), adj = e.adj || {};
    let h = '';
    if (Pix.has() && Pix.sel.elId === e.id) {
      h += `<div class="sect" style="background:var(--accent-soft)"><h4>Selección activa</h4>
        <div class="btnrow fill" style="margin-bottom:6px"><button class="btn primary" data-act="px-crop" type="button">Recortar a la selección</button></div>
        <div class="btnrow fill" style="margin-bottom:6px"><button class="btn" data-act="px-hide" type="button" title="Supr">Ocultar selección</button><button class="btn" data-act="px-keep" type="button">Dejar solo esto</button></div>
        <div class="btnrow fill" style="margin-bottom:6px"><button class="btn" data-act="px-extract" type="button">Extraer como imagen nueva</button></div>
        <div class="btnrow fill"><button class="btn" data-act="px-invert" type="button" title="Ctrl+Mayús+I">Invertir</button><button class="btn" data-act="px-all" type="button">Toda</button><button class="btn" data-act="px-clear" type="button" title="Esc">Quitar</button></div>
      </div>`;
    }
    h += `<div class="sect"><h4>Recorte libre y fondo</h4>
      ${e.maskId ? '<div class="hint" style="margin-bottom:6px">Esta imagen tiene una máscara: las zonas ocultas se ven transparentes.</div>' : '<div class="hint" style="margin-bottom:6px">Para recortar con forma de polígono, usa la selección poligonal (P) y luego “Recortar a la selección”. Para quitar un fondo liso, usa la varita (W) sobre el fondo y “Ocultar selección”.</div>'}
      <div class="btnrow fill" style="margin-bottom:6px"><button class="btn" data-act="tool-selPoly" type="button">Polígono</button><button class="btn" data-act="tool-wand" type="button">Varita</button><button class="btn" data-act="tool-brush" type="button">Pincel</button></div>
      ${e.maskId ? '<div class="btnrow fill" style="margin-bottom:6px"><button class="btn" data-act="mk-invert" type="button">Invertir máscara</button><button class="btn" data-act="mk-reset" type="button">Quitar máscara</button></div>' : ''}
      <div class="btnrow fill"><button class="btn" data-act="px-png" type="button">Exportar PNG transparente</button></div>
    </div>`;
    def('adjB', v => { e.adj = { ...adj, ...e.adj, b: +v }; }, 'Brillo', { live: true });
    def('adjC', v => { e.adj = { ...adj, ...e.adj, c: +v }; }, 'Contraste', { live: true });
    def('adjS', v => { e.adj = { ...adj, ...e.adj, s: +v }; }, 'Saturación', { live: true });
    const sl = (f, n, v) => `<div class="row"><label class="lbl">${n}</label><input type="range" min="-100" max="100" step="1" data-f="${f}" value="${v || 0}" title="Doble clic: 0"><span class="hint adjv" style="width:30px;text-align:right">${v || 0}</span></div>`;
    h += `<div class="sect"><h4>Ajustes ${(adj.b || adj.c || adj.s) ? '<button class="btn" data-act="adj-reset" type="button" style="height:22px;padding:0 8px">Restablecer</button>' : ''}</h4>
      ${sl('adjB', 'Brillo', adj.b)}${sl('adjC', 'Contraste', adj.c)}${sl('adjS', 'Saturación', adj.s)}
      <div class="hint">Sirven para igualar el tono entre imágenes de la lámina. No modifican el archivo original.</div></div>`;
    const pe = I.perspEdit === e.id;
    h += `<div class="sect"><h4>Perspectiva</h4>
      <div class="btnrow fill"><button class="btn ${pe ? 'primary' : ''}" data-act="persp" type="button">${pe ? 'Listo (Intro)' : 'Editar perspectiva'}</button>${hasPersp(e) ? '<button class="btn" data-act="persp-reset" type="button">Quitar</button>' : ''}</div>
      ${pe ? '<div class="hint" style="margin-top:6px">Arrastra los rombos naranjas de las cuatro esquinas. Sirve para colocar una imagen sobre una fachada, pantalla o plano inclinado.</div>' : ''}</div>`;
    return h;
  },
  zoneProps(e) {
    this.def('zname', v => { e.name = v.trim() || e.name; }, 'Renombrar zona');
    return `<div class="sect"><h4>Zona de exportación</h4>
      <div class="row"><label class="lbl">Nombre</label><input type="text" data-f="zname" value="${esc(e.name)}"></div>
      <div class="btnrow fill"><button class="btn primary" data-act="zone-export" type="button">Exportar esta zona…</button></div>
      <div class="hint" style="margin-top:6px">La zona no aparece en el PDF ni en las imágenes de la lámina. Desde Exportar → Zonas puedes sacar todas de una vez.</div></div>`;
  },
  swatches(field) {
    const cs = Colors.quick();
    if (!cs.length) return '';
    return `<div class="swrow">${cs.map(c => `<button type="button" class="sw" data-act="sw" data-sf="${field}" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div>`;
  },
  colorsTab() {
    const box = $('#tab-colors'); if (!box || box.hidden) return;
    const cur = Colors.current, [r, g, b] = hexToRgb(cur), [hh, ss, ll] = rgbToHsl(r, g, b);
    const rec = Colors.recent(), pals = Colors.palettes();
    const chip = (c, extra = '') => `<button type="button" class="sw big" data-c="${c}" ${extra} style="background:${c}" title="${c}"></button>`;
    box.innerHTML = `<div class="sect"><h4>Color actual</h4>
        <div class="row"><input type="color" id="colCur" value="${cur}" style="width:52px;height:40px"><input type="text" id="colHex" value="${cur}" style="font-family:Consolas,monospace"></div>
        <div class="col-codes">
          <button type="button" class="chip tok" data-copy="${cur}">${cur}</button>
          <button type="button" class="chip tok" data-copy="rgb(${r}, ${g}, ${b})">rgb(${r}, ${g}, ${b})</button>
          <button type="button" class="chip tok" data-copy="hsl(${hh}, ${ss}%, ${ll}%)">hsl(${hh}, ${ss}%, ${ll}%)</button></div>
        <div class="hint" style="margin-top:4px">Clic en un código para copiarlo. Usa el cuentagotas (K) para tomar colores de la lámina.</div>
        <div class="btnrow fill" style="margin-top:8px"><button type="button" class="btn" id="colApply">Aplicar a la selección</button><button type="button" class="btn" id="colApplyStroke" title="Contorno de formas">Al contorno</button></div></div>
      <div class="sect"><h4>Recientes</h4>${rec.length ? `<div class="swrow">${rec.map(c => chip(c)).join('')}</div>` : '<div class="hint">Aparecen aquí los colores que tomes o apliques.</div>'}</div>
      <div class="sect"><h4>Paletas del proyecto <button type="button" class="btn" id="palNew" style="height:22px;padding:0 8px">Nueva</button></h4>
        ${pals.length ? pals.map(p => `<div class="pal" data-pid="${p.id}"><div class="row" style="margin-bottom:4px"><input type="text" class="palName" value="${esc(p.name)}" style="height:24px"><button type="button" class="btn ico" data-paladd="${p.id}" title="Agregar el color actual">+</button><button type="button" class="btn ico danger" data-paldel="${p.id}" title="Eliminar paleta">${ICONS.trash}</button></div>
          <div class="swrow">${p.colors.map((c, i) => chip(c, `data-pc="${p.id}:${i}"`)).join('') || '<span class="hint">Vacía. Usa + para agregar el color actual.</span>'}</div></div>`).join('') : '<div class="hint">Crea paletas con los colores de tu proyecto o de un cliente. Se guardan dentro del proyecto. Clic derecho sobre un color lo quita.</div>'}
      </div>`;
    const setCur = c => { Colors.current = c; this.colorsTab(); };
    $('#colCur', box).addEventListener('input', e => { Colors.current = e.target.value; $('#colHex', box).value = e.target.value; });
    $('#colCur', box).addEventListener('change', () => this.colorsTab());
    $('#colHex', box).addEventListener('change', e => { let v = e.target.value.trim(); if (!v.startsWith('#')) v = '#' + v; if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) { if (v.length === 4) v = '#' + v.slice(1).split('').map(c => c + c).join(''); setCur(v.toLowerCase()); } else toast('Escribe un código HEX válido, por ejemplo #2f6fde.', 'warn'); });
    $$('[data-copy]', box).forEach(b => b.onclick = () => { navigator.clipboard?.writeText(b.dataset.copy).then(() => toast('Copiado: ' + b.dataset.copy, '', 1500)).catch(() => toast('No se pudo copiar', 'warn')); });
    $$('.sw.big', box).forEach(b => {
      b.onclick = () => { setCur(b.dataset.c); navigator.clipboard?.writeText(b.dataset.c).catch(() => { }); };
      b.oncontextmenu = ev => { if (!b.dataset.pc) return; ev.preventDefault(); const [pid, i] = b.dataset.pc.split(':'); const p = pals.find(x => x.id === pid); p.colors.splice(+i, 1); commit('Quitar color de paleta'); this.colorsTab(); };
    });
    const applyTo = stroke => { const n = UI.applyColor(Colors.current, stroke); if (!n) toast('Selecciona un texto o una forma para aplicarle el color.', 'warn'); };
    $('#colApply', box).onclick = () => applyTo(false);
    $('#colApplyStroke', box).onclick = () => applyTo(true);
    $('#palNew', box).onclick = () => { pals.push({ id: uid('p'), name: 'Paleta ' + (pals.length + 1), colors: [Colors.current] }); commit('Nueva paleta'); this.colorsTab(); };
    $$('[data-paladd]', box).forEach(b => b.onclick = () => { const p = pals.find(x => x.id === b.dataset.paladd); if (!p.colors.includes(Colors.current)) p.colors.push(Colors.current); commit('Agregar color a paleta'); this.colorsTab(); });
    $$('[data-paldel]', box).forEach(b => b.onclick = async () => { const p = pals.find(x => x.id === b.dataset.paldel); if (await UI.confirm(`¿Eliminar la paleta “${p.name}”?`, 'Puedes recuperarla con Deshacer.', 'Eliminar', true)) { S.project.palettes = pals.filter(x => x !== p); commit('Eliminar paleta'); this.colorsTab(); } });
    $$('.palName', box).forEach(inp => inp.addEventListener('change', () => { const p = pals.find(x => x.id === inp.closest('.pal').dataset.pid); p.name = inp.value.trim() || p.name; commit('Renombrar paleta'); }));
  },
  applyColor(hex, stroke) {
    let n = 0;
    for (const e of selEls()) {
      if (isLk(e)) continue;
      if (e.type === 'text') { e.color = hex; n++; }
      else if (e.type === 'line') { e.stroke = hex; n++; }
      else if (e.type === 'rect' || e.type === 'ellipse') { if (stroke) e.stroke = hex; else e.fill = hex; n++; }
    }
    if (n) { Colors.addRecent(hex); commit('Aplicar color'); UI.props(); R.request(); }
    return n;
  },

  strokeFillProps(sel, e) {
    const def = this.def.bind(this);
    const all = fn => sel.forEach(fn);
    let h = '<div class="sect"><h4>Estilo</h4>';
    if (e.type !== 'line') {
      def('fill', v => { all(x => x.fill = v); I.lastStyle[e.type].fill = v; }, 'Relleno', { live: true });
      def('fillNone', v => { all(x => x.fill = v ? null : '#d9dee6'); I.lastStyle[e.type].fill = v ? null : '#d9dee6'; UI.props(); }, 'Relleno');
      h += `<div class="row"><label class="lbl">Relleno</label><input type="color" data-f="fill" value="${e.fill || '#d9dee6'}" ${e.fill ? '' : 'disabled'}><label class="toggle hint" style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-f="fillNone" ${e.fill ? '' : 'checked'}> Sin relleno</label></div>${this.swatches('fill')}`;
    }

    const pc = prevCv.getContext('2d'); pc.imageSmoothingQuality = 'high'; pc.drawImage(a.preview, 0, 0, prevCv.width, prevCv.height);

          <span style="display:inline-flex;gap:4px;align-items:center;margin-left:4px"><input type="number" id="crW" placeholder="An" style="width:58px" min="1"> : <input type="number" id="crH" placeholder="Al" style="width:58px" min="1"><button type="button" class="btn" id="crCustom">Usar</button></span></div>
        <div class="crop-wrap-outer"><div class="crop-wrap" id="cropWrap" style="width:${dw}px;height:${dh}px"><img src="${src}" alt=""><div class="crop-box" id="cropBox"></div></div></div>

          <label class="hint">X <input type="number" id="cX" style="width:72px"></label><label class="hint">Y <input type="number" id="cY" style="width:72px"></label><label class="hint">An <input type="number" id="cW" style="width:72px"></label><label class="hint">Al <input type="number" id="cH" style="width:72px"></label><span class="hint">px</span></div>
        <div class="hint">Arrastra el recuadro o sus esquinas. Arrastra fuera del recuadro para trazar uno nuevo. Mayús mantiene la proporción. El recorte no destruye la imagen: puedes ajustarlo o quitarlo después.</div>`,
      buttons: [{ label: 'Restablecer', value: 'reset', left: true }, { label: 'Cancelar', value: null }, { label: 'Aplicar recorte', value: 'ok', cls: 'primary' }],
      mount: (f) => {

        hs.forEach(h => { const d = document.createElement('div'); d.className = 'crop-h'; d.dataset.h = h; d.style.cursor = HANDLE_CURSORS[h]; box.appendChild(d); });
        const place = () => {

          const pos = { nw: [0, 0], n: [.5, 0], ne: [1, 0], e: [1, .5], se: [1, 1], s: [.5, 1], sw: [0, 1], w: [0, .5] };

          $('#cX', f).value = Math.round(crop.x); $('#cY', f).value = Math.round(crop.y); $('#cW', f).value = Math.round(crop.w); $('#cH', f).value = Math.round(crop.h);

        const applyRatio = r => {

          const p = pos(ev), h = ev.target.dataset.h;
          if (h) drag = { type: 'h', h, c0: { ...crop } };
          else if (ev.target === box) drag = { type: 'm', p0: p, c0: { ...crop } };
          else drag = { type: 'n', p0: p };
        });
        wrap.addEventListener('pointermove', ev => {
          if (!drag) return; const p = pos(ev);
          const r = ratio || (ev.shiftKey ? (drag.c0 ? drag.c0.w / drag.c0.h : null) : null);
          if (drag.type === 'm') { crop.x = drag.c0.x + p.x - drag.p0.x; crop.y = drag.c0.y + p.y - drag.p0.y; norm(); }
          else if (drag.type === 'n') {
            let x1 = drag.p0.x, y1 = drag.p0.y, w = p.x - x1, h = p.y - y1;
            if (r) { const sg = Math.sign(h || 1); h = sg * Math.abs(w) / r; }
            crop = { x: Math.min(x1, x1 + w), y: Math.min(y1, y1 + h), w: Math.max(4, Math.abs(w)), h: Math.max(4, Math.abs(h)) }; norm();
          } else {
            const c0 = drag.c0, h = drag.h;
            let L = c0.x, T = c0.y, Rr = c0.x + c0.w, B = c0.y + c0.h;
            if (h.includes('w')) L = Math.min(p.x, Rr - 4); if (h.includes('e')) Rr = Math.max(p.x, L + 4);
            if (h.includes('n')) T = Math.min(p.y, B - 4); if (h.includes('s')) B = Math.max(p.y, T + 4);
            if (r) {
              let w = Rr - L, hh = B - T;
              if (h.length === 2) { if (w / r > hh) hh = w / r; else w = hh * r; if (h.includes('w')) L = Rr - w; else Rr = L + w; if (h.includes('n')) T = B - hh; else B = T + hh; }
              else if (h === 'e' || h === 'w') { hh = w / r; const cy = (c0.y + c0.h / 2); T = cy - hh / 2; B = cy + hh / 2; }
              else { w = hh * r; const cx = c0.x + c0.w / 2; L = cx - w / 2; Rr = cx + w / 2; }
              if (L < 0 || T < 0 || Rr > a.w || B > a.h) return; // fuera de la imagen

          }

        });
        wrap.addEventListener('pointerup', () => { drag = null; });
        f._reset = () => { crop = { x: 0, y: 0, w: a.w, h: a.h }; place(); };
        place();
      },
      validate: (f, v) => { if (v === 'reset') { f._reset(); return false; } },
    });
    if (res === 'ok') A.applyCrop(el, { x: round(crop.x, 2), y: round(crop.y, 2), w: round(crop.w, 2), h: round(crop.h, 2) });
  },
};

function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  R.request();
}

/* =====================================================================
   Cajetín: predeterminado, guardar selección como plantilla, insertar
   Las posiciones se guardan relativas a la esquina inferior derecha
   de la lámina, así el cajetín se acomoda en hojas de cualquier tamaño.
   ===================================================================== */

const CAJ_LIB_KEY = 'el-cajetines';
const Caj = {
  library() { try { return JSON.parse(localStorage.getItem(CAJ_LIB_KEY) || '[]'); } catch { return []; } },
  saveLibrary(list) {
    try { localStorage.setItem(CAJ_LIB_KEY, JSON.stringify(list)); return true; }
    catch { toast('No cupo en la biblioteca del navegador (las imágenes grandes ocupan mucho). Se guardó solo en este proyecto.', 'warn', 5000); return false; }
  },
  // cajetín predeterminado generado para una lámina
  build(l, opts = {}) {
    const m = l.margin, els = [], g = uid('g');
    const W = clamp(l.w * 0.3, 70, 170), s = W / 150;
    const rowH = [16, 12, 10, 10].map(v => v * s);
    const H = rowH.reduce((a, b) => a + b, 0);
    const x0 = l.w - m.r - W, y0 = l.h - m.b - H;
    const sw = 0.35, swIn = 0.18, ink = '#1d232c', gray = '#6a7280';
    const rect = (x, y, w, h, lw) => els.push(normalizeEl({ type: 'rect', name: 'Cajetín · celda', x, y, w, h, fill: null, stroke: ink, sw: lw, radius: 0, groupId: g }));
    const text = (x, y, w, txt, size, weight, color, name) => {
      const e = normalizeEl({ type: 'text', name, text: txt, x, y, w, h: 4, font: 'Arial', size, weight, italic: false, align: 'left', lh: 1.15, ls: 0, color, groupId: g });
      fitTextHeight(e, tokenInfo(l)); els.push(e);
    };
    if (opts.frame) els.push(normalizeEl({ type: 'rect', name: 'Marco', x: m.l, y: m.t, w: l.w - m.l - m.r, h: l.h - m.t - m.b, fill: null, stroke: ink, sw: 0.5, radius: 0, groupId: g }));
    els.push(normalizeEl({ type: 'rect', name: 'Cajetín · fondo', x: x0, y: y0, w: W, h: H, fill: '#ffffff', stroke: null, sw: 0, radius: 0, groupId: g }));
    const pad = 2 * s, lab = 5.5 * s, val = (n) => n * s;
    let y = y0;
    const cell = (x, w, h, label, value, vsize) => {
      rect(x, y, w, h, swIn);
      text(x + pad, y + pad * 0.7, w - pad * 2, label, lab, 400, gray, 'Cajetín · ' + label.toLowerCase());
      text(x + pad, y + pad * 0.7 + lab * PT_TO_MM * 1.4, w - pad * 2, value, vsize, 700, ink, 'Cajetín · ' + label.toLowerCase() + ' (valor)');
    };
    cell(x0, W, rowH[0], 'PROYECTO', '{proyecto}', val(11)); y += rowH[0];
    cell(x0, W, rowH[1], 'LÁMINA', '{lamina}', val(9)); y += rowH[1];
    cell(x0, W / 2, rowH[2], 'FECHA', '{fecha}', val(7.5)); cell(x0 + W / 2, W / 2, rowH[2], 'ESCALA', 'S/E', val(7.5)); y += rowH[2];
    cell(x0, W / 2, rowH[3], 'DIBUJÓ', 'Nombre', val(7.5)); cell(x0 + W / 2, W / 2, rowH[3], 'No. DE LÁMINA', '{n} / {total}', val(7.5));
    rect(x0, y0, W, H, sw);
    els[els.length - 1].name = 'Cajetín · contorno';
    return els;
  },
  // convierte elementos de una lámina en plantilla relativa a la esquina inferior derecha
  toTemplate(name, els, l) {
    const t = { id: uid('c'), name, refW: l.w, refH: l.h, elements: deep(els).map(e => { e.x -= l.w; e.y -= l.h; e.groupId = null; return e; }), assets: {} };
    return t;
  },
  async withAssets(t) {
    // incluir imágenes como dataURL para la biblioteca global
    const out = deep(t); out.assets = {};
    for (const e of out.elements) if (e.type === 'image' && S.assets.has(e.assetId) && !out.assets[e.assetId]) out.assets[e.assetId] = await blobToDataURL(S.assets.get(e.assetId).blob);
    return out;
  },
  async insert(t, l) {
    for (const [id, d] of Object.entries(t.assets || {})) {
      if (!S.assets.has(id)) { try { await addImageBlob(dataURLToBlob(d), 'logo'); } catch { } }
    }
    const g = uid('g');
    const els = deep(t.elements).map(e => { e.id = uid(); e.x += l.w; e.y += l.h; e.groupId = g; return normalizeEl(e); });
    for (const e of els) if (e.type === 'text') fitTextHeight(e, tokenInfo(l));
    l.elements.push(...els);
    R.dirtyThumbs.add(l.id);
    return els;
  },
};

      $$('input[name=cj]', f).forEach(i => i.addEventListener('change', upd));

        ev.preventDefault(); ev.stopPropagation();

function blobToDataURL(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
function dataURLToBlob(d) {
  const [h, b64] = d.split(','); const mime = (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: mime });
}

/* =====================================================================
   FASE 2 · Edición de imagen
   Perspectiva (homografía), máscaras no destructivas, ajustes,
   selecciones de píxeles (rectángulo, elipse, polígono, lazo, varita),
   pincel de máscara, cuentagotas y zonas de exportación.
   ===================================================================== */

const PIX_MAX = 3000;                 // resolución máxima de máscaras y selecciones
const PIX_TOOLS = ['selRect', 'selEllipse', 'selPoly', 'selLasso', 'wand', 'brush'];
const isPixTool = t => PIX_TOOLS.includes(t);

/* ---------- homografía (cuadrado unitario → cuadrilátero) ---------- */
function homography(q) {
  const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = q;
  const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  let a, b, c, d, e, f, g, h;
  if (Math.abs(sx) < 1e-12 && Math.abs(sy) < 1e-12) {
    a = x1 - x0; b = x3 - x0; c = x0; d = y1 - y0; e = y3 - y0; f = y0; g = 0; h = 0;
  } else {
    const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2;
    const den = dx1 * dy2 - dx2 * dy1;
    g = (sx * dy2 - dx2 * sy) / den; h = (dx1 * sy - sx * dy1) / den;
    a = x1 - x0 + g * x1; b = x3 - x0 + h * x3; c = x0;
    d = y1 - y0 + g * y1; e = y3 - y0 + h * y3; f = y0;
  }
  const M = [a, b, c, d, e, f, g, h, 1];
  const map = (u, v) => { const w = g * u + h * v + 1; return [(a * u + b * v + c) / w, (d * u + e * v + f) / w]; };
  // inversa 3×3
  const [A, B, C, D, E, F, G, H, I] = M;
  const det = A * (E * I - F * H) - B * (D * I - F * G) + C * (D * H - E * G);
  const inv = [(E * I - F * H), -(B * I - C * H), (B * F - C * E), -(D * I - F * G), (A * I - C * G), -(A * F - C * D), (D * H - E * G), -(A * H - B * G), (A * E - B * D)].map(v => v / det);
  const unmap = (x, y) => { const w = inv[6] * x + inv[7] * y + inv[8]; return [(inv[0] * x + inv[1] * y + inv[2]) / w, (inv[3] * x + inv[4] * y + inv[5]) / w]; };
  return { map, unmap };
}
const DEFAULT_QUAD = [[0, 0], [1, 0], [1, 1], [0, 1]];
function hasPersp(e) { return e.type === 'image' && Array.isArray(e.persp) && e.persp.some((p, i) => Math.abs(p[0] - DEFAULT_QUAD[i][0]) > 1e-4 || Math.abs(p[1] - DEFAULT_QUAD[i][1]) > 1e-4); }
// esquinas del cuadrilátero en coordenadas locales (centro = 0,0; ya volteadas)
function localQuad(e) { return (e.persp || DEFAULT_QUAD).map(([u, v]) => [-e.w / 2 + u * e.w, -e.h / 2 + v * e.h]); }

// dibuja la porción (sx,sy,sw,sh) de src deformada sobre el cuadrilátero quad (coords del contexto)
function drawImageQuad(ctx, src, sx, sy, sw, sh, quad, scale, n = 14) {
  const H = homography(quad);
  const eps = 1.1 / scale;
  const P = [];
  for (let j = 0; j <= n; j++) { P[j] = []; for (let i = 0; i <= n; i++) P[j][i] = H.map(i / n, j / n); }
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const u0 = sx + sw * i / n, u1 = sx + sw * (i + 1) / n, v0 = sy + sh * j / n, v1 = sy + sh * (j + 1) / n;
    const p00 = P[j][i], p10 = P[j][i + 1], p01 = P[j + 1][i], p11 = P[j + 1][i + 1];
    drawTri(ctx, src, p00, p10, p11, [u0, v0], [u1, v0], [u1, v1], eps);
    drawTri(ctx, src, p00, p11, p01, [u0, v0], [u1, v1], [u0, v1], eps);
  }
}
function drawTri(ctx, img, d0, d1, d2, s0, s1, s2, eps) {
  const [x0, y0] = d0, [x1, y1] = d1, [x2, y2] = d2, [u0, v0] = s0, [u1, v1] = s1, [u2, v2] = s2;
  const den = u0 * (v2 - v1) - u1 * v2 + u2 * v1 + (u1 - u2) * v0;
  if (Math.abs(den) < 1e-9) return;
  ctx.save();
  const cx = (x0 + x1 + x2) / 3, cy = (y0 + y1 + y2) / 3;
  const ex = (x, y) => { const dx = x - cx, dy = y - cy, l = Math.hypot(dx, dy) || 1; return [x + dx / l * eps, y + dy / l * eps]; };
  const a = ex(x0, y0), b = ex(x1, y1), c = ex(x2, y2);
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath(); ctx.clip();
  const m11 = -(v0 * (x2 - x1) - v1 * x2 + v2 * x1 + (v1 - v2) * x0) / den;
  const m12 = (v1 * y2 + v0 * (y1 - y2) - v2 * y1 + (v2 - v1) * y0) / den;
  const m21 = (u0 * (x2 - x1) - u1 * x2 + u2 * x1 + (u1 - u2) * x0) / den;
  const m22 = -(u1 * y2 + u0 * (y1 - y2) - u2 * y1 + (u2 - u1) * y0) / den;
  const dx = (u0 * (v2 * x1 - v1 * x2) + v0 * (u1 * x2 - u2 * x1) + (u2 * v1 - u1 * v2) * x0) / den;
  const dy = (u0 * (v2 * y1 - v1 * y2) + v0 * (u1 * y2 - u2 * y1) + (u2 * v1 - u1 * v2) * y0) / den;
  ctx.transform(m11, m12, m21, m22, dx, dy);
  // solo la parte de la imagen que cubre la celda
  const mx = Math.min(u0, u1, u2), Mx = Math.max(u0, u1, u2), my = Math.min(v0, v1, v2), My = Math.max(v0, v1, v2);
  const pad = 2, W = img.width, Hh = img.height;
  const qx = clamp(Math.floor(mx - pad), 0, W), qy = clamp(Math.floor(my - pad), 0, Hh);
  const qw = clamp(Math.ceil(Mx + pad), 0, W) - qx, qh = clamp(Math.ceil(My + pad), 0, Hh) - qy;
  if (qw > 0 && qh > 0) ctx.drawImage(img, qx, qy, qw, qh, qx, qy, qw, qh);
  ctx.restore();
}

/* ---------- caché de imágenes compuestas (ajustes + máscara) ---------- */
const Comp = {
  cache: new Map(),
  adjKey(e) { const a = e.adj; return a && (a.b || a.c || a.s) ? `${a.b | 0},${a.c | 0},${a.s | 0}` : ''; },
  get(key, make) {
    if (this.cache.has(key)) { const v = this.cache.get(key); this.cache.delete(key); this.cache.set(key, v); return v; }
    const v = make(); this.cache.set(key, v);
    while (this.cache.size > 24) this.cache.delete(this.cache.keys().next().value);
    return v;
  },
  // fuente base con ajustes
  base(a, preview, adjKey, adj) {
    const src = preview ? a.preview : a.full;
    if (!adjKey) return src;
    return this.get(`b|${a.id}|${preview ? 'p' : 'f'}|${adjKey}`, () => applyAdjust(src, adj));
  },
  // fuente final para dibujar un elemento imagen
  src(e, a, preview, liveMask) {
    const ak = this.adjKey(e);
    const base = this.base(a, preview, ak, e.adj);
    const mask = liveMask || (e.maskId && S.assets.get(e.maskId)?.canvas);
    if (!mask) return base;
    const build = () => {
      const c = document.createElement('canvas'); c.width = base.width; c.height = base.height;
      const x = c.getContext('2d'); x.drawImage(base, 0, 0);
      x.globalCompositeOperation = 'destination-in'; x.imageSmoothingQuality = 'high';
      x.drawImage(mask, 0, 0, c.width, c.height);
      return c;
    };
    if (liveMask) { if (!this._live || this._live.width !== base.width) this._live = document.createElement('canvas'); const c = this._live; c.width = base.width; c.height = base.height; const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height); x.drawImage(base, 0, 0); x.globalCompositeOperation = 'destination-in'; x.drawImage(mask, 0, 0, c.width, c.height); x.globalCompositeOperation = 'source-over'; return c; }
    return this.get(`m|${a.id}|${preview ? 'p' : 'f'}|${ak}|${e.maskId}`, build);
  },
};
function applyAdjust(src, adj) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;

    x.globalCompositeOperation = b.mode === 'hide' ? 'destination-out' : 'source-over';
    x.fillStyle = g; x.beginPath(); x.arc(m.x, m.y, r, 0, Math.PI * 2); x.fill();
    x.globalCompositeOperation = 'source-over';
  },
  paintTo(m) {
    const b = this.brush, step = Math.max(1, b.radius * 0.25);
    const dx = m.x - b.last.x, dy = m.y - b.last.y, dist = Math.hypot(dx, dy);
    for (let t = step; t <= dist; t += step) this.dab({ x: b.last.x + dx * t / dist, y: b.last.y + dy * t / dist });
    if (dist >= step) b.last = m;
    R.request();
  },
  async endBrush() {
    const b = this.brush; if (!b) return;
    const e = elById(b.elId);
    const c = b.canvas;
    if (e) {
      if (canvasIsFull(c)) e.maskId = null;
      else e.maskId = await saveMaskCanvas(c);
      this.brush = null;
      commit(b.mode === 'hide' ? 'Pincel: ocultar' : 'Pincel: restaurar');
      UI.props();
    } else this.brush = null;
    R.request();
  },

  /* ---- acciones con la selección ---- */
  selectAll() { const e = this.target(); if (!e) return; const s = this.ensure(e); const x = s.canvas.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, s.w, s.h); this.refresh(); },
  invert() {
    const e = this.target(); if (!e) return;
    const s = this.ensure(e), x = s.canvas.getContext('2d');
    const inv = newCanvas(s.w, s.h), ix = inv.getContext('2d'); ix.fillStyle = '#fff'; ix.fillRect(0, 0, s.w, s.h);
    ix.globalCompositeOperation = 'destination-out'; ix.drawImage(s.canvas, 0, 0);
    x.clearRect(0, 0, s.w, s.h); x.drawImage(inv, 0, 0); this.refresh();
  },
  async applyToMask(op, label) {
    const s = this.sel, e = s && elById(s.elId); if (!e) return;
    const m = currentMaskCanvas(e), x = m.getContext('2d');
    x.globalCompositeOperation = op === 'hide' ? 'destination-out' : 'destination-in';
    x.drawImage(s.canvas, 0, 0, m.width, m.height);
    x.globalCompositeOperation = 'source-over';
    if (!alphaBBox(m)) { toast('Eso ocultaría toda la imagen. Invierte la selección o elige otra zona.', 'warn', 4000); return false; }
    e.maskId = canvasIsFull(m) ? null : await saveMaskCanvas(m);
    commit(label);
    return true;
  },
  async hideSel() { if (await this.applyToMask('hide', 'Ocultar selección')) { this.clear(); UI.selChanged(); } },
  async keepSel() { if (await this.applyToMask('keep', 'Dejar solo la selección')) { this.clear(); UI.selChanged(); } },
  async cropToSel() {
    const s = this.sel, e = s && elById(s.elId); if (!e) return;
    const bb = alphaBBox(s.canvas); if (!bb) return;
    const a = S.assets.get(e.assetId), f = a.w / s.w;
    const m = currentMaskCanvas(e), x = m.getContext('2d');
    x.globalCompositeOperation = 'destination-in'; x.drawImage(s.canvas, 0, 0, m.width, m.height); x.globalCompositeOperation = 'source-over';
    e.maskId = canvasIsFull(m) ? null : await saveMaskCanvas(m);
    const nc = { x: Math.max(0, bb.x * f), y: Math.max(0, bb.y * f), w: Math.min(a.w, bb.w * f), h: Math.min(a.h, bb.h * f) };
    // aplicar recorte conservando escala y posición (sin registrar historial dos veces)
    const oc = e.crop || { x: 0, y: 0, w: a.w, h: a.h };
    const cl = { x: Math.max(nc.x, oc.x), y: Math.max(nc.y, oc.y) };
    cl.w = Math.min(nc.x + nc.w, oc.x + oc.w) - cl.x; cl.h = Math.min(nc.y + nc.h, oc.y + oc.h) - cl.y;
    this.clear(true);
    if (hasPersp(e)) { commit('Recortar a la selección'); UI.selChanged(); toast('Con perspectiva aplicada solo se ocultó el exterior; el encuadre se conserva.', '', 4000); return; }
    A.applyCrop(e, { x: round(cl.x, 2), y: round(cl.y, 2), w: round(cl.w, 2), h: round(cl.h, 2) }, 'Recortar a la selección');
  },
  async extractSel() {
    const s = this.sel, e = s && elById(s.elId); if (!e) return;
    const bb = alphaBBox(s.canvas); if (!bb) return;
    const a = S.assets.get(e.assetId), f = a.w / s.w;
    const fx = Math.floor(bb.x * f), fy = Math.floor(bb.y * f), fw = Math.ceil(bb.w * f), fh = Math.ceil(bb.h * f);
    const out = newCanvas(fw, fh), x = out.getContext('2d');
    x.drawImage(Comp.src(e, a, false), fx, fy, fw, fh, 0, 0, fw, fh);
    x.globalCompositeOperation = 'destination-in'; x.imageSmoothingQuality = 'high';
    x.drawImage(s.canvas, bb.x, bb.y, bb.w, bb.h, 0, 0, fw, fh);
    const blob = await canvasBlob(out, 'image/png');
    const na = await addImageBlob(blob, (e.name || 'imagen') + ' recorte.png');
    const cr = e.crop || { x: 0, y: 0, w: a.w, h: a.h };
    const sx = e.w / cr.w, sy = e.h / cr.h;
    const c = srcToWorld(e, fx + fw / 2, fy + fh / 2);
    const ne = normalizeEl({ type: 'image', name: (e.name || 'Imagen') + ' (extracto)', assetId: na.id, crop: { x: 0, y: 0, w: na.w, h: na.h }, w: fw * sx, h: fh * sy, rot: e.rot, flipH: e.flipH, flipV: e.flipV, lockRatio: true });
    ne.x = c.x - ne.w / 2; ne.y = c.y - ne.h / 2;
    const l = lam(); l.elements.splice(l.elements.indexOf(e) + 1, 0, ne);
    this.clear(true);
    S.sel = [ne.id];
    commit('Extraer selección como imagen'); UI.selChanged();
    toast('Se creó una imagen nueva con la selección (PNG transparente).');
  },
  async resetMask(e) { e.maskId = null; commit('Quitar máscara'); UI.selChanged(); },
  async invertMask(e) {
    const m = currentMaskCanvas(e);
    const inv = newCanvas(m.width, m.height), x = inv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, m.width, m.height);
    x.globalCompositeOperation = 'destination-out'; x.drawImage(m, 0, 0);
    if (!alphaBBox(inv)) { toast('La máscara invertida ocultaría toda la imagen.', 'warn'); return; }
    e.maskId = canvasIsFull(inv) ? null : await saveMaskCanvas(inv);
    commit('Invertir máscara'); UI.selChanged();
  },
  async exportPNG(e) {
    const a = S.assets.get(e.assetId); if (!a) return;
    const cr = e.crop || { x: 0, y: 0, w: a.w, h: a.h };
    const W = Math.round(cr.w), Hh = Math.round(cr.h);
    if (W * Hh > MAX_PIXELS) { toast('La imagen es demasiado grande para exportarla así.', 'error'); return; }
    const c = newCanvas(W, Hh), x = c.getContext('2d');
    x.translate(W / 2, Hh / 2); x.scale(e.flipH ? -1 : 1, e.flipV ? -1 : 1);
    const fake = { ...e, w: W, h: Hh, persp: null };
    drawSrcOnEl(x, fake, a, Comp.src(e, a, false), 1);
    const blob = await canvasBlob(c, 'image/png');
    downloadBlob(blob, (e.name || 'imagen').replace(/[\\/:*?"<>|]+/g, '_') + '.png');
    toast(`PNG transparente exportado · ${W} × ${Hh} px · ${fmtBytes(blob.size)}`);
  },
};

/* ======================= cuentagotas ======================= */
const Eyedrop = {
  sample(p) {
    // muestrear el render de la lámina sin la capa de interfaz
    const l = lam(), k = 4; // 4 px/mm alrededor del punto
    const c = newCanvas(3, 3), x = c.getContext('2d', { willReadFrequently: true });
    x.setTransform(k, 0, 0, k, -p.x * k + 1.5, -p.y * k + 1.5);
    if (l.bg) { x.fillStyle = l.bg; x.fillRect(0, 0, l.w, l.h); } else { x.fillStyle = '#fff'; x.fillRect(0, 0, l.w, l.h); }
    renderElements(x, l, k, { preview: true, info: tokenInfo(l), noZones: true });
    const d = x.getImageData(1, 1, 1, 1).data;
    return rgbToHex(d[0], d[1], d[2]);
  },
  pick(p, ev) {
    const hex = this.sample(p);
    Colors.addRecent(hex); Colors.current = hex;
    const sel = selEls();
    let applied = false;
    for (const e of sel) {
      if (isLk(e)) continue;
      if (e.type === 'text') { e.color = hex; applied = true; }
      else if (e.type === 'line') { e.stroke = hex; applied = true; }
      else if (e.type === 'rect' || e.type === 'ellipse') { if (ev.altKey) e.stroke = hex; else e.fill = hex; applied = true; }
    }
    if (applied) { commit('Aplicar color'); UI.props(); }
    navigator.clipboard?.writeText(hex).catch(() => { });
    toast(applied ? `Color ${hex} aplicado y copiado` : `Color ${hex} copiado al portapapeles`, '', 1800);
    UI.colorsTab();
  },
};
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join(''); }
function hexToRgb(h) { h = (h || '#000').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255; const M = Math.max(r, g, b), m = Math.min(r, g, b); let h = 0, s = 0; const l = (M + m) / 2;
  if (M !== m) { const d = M - m; s = l > .5 ? d / (2 - M - m) : d / (M + m); h = M === r ? (g - b) / d + (g < b ? 6 : 0) : M === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
}

/* ======================= colores: recientes y paletas ======================= */
const Colors = {
  current: '#2f6fde',
  recent() { try { return JSON.parse(localStorage.getItem('el-recent-colors') || '[]'); } catch { return []; } },
  addRecent(hex) {
    hex = hex.toLowerCase(); const r = this.recent().filter(c => c !== hex); r.unshift(hex);
    try { localStorage.setItem('el-recent-colors', JSON.stringify(r.slice(0, 18))); } catch { }
  },
  palettes() { return S.project.palettes || (S.project.palettes = []); },
  quick() { const out = []; for (const c of [...this.palettes().flatMap(p => p.colors), ...this.recent()]) if (!out.includes(c)) out.push(c); return out.slice(0, 16); },
};

    this.log.push({ t: new Date(), module, prop, oldV, newV, op });
  },
  reset() { this.log = []; },
  fmt(v) { if (v === true) return 'sí'; if (v === false) return 'no'; if (v == null || v === '') return '—'; return String(v); },
  stamp(d) { return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); },
};

/* ---------- color de acento ---------- */
const ACCENTS = ['#2f6fde', '#0f8b8d', '#2b9348', '#7b4fd6', '#d1495b', '#e07a1f', '#b08900', '#3d4a5c'];
function contrastInk(hex) {
  const [r, g, b] = hexToRgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
  const L = .2126 * r + .7152 * g + .0722 * b;
  return L > 0.42 ? '#111820' : '#ffffff';
}
function applyAccent(hex) {
  const root = document.documentElement.style;
  if (!hex) { root.removeProperty('--accent'); root.removeProperty('--accent-ink'); }
  else { root.setProperty('--accent', hex); root.setProperty('--accent-ink', contrastInk(hex)); }
  Pix.sel && Pix.refresh();
  R.request();
}
function getPref(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } }
function setPref(k, v) { try { localStorage.setItem(k, v); } catch { } }

/* ---------- versiones terminadas y comparador ---------- */
const VERSION_PX = 2400; // lado mayor de la imagen guardada por versión
const Versions = {
  async mark(l = lam()) {
    if (S.editingText) finishTextEdit();
    const name = await UI.prompt('Nombre de la versión', `Versión ${(l.versions || []).length + 1}`);
    if (name == null) return;
    await document.fonts.ready;
    const s = VERSION_PX / Math.max(l.w, l.h);
    const cv = renderLamina(l, s, { forceBg: '#ffffff' });
    const blob = await canvasBlob(cv, 'image/jpeg', 0.9);
    const a = await addImageBlob(blob, 'version.jpg');
    a.kind = 'version';
    l.versions = l.versions || [];
    l.versions.push({ id: uid('v'), name: name.trim() || 'Versión', date: new Date().toISOString(), assetId: a.id });
    commit('Guardar versión');
    UI.props();
    toast('Versión guardada. Ahora puedes compararla con lo que sigas haciendo.');
  },
  async remove(l, id) {
    const v = (l.versions || []).find(x => x.id === id); if (!v) return;
    if (!(await UI.confirm(`¿Eliminar “${v.name}”?`, 'Puedes recuperarla con Deshacer mientras el proyecto esté abierto.', 'Eliminar', true))) return;
    l.versions = l.versions.filter(x => x.id !== id);
    commit('Eliminar versión'); UI.props();
  },
  async rename(l, id) {
    const v = l.versions.find(x => x.id === id);
    const n = await UI.prompt('Nombre de la versión', v.name);
    if (n && n.trim()) { v.name = n.trim(); commit('Renombrar versión'); UI.props(); }
  },
  fmtDate(iso) { const d = new Date(iso); return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); },
  async compare(l = lam(), vid) {
    const vs = l.versions || [];
    if (!vs.length) { toast('Esta lámina aún no tiene versiones guardadas. Usa “Guardar versión”.', 'warn', 4000); return; }
    await document.fonts.ready;
    const s = VERSION_PX / Math.max(l.w, l.h);
    const curCv = renderLamina(l, s, { forceBg: '#ffffff' });
    const curUrl = curCv.toDataURL('image/jpeg', 0.9);
    curCv.width = curCv.height = 1;
    const srcOf = id => { if (id === 'cur') return curUrl; const v = vs.find(x => x.id === id); const a = v && S.assets.get(v.assetId); if (!a) return ''; if (!a._url) a._url = URL.createObjectURL(a.blob); return a._url; };
    const opts = [['cur', 'Lámina actual (en edición)'], ...vs.map(v => [v.id, `${v.name} · ${Versions.fmtDate(v.date)}`])];
    const left0 = vid || vs[vs.length - 1].id;
    const ratio = l.h / l.w;
    const W = Math.min(innerWidth * 0.94 - 60, (innerHeight * 0.64) / ratio, 1300);
    await UI.dialog({
      title: `Comparar versiones · ${l.name}`, wide: Math.max(640, W + 40),
      body: `<div class="row" style="gap:8px;flex-wrap:wrap">
          <select id="cmpA" style="flex:1;min-width:180px">${opts.map(([v, n]) => `<option value="${v}" ${v === left0 ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
          <span class="hint">contra</span>
          <select id="cmpB" style="flex:1;min-width:180px">${opts.map(([v, n]) => `<option value="${v}" ${v === 'cur' ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>

/* ---------- proporción de la lámina ---------- */
const RATIOS = [['1:1', 1], ['4:3', 4 / 3], ['3:2', 3 / 2], ['16:9', 16 / 9], ['2:1', 2], ['Hoja A (√2)', Math.SQRT2]];
function setLaminaRatio(l, r, keep = 'w') {
  const land = l.w >= l.h;
  const R_ = land ? r : 1 / r;
  if (keep === 'w') l.h = round(l.w / R_, 2); else l.w = round(l.h * R_, 2);
}
function fitLaminaToImage(e) {
  const l = lam();
  const b = elAABB(e);
  const dx = -b.x, dy = -b.y;
  l.w = round(b.w, 2); l.h = round(b.h, 2);
  for (const o of l.elements) { o.x += dx; o.y += dy; }
  l.guides.v = l.guides.v.map(v => v + dx); l.guides.h = l.guides.h.map(v => v + dy);
  commit('Ajustar lámina a imagen'); zoomFit(); UI.all();
}

/* ---------- bloqueo ---------- */
function isLk(e) { return !!(e && (e.locked || (lam() && lam().locked))); }
function guardLam(l = lam()) {
  if (l && l.locked) { toast(`“${l.name}” está bloqueada. Desbloquéala para editarla (clic derecho en la lámina).`, 'warn', 3200); return false; }
  return true;
}
// red de seguridad: si algo cambió una lámina bloqueada, se revierte
function lockViolation(prevSnap) {
  if (!S.project.laminas.some(l => l.locked)) return null;
  let prev; try { prev = JSON.parse(prevSnap).laminas; } catch { return null; }
  for (const l of S.project.laminas) {
    if (!l.locked) continue;
    const p = prev.find(x => x.id === l.id);
    if (!p || !p.locked) continue;
    if (JSON.stringify([p.elements, p.w, p.h, p.bg, p.margin]) !== JSON.stringify([l.elements, l.w, l.h, l.bg, l.margin])) return l;
  }
  return null;
}
A.toggleLamLock = function (id = S.curId) {
  const l = S.project.laminas.find(x => x.id === id); if (!l) return;
  l.locked = !l.locked;
  if (l.locked && l.id === S.curId) { S.sel = []; Pix.clear(true); I.perspEdit = null; if (S.editingText) finishTextEdit(); }
  commit(l.locked ? 'Bloquear lámina' : 'Desbloquear lámina');
  UI.all(); updateLockBanner();
  toast(l.locked ? `“${l.name}” bloqueada: no se puede modificar hasta que la desbloquees.` : `“${l.name}” desbloqueada.`, '', 2600);
};
A.toggleLamDone = function (id = S.curId) {
  const l = S.project.laminas.find(x => x.id === id); if (!l) return;
  l.done = !l.done;
  commit(l.done ? 'Marcar lámina terminada' : 'Marcar lámina pendiente');
  UI.laminas(); UI.props();
  const nd = S.project.laminas.filter(x => x.done).length;
  toast(l.done ? `“${l.name}” terminada · ${nd} de ${S.project.laminas.length}` : `“${l.name}” vuelve a pendiente`, '', 2400);
};
function updateLockBanner() {
  const b = $('#lockBanner'); if (!b) return;
  const l = lam(); b.hidden = !l || !l.locked || S.closed;
}

/* ---------- presentación ---------- */
const Present = {
  on: false, list: [], i: 0, cache: new Map(), onlyDone: false, idleT: 0,
  start(fromCurrent) {
    if (S.closed) return;
    if (S.editingText) finishTextEdit();
    this.onlyDone = getPref('el-present-done', '0') === '1';
    this.build();
    if (!this.list.length) { this.onlyDone = false; this.build(); }
    this.i = fromCurrent ? Math.max(0, this.list.indexOf(lam())) : 0;
    this.on = true; this.cache.clear();
    const el = $('#present'); el.hidden = false;
    $('.pr-done', el).checked = this.onlyDone;
    el.requestFullscreen?.().catch(() => { });
    this.draw(); this.poke();
  },
  build() { this.list = S.project.laminas.filter(l => !this.onlyDone || l.done); },
  stop() {
    if (!this.on) return;
    this.on = false; $('#present').hidden = true; $('.pr-grid').hidden = true;
    if (document.fullscreenElement === $('#present')) document.exitFullscreen?.().catch(() => { });
    const l = this.list[this.i]; if (l && l.id !== S.curId) A.setLamina(l.id);
    this.cache.clear();
  },
  go(i) { this.i = clamp(i, 0, this.list.length - 1); this.draw(); },
  async draw() {
    const el = $('#present'), cv = $('canvas', el), l = this.list[this.i]; if (!l) return;
    const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const s = Math.min(W / l.w, H / l.h) * dpr;
    const key = `${l.id}|${cv.width}|${cv.height}|${S.histIdx}`;
    let img = this.cache.get(key);
    if (!img) { await document.fonts.ready; img = renderLamina(l, s, { forceBg: '#ffffff' }); this.cache.set(key, img); if (this.cache.size > 6) this.cache.delete(this.cache.keys().next().value); }
    if (this.list[this.i] !== l) return;
    const x = cv.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, cv.width, cv.height);
    x.drawImage(img, Math.round((cv.width - img.width) / 2), Math.round((cv.height - img.height) / 2));
    $('.pr-info', el).innerHTML = `<b>${this.i + 1}</b> / ${this.list.length} · ${esc(l.name)}${l.done ? ' <span class="pr-ok">✓ terminada</span>' : ''}`;
    // precargar la siguiente
    const nx = this.list[this.i + 1];
    if (nx) setTimeout(() => { if (!this.on) return; const k2 = `${nx.id}|${cv.width}|${cv.height}|${S.histIdx}`; if (!this.cache.has(k2)) this.cache.set(k2, renderLamina(nx, Math.min(W / nx.w, H / nx.h) * dpr, { forceBg: '#ffffff' })); }, 60);
  },
  poke() {
    const el = $('#present'); el.classList.add('show-ui');
    clearTimeout(this.idleT); this.idleT = setTimeout(() => el.classList.remove('show-ui'), 2200);
  },
  grid() {
    const g = $('.pr-grid'); g.hidden = !g.hidden;
    if (!g.hidden) {
      g.innerHTML = this.list.map((l, i) => { const c = newCanvas(1, 1); renderThumb(l, c); return `<button type="button" data-i="${i}" class="${i === this.i ? 'on' : ''}"><img src="${c.toDataURL()}" alt=""><span>${i + 1}. ${esc(l.name)}</span></button>`; }).join('');
    }
  },
  key(ev) {
    const k = ev.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'n'].includes(k)) { ev.preventDefault(); this.go(this.i + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p'].includes(k)) { ev.preventDefault(); this.go(this.i - 1); }
    else if (k === 'Home') { ev.preventDefault(); this.go(0); }
    else if (k === 'End') { ev.preventDefault(); this.go(this.list.length - 1); }
    else if (k === 'Escape') { ev.preventDefault(); if (!$('.pr-grid').hidden) $('.pr-grid').hidden = true; else this.stop(); }
    else if (k === 'g' || k === 'G') { ev.preventDefault(); this.grid(); }
    else if (k === 'F5') ev.preventDefault();
    this.poke();
  },
  init() {
    const el = $('#present');
    el.addEventListener('pointermove', () => this.poke());
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-p]'), gi = e.target.closest('.pr-grid [data-i]');
      if (gi) { this.go(+gi.dataset.i); $('.pr-grid').hidden = true; return; }
      if (b) { const a = b.dataset.p; if (a === 'prev') this.go(this.i - 1); if (a === 'next') this.go(this.i + 1); if (a === 'exit') this.stop(); if (a === 'grid') this.grid(); return; }
      if (e.target.closest('.pr-bar') || e.target.closest('.pr-grid')) return;
      this.go(e.clientX < innerWidth * 0.25 ? this.i - 1 : this.i + 1);
    });
    $('.pr-done', el).addEventListener('change', e => {
      const cur = this.list[this.i]; this.onlyDone = e.target.checked; setPref('el-present-done', this.onlyDone ? '1' : '0'); this.build();
      if (!this.list.length) { toast('No hay láminas terminadas.', 'warn'); this.onlyDone = false; e.target.checked = false; this.build(); }
      this.i = Math.max(0, this.list.indexOf(cur)); this.draw();
    });
    document.addEventListener('fullscreenchange', () => { if (this.on && !document.fullscreenElement) this.stop(); updateFsButton(); });
    window.addEventListener('resize', () => { if (this.on) this.draw(); });
  },
};

/* ---------- menú contextual propio en toda la aplicación ---------- */
function textMenuItems(t) {
  const isNum = t.type === 'number' || t.type === 'color' || t.type === 'range';
  let sel = '';
  try { sel = isNum ? '' : t.value.slice(t.selectionStart, t.selectionEnd); } catch { }
  const ro = t.readOnly || t.disabled;
  const fire = () => { t.dispatchEvent(new Event('input', { bubbles: true })); t.dispatchEvent(new Event('change', { bubbles: true })); };
  const insert = txt => {
    if (isNum) { t.value = txt.trim(); fire(); return; }
    t.focus();
    try { t.setRangeText(txt, t.selectionStart, t.selectionEnd, 'end'); } catch { t.value += txt; }
    t.dispatchEvent(new Event('input', { bubbles: true }));
  };
  return [
    ['Cortar', () => { t.focus(); document.execCommand('cut'); }, 'Ctrl+X', !sel || ro || isNum],
    ['Copiar', () => { if (isNum) navigator.clipboard?.writeText(t.value); else { t.focus(); document.execCommand('copy'); } }, 'Ctrl+C', !isNum && !sel],
    ['Pegar', async () => { try { const tx = await navigator.clipboard.readText(); insert(tx); } catch { toast('El navegador no permitió leer el portapapeles. Usa Ctrl+V.', 'warn'); } }, 'Ctrl+V', ro],
    '-',
    ['Seleccionar todo', () => { t.focus(); t.select?.(); }, 'Ctrl+A', isNum && t.type !== 'number'],
    ['Borrar', () => { t.value = ''; fire(); }, '', ro],
  ];
}

/* =====================================================================
   Archivo: nuevo, abrir, guardar, guardar como, cerrar, recientes.
   Formatos de proyecto (abiertos y documentados):
   · .laminas.json → un solo JSON; imágenes y fuentes en base64 dentro.
   · .laminas.zip  → ZIP estándar: proyecto.json + carpeta recursos/ con los
                      archivos originales + LEEME.txt con la estructura.
   ===================================================================== */

const MIME_EXT = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif', 'image/bmp': 'bmp', 'image/svg+xml': 'svg', 'font/ttf': 'ttf', 'font/otf': 'otf', 'font/woff': 'woff', 'font/woff2': 'woff2', 'application/x-font-ttf': 'ttf', 'application/font-sfnt': 'ttf' };
const EXT_MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', bmp: 'image/bmp', ttf: 'font/ttf', otf: 'font/otf', woff: 'font/woff', woff2: 'font/woff2' };
const PROJECT_TYPES = {
  json: { description: 'Proyecto de Editor de Láminas (.laminas.json)', accept: { 'application/json': ['.json'] } },
  zip: { description: 'Paquete de Editor de Láminas (.laminas.zip)', accept: { 'application/zip': ['.zip'] } },
};
const LEEME = `EDITOR DE LÁMINAS — FORMATO DE PAQUETE (.laminas.zip)
=====================================================
Este archivo es un ZIP normal. Puedes abrirlo con cualquier descompresor.

proyecto.json   Todo el proyecto en JSON legible:
                · project.laminas[]   cada lámina: tamaño en mm (w, h), fondo,
                  márgenes, guías, estado (locked, done), versiones y elements[].
                · elements[]          type = image | text | rect | ellipse | line | zone
                  posición y tamaño en milímetros (x, y, w, h), rotación en
                  grados (rot), opacidad 0–1, y propiedades de cada tipo.
                  Las imágenes guardan assetId (recurso), crop en píxeles del
                  original, maskId (máscara), adj (ajustes) y persp (esquinas).
                · assets{}            un registro por recurso con su archivo.
recursos/       Las imágenes originales sin modificar, las máscaras (PNG en
                escala de alfa), las fotos de versiones y las fuentes importadas.

Nada se recomprime ni se cifra: tus imágenes salen tal como las insertaste.
`;

const IO = {
  _replaceTarget: null,
  pickImages() { if (!guardLam()) return; $('#fileImages').click(); },
  pickReplace(el) { if (isLk(el)) { toast('La lámina o la imagen está bloqueada.', 'warn'); return; } IO._replaceTarget = el; $('#fileReplace').click(); },

  async askDiscard(action) {

      body: `<p style="margin:4px 0">Antes de ${action}, ¿quieres guardar “${esc(S.project.name)}”${S.fileName ? ` en <b>${esc(S.fileName)}</b>` : ''}?</p><p class="hint">Si descartas, una copia queda en Recientes (en este navegador) por si la necesitas.</p>`,
      buttons: [{ label: 'Cancelar', value: null }, { label: 'No guardar', value: 'discard', cls: 'danger' }, { label: 'Guardar', value: 'save', cls: 'primary' }],
    });

  },
  async beforeSwitch() { try { await Recents.saveCurrent(); } catch (err) { console.warn(err); } },

  async newProject(preset) {
    if (!(await IO.askDiscard('crear un proyecto nuevo'))) return;
    let o = preset;
    if (!o) {
      const r = await UI.dialog({
        title: 'Proyecto nuevo',
        body: `<div class="row"><label class="lbl">Nombre</label><input type="text" id="npN" value="Proyecto sin nombre"></div>
          <div class="row"><label class="lbl">Tamaño de hoja</label><select id="npS">${SHEETS.map(s => `<option value="${s.id}" ${s.id === 'a3' ? 'selected' : ''}>${s.name} (${s.w} × ${s.h} mm)</option>`).join('')}</select></div>
          <div class="row"><label class="lbl">Orientación</label><select id="npO"><option value="h">Horizontal</option><option value="v">Vertical</option></select></div>
          <div class="row"><label class="lbl">Láminas</label><input type="number" id="npC" value="1" min="1" max="60" step="1"></div>
          <label class="row" style="gap:6px;cursor:pointer"><input type="checkbox" id="npK"> Insertar el cajetín predeterminado en cada lámina</label>`,
        buttons: [{ label: 'Cancelar', value: null }, { label: 'Crear', value: true, cls: 'primary' }],
        validate: f => { o = { name: $('#npN', f).value.trim() || 'Proyecto sin nombre', sheet: $('#npS', f).value, orient: $('#npO', f).value, count: clamp(+$('#npC', f).value || 1, 1, 60), caj: $('#npK', f).checked }; },
      });
      if (!r) return;
    }
    await IO.beforeSwitch();
    const s = SHEETS.find(x => x.id === o.sheet) || SHEETS[4];
    const w = o.orient === 'h' ? Math.max(s.w, s.h) : Math.min(s.w, s.h), h = o.orient === 'h' ? Math.min(s.w, s.h) : Math.max(s.w, s.h);
    const p = newProject(o.name || 'Proyecto sin nombre');
    p.settings.defaultSheet = { w, h };
    p.laminas = Array.from({ length: o.count || 1 }, (_, i) => newLamina(i + 1, w, h));
    S.assets = new Map();
    await Store.resetAssets();
    IO.load(p, null);
    if (o.caj) { for (const l of S.project.laminas) l.elements.push(...Caj.build(l)); histReset('Proyecto nuevo'); UI.all(); }

  load(project, fileName, handle = null) {
    S.project = normalizeProject(project);
    S.curId = S.project.laminas[0].id;
    S.sel = []; S.fileName = fileName; S.fileHandle = handle; S.dirty = false; S.closed = false;
    TextM.cache.clear();

    histReset(fileName ? 'Abrir proyecto' : 'Proyecto nuevo');
    Home.hide(true);
    zoomFit(); UI.all();
  },

  /* ---------- serializar ---------- */
  usedAssetIds() {
    const used = new Set();
    for (const l of S.project.laminas) { for (const e of l.elements) { if (e.assetId) used.add(e.assetId); if (e.maskId) used.add(e.maskId); } for (const v of l.versions || []) used.add(v.assetId); }
    for (const c of S.project.cajetines) for (const e of c.elements) { if (e.assetId) used.add(e.assetId); if (e.maskId) used.add(e.maskId); }
    for (const f of S.project.fonts) used.add(f.assetId);

  },
  projectCopy() {

  // fmt: 'json' | 'zip' → Blob
  async serialize(fmt = 'json') {

    if (fmt === 'zip') {
      const enc = new TextEncoder(), files = [], assets = {};
      for (const id of used) {

  // lee .json o .zip → { project, assets: Map }
  async parseFile(file) {
    const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    let data, getFile = null;
    if (head[0] === 0x50 && head[1] === 0x4B) {
      const zip = await readZip(await file.arrayBuffer());
      const pj = zip.names().find(n => /(^|\/)proyecto\.json$/i.test(n)) || zip.names().find(n => /\.json$/i.test(n));
      if (!pj) throw new Error('El ZIP no contiene proyecto.json: no es un paquete del Editor de Láminas.');
      data = JSON.parse(new TextDecoder().decode(await zip.get(pj)));
      const root = pj.includes('/') ? pj.slice(0, pj.lastIndexOf('/') + 1) : '';
      getFile = async (path, mime) => new Blob([await zip.get(root + path)], { type: mime });
    } else {
      try { data = JSON.parse(await file.text()); }
      catch { throw new Error('El archivo está dañado o no es un proyecto (.laminas.json / .laminas.zip).'); }
    }
    if (data.format !== APP_FORMAT || !data.project) throw new Error('El archivo no es un proyecto del Editor de Láminas.');
    if ((data.version || 1) > APP_VERSION) toast('Este proyecto se creó con una versión más nueva del editor. Algunas cosas podrían no mostrarse.', 'warn', 5000);
    const assets = new Map(); let failed = 0;
    for (const [id, a] of Object.entries(data.assets || {})) {
      try {
        const mime = a.mime || EXT_MIME[(a.file || a.name || '').split('.').pop().toLowerCase()] || 'application/octet-stream';
        const blob = a.data ? dataURLToBlob(a.data) : await getFile(a.file, mime);
        const rec = { id, kind: a.kind, name: a.name, mime, blob };
        if (a.kind === 'image' || a.kind === 'version') await decodeImageAsset(rec);
        else if (a.kind === 'mask') await decodeMaskAsset(rec);
        else if (a.kind === 'font') await registerFont(rec, a.family || a.name);
        assets.set(id, rec);
      } catch (err) { console.error(err); failed++; }
    }
    return { project: data.project, assets, failed };
  },
  async openFile(file, handle = null, skipAsk = false) {
