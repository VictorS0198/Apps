function downloadBlob(blob, name) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}

/* ---------- lector de ZIP (stored y deflate) ---------- */
async function readZip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('El ZIP está dañado.');
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder(), entries = new Map();
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    entries.set(name, { method, csize, lho });
    p += 46 + nl + xl + cl;
  }
  return {
    names: () => [...entries.keys()],
    async get(name) {
      const e = entries.get(name); if (!e) throw new Error('Falta ' + name + ' dentro del ZIP.');
      const nl = dv.getUint16(e.lho + 26, true), xl = dv.getUint16(e.lho + 28, true);
      const data = u8.subarray(e.lho + 30 + nl + xl, e.lho + 30 + nl + xl + e.csize);
      if (e.method === 0) return data;
      if (e.method === 8) {
        if (!window.DecompressionStream) throw new Error('Este navegador no puede descomprimir el ZIP.');
        return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      }
      throw new Error('Compresión de ZIP no compatible.');
    },
  };
}

const Recents = {
  MAX: 16,
  isEmpty() { const p = S.project; return !p || (p.laminas.every(l => !l.elements.length && !(l.versions || []).length) && !(p.notes || []).length); },

  },
  async saveCurrent() {
    if (!Store.db || S.closed || !S.project || Recents.isEmpty()) return;
    if (!S.project.id) S.project.id = uid('p');
    const data = await IO.serialize('json');
    const rec = {
      id: S.project.id, name: S.project.name, fileName: S.fileName || null, handle: S.fileHandle || null,
      thumb: Recents.thumb(), modified: Date.now(), laminas: S.project.laminas.length,
      done: S.project.laminas.filter(l => l.done).length, size: data.size, data, dirtyCopy: !!S.dirty,
    };
    try { await Store.put('recents', rec.id, rec); }
    catch { delete rec.handle; try { await Store.put('recents', rec.id, rec); } catch (err) { console.warn('Recientes', err); } }
    const all = await Recents.list();
    for (const r of all.slice(Recents.MAX)) await Store.del('recents', r.id);
  },
  async remove(id) { await Store.del('recents', id); },
  async open(rec) {
    if (!(await IO.askDiscard('abrir otro proyecto'))) return;
    let file = null, handle = rec.handle || null;
    if (handle) {
      try {
        let perm = 'granted';
        if (handle.queryPermission) { perm = await handle.queryPermission({ mode: 'readwrite' }); if (perm !== 'granted') perm = await handle.requestPermission({ mode: 'readwrite' }); }
        if (perm === 'granted') file = await handle.getFile(); else handle = null;
      } catch (err) { console.warn(err); handle = null; }
    }
    // abrir lo más reciente: el archivo en disco o la copia del navegador
    const useFile = file && (!rec.data || file.lastModified >= rec.modified - 3000) && !rec.dirtyCopy;
    const src = useFile ? file : new File([rec.data], rec.fileName || (rec.name + '.laminas.json'), { type: 'application/json' });
    const ok = await IO.openFile(src, handle, true);

      if (!useFile && rec.dirtyCopy) { S.dirty = true; toast('Se abrió la copia del navegador, que tenía cambios sin guardar en el archivo.', 'warn', 5000); }
      else if (!useFile && rec.fileName && !handle) toast('Se abrió la copia guardada en este navegador. Guardar te pedirá ubicación.', '', 4000);
      UI.saveState();
    }
  },
};
/* ---------- utilidades binarias ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8, start = 0, end = u8.length) { let c = 0xFFFFFFFF; for (let i = start; i < end; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function deflate(u8) {
  if (!window.CompressionStream) throw new Error('Este navegador no permite comprimir sin pérdida; usa el modo comprimido (JPG)');
  const cs = new CompressionStream('deflate');
  const stream = new Blob([u8]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
// PNG: insertar/actualizar el bloque pHYs con la resolución
function pngSetDpi(png, dpi) {
  const ppm = Math.round(dpi / 0.0254);
  const chunk = new Uint8Array(21); const dv = new DataView(chunk.buffer);
  dv.setUint32(0, 9); chunk.set([0x70, 0x48, 0x59, 0x73], 4); dv.setUint32(8, ppm); dv.setUint32(12, ppm); chunk[16] = 1;
  dv.setUint32(17, crc32(chunk, 4, 17));
  // ubicar fin de IHDR (8 de firma + 25 del bloque) y quitar pHYs previo si existe
  const out = []; let p = 8; out.push(png.subarray(0, 8));
  const pdv = new DataView(png.buffer, png.byteOffset, png.byteLength);
  let inserted = false;
  while (p < png.length) {
    const len = pdv.getUint32(p); const type = String.fromCharCode(png[p + 4], png[p + 5], png[p + 6], png[p + 7]);
    const end = p + 12 + len;
    if (type !== 'pHYs') out.push(png.subarray(p, end));
    if (type === 'IHDR' && !inserted) { out.push(chunk); inserted = true; }
    p = end;
  }
  const total = out.reduce((s, a) => s + a.length, 0); const res = new Uint8Array(total); let o = 0;
  for (const a of out) { res.set(a, o); o += a.length; }
  return res;
}
// JPG: ajustar densidad del encabezado JFIF
function jpgSetDpi(jpg, dpi) {
  if (jpg[0] === 0xFF && jpg[1] === 0xD8 && jpg[2] === 0xFF && jpg[3] === 0xE0 && jpg[6] === 0x4A && jpg[7] === 0x46 && jpg[8] === 0x49 && jpg[9] === 0x46) {
    jpg[13] = 1; jpg[14] = (dpi >> 8) & 255; jpg[15] = dpi & 255; jpg[16] = (dpi >> 8) & 255; jpg[17] = dpi & 255;
  }
  return jpg;
}
// ZIP sin compresión (las imágenes ya vienen comprimidas)
function makeZip(files, mime = 'application/zip') {
  const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.bytes), size = f.bytes.length;
    const lh = new Uint8Array(30 + name.length); const v = new DataView(lh.buffer);
    v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0x0800, true); v.setUint16(8, 0, true);
    v.setUint16(10, dosTime, true); v.setUint16(12, dosDate, true); v.setUint32(14, crc, true); v.setUint32(18, size, true); v.setUint32(22, size, true);
    v.setUint16(26, name.length, true); v.setUint16(28, 0, true); lh.set(name, 30);
    parts.push(lh, f.bytes);
    const ch = new Uint8Array(46 + name.length); const c = new DataView(ch.buffer);
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true); c.setUint32(20, size, true); c.setUint32(24, size, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true); ch.set(name, 46);
    central.push(ch);
    offset += lh.length + size;
  }
  const cdSize = central.reduce((s, a) => s + a.length, 0);
  const end = new Uint8Array(22); const e = new DataView(end.buffer);
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: mime });
}

/* ---------- escritor de PDF mínimo (una imagen por página) ---------- */
class PDFWriter {
  constructor() { this.pages = []; }
  addPage(wmm, hmm, img) { this.pages.push({ w: wmm / 25.4 * 72, h: hmm / 25.4 * 72, img }); }
  build({ title = '' } = {}) {
    const enc = new TextEncoder(); const parts = []; const offsets = []; let pos = 0;
    const push = x => { const u = typeof x === 'string' ? enc.encode(x) : x; parts.push(u); pos += u.length; };
    const obj = (n, body) => { offsets[n] = pos; push(`${n} 0 obj\n`); for (const b of [].concat(body)) push(b); push('\nendobj\n'); };
    push('%PDF-1.4\n'); push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
    const n = this.pages.length;
    // 1 catálogo, 2 páginas, 3 info; luego por página: página, contenido, imagen
    const pageIds = this.pages.map((_, i) => 4 + i * 3);
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Kids [${pageIds.map(id => id + ' 0 R').join(' ')}] /Count ${n} >>`);
    const t = title.replace(/[\\()]/g, '\\$&').replace(/[^\x20-\x7E]/g, c => '\\' + (c.charCodeAt(0) < 256 ? c.charCodeAt(0).toString(8).padStart(3, '0') : '077'));
    obj(3, `<< /Title (${t}) /Producer (Editor de Laminas) /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)}) >>`);
    this.pages.forEach((p, i) => {
      const pid = pageIds[i], cid = pid + 1, iid = pid + 2;
      const W = p.w.toFixed(3), H = p.h.toFixed(3);
      obj(pid, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${iid} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cid} 0 R >>`);
      const content = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
      obj(cid, [`<< /Length ${content.length} >>\nstream\n`, content, '\nendstream']);
      const filter = p.img.kind === 'jpg' ? '/DCTDecode' : '/FlateDecode';
      obj(iid, [`<< /Type /XObject /Subtype /Image /Width ${p.img.w} /Height ${p.img.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter ${filter} /Length ${p.img.bytes.length} >>\nstream\n`, p.img.bytes, '\nendstream']);
    });
    const total = 4 + n * 3;
    const xref = pos;
    let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
    for (let i = 1; i < total; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    push(x);
    push(`trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts, { type: 'application/pdf' });
  }
}

/* =====================================================================
   Exportación: perfiles, exportación rápida y formatos
   PDF · PowerPoint (.pptx) · PNG · JPG · WebP · TIFF · SVG
   Todo se genera en el navegador, sin librerías externas.
   ===================================================================== */
const MAX_PIXELS = 160e6;
const EXPORT_FORMATS = [['pdf', 'PDF'], ['pptx', 'PowerPoint'], ['png', 'PNG'], ['jpg', 'JPG'], ['webp', 'WebP'], ['tiff', 'TIFF'], ['svg', 'SVG']];
const FMT_INFO = {
  pdf: 'Un PDF con una página por lámina, cada una de su tamaño real.',
  pptx: 'Una presentación de PowerPoint con una diapositiva por lámina.',
  png: 'Imagen sin pérdida, admite transparencia.',
  jpg: 'Imagen ligera para compartir o imprimir; sin transparencia.',
  webp: 'Imagen muy ligera para web.',
  tiff: 'Imagen sin compresión para imprenta o plotter; guarda los ppp.',
  svg: 'Archivo vectorial: textos y formas editables en Illustrator, Inkscape o el navegador; las imágenes van incrustadas.',
};
const EXPORT_DEFAULTS = { target: 'laminas', fmt: 'pdf', which: 'all', range: '', zwhich: 'all', dpi: 200, q: 90, pdfMode: 'jpg', transparent: false, onlyDone: false, pptxMode: 'image' };
const PROFILE_KEYS = Object.keys(EXPORT_DEFAULTS);

function parseRange(str, n) {
  const out = new Set();
  for (const part of String(str).split(',')) {
    const m = part.trim().match(/^(\d+)\s*(?:-\s*(\d+))?$/);
    if (!m) continue;
    const a = +m[1], b = m[2] ? +m[2] : a;
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) if (i >= 1 && i <= n) out.add(i - 1);
  }
  return [...out].sort((a, b) => a - b);
}

/* ---------- perfiles de exportación (en este navegador, para todos los proyectos) ---------- */
const Profiles = {
  KEY: 'el-export-profiles',
  seed() {
    return [
      { id: 'pf-imp', name: 'Impresión · PDF 300 ppp', opts: { fmt: 'pdf', dpi: 300, q: 92, pdfMode: 'jpg' } },
      { id: 'pf-rev', name: 'Revisión · PDF ligero 150 ppp', opts: { fmt: 'pdf', dpi: 150, q: 78, pdfMode: 'jpg' } },
      { id: 'pf-ppt', name: 'Presentación · PowerPoint', opts: { fmt: 'pptx', dpi: 200, q: 88, pptxMode: 'image' } },
      { id: 'pf-web', name: 'Compartir · JPG 120 ppp', opts: { fmt: 'jpg', dpi: 120, q: 85 } },
    ].map(p => ({ ...p, opts: { ...EXPORT_DEFAULTS, ...p.opts } }));
  },
  list() {
    try { const v = localStorage.getItem(this.KEY); if (v) return JSON.parse(v); } catch { }
    const s = this.seed(); this.save(s); return s;
  },
  save(list) { try { localStorage.setItem(this.KEY, JSON.stringify(list)); } catch { toast('No se pudieron guardar los perfiles en este navegador.', 'warn'); } },
  get(id) { return this.list().find(p => p.id === id) || null; },
  upsert(p) { const l = this.list(); const i = l.findIndex(x => x.id === p.id); if (i >= 0) l[i] = p; else l.push(p); this.save(l); },
  remove(id) { this.save(this.list().filter(p => p.id !== id)); },
  current() { return S.project.exportProfile ? this.get(S.project.exportProfile) : null; },
  setCurrent(id) { if (S.project.exportProfile !== id) { S.project.exportProfile = id || null; Store.schedule(); } },
  same(a, b) { return PROFILE_KEYS.every(k => String(a[k] ?? '') === String(b[k] ?? '')); },
  describe(o) {
    const f = (EXPORT_FORMATS.find(x => x[0] === o.fmt) || [, o.fmt])[1];
    const what = o.target === 'zones' ? 'zonas' : o.target === 'sel' ? 'selección' : o.which === 'all' ? (o.onlyDone ? 'láminas terminadas' : 'todas las láminas') : o.which === 'cur' ? 'lámina actual' : 'láminas ' + o.range;
    return `${f} · ${o.dpi} ppp · ${what}${o.fmt === 'pptx' ? (o.pptxMode === 'editable' ? ' · editable' : ' · imagen') : ''}`;
  },
};

/* ---------- qué se exporta ---------- */
function exportItems(o, ctx = {}) {
  const ls = S.project.laminas, cur = lamIndex();
  if (o.target === 'sel') {
    const s = selEls().filter(e => e.visible);
    return s.length ? [{ l: lam(), region: unionBox(s.map(elAABB)), name: 'seleccion', label: 'Selección en ' + lam().name }] : [];
  }
  if (o.target === 'zones') {
    let zs = ls.flatMap(l => l.elements.filter(e => e.type === 'zone').map(z => ({ l, z })));
    if (o.zwhich === 'cur') zs = zs.filter(x => x.l === lam());
    else if (o.zwhich === 'one' && ctx.zoneId) zs = zs.filter(x => x.z.id === ctx.zoneId);
    return zs.map(({ l, z }) => ({ l, region: elAABB(z), name: z.name || 'zona', label: `${z.name} · ${l.name}` }));
  }
  let ii = o.which === 'all' ? ls.map((_, i) => i) : o.which === 'cur' ? [cur] : parseRange(o.range, ls.length);
  if (o.onlyDone && o.which !== 'cur') ii = ii.filter(i => ls[i].done);
  return ii.map(i => ({ l: ls[i], region: null, name: `${String(i + 1).padStart(String(ls.length).length, '0')}_${ls[i].name}`, label: `${i + 1}. ${ls[i].name}${ls[i].done ? ' ✓' : ''}` }));
}
const itemPx = (it, dpi) => { const b = it.region || it.l; return [Math.max(1, Math.round(b.w / 25.4 * dpi)), Math.max(1, Math.round(b.h / 25.4 * dpi))]; };

        $('#exPdfRow', f).style.display = o.fmt === 'pdf' ? '' : 'none';

/* ---------- exportación rápida con perfil ---------- */
UI.quickExport = async function (profileId) {
  if (S.closed) return;
  if (S.editingText) finishTextEdit();
  const p = profileId ? Profiles.get(profileId) : Profiles.current();
  if (!p) { toast('Este proyecto aún no tiene perfil de exportación. Elige o crea uno.', '', 3200); return UI.exportDialog(); }
  const o = { ...EXPORT_DEFAULTS, ...p.opts };
  const its = exportItems(o);
  if (!its.length) { toast(`El perfil “${p.name}” no encontró nada que exportar (${o.onlyDone ? 'no hay láminas terminadas' : o.target === 'zones' ? 'no hay zonas' : 'revisa el rango'}).`, 'warn', 5000); return; }
  Profiles.setCurrent(p.id);
  const pt = progressToast(`Exportando con “${p.name}”…`);
  try { await runExport(o, its, t => pt.set(`${p.name}: ${t}`)); }
  catch (err) { console.error(err); toast('La exportación falló: ' + (err.message || err), 'error', 7000); }
  finally { pt.done(); }
};

function progressToast(text) {

  $('#toasts').appendChild(t);

/* ---------- utilidades ---------- */
function canvasBlob(cv, type, q) {
  return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('El navegador no pudo generar la imagen (demasiado grande)')), type, q));
}
const tick = () => new Promise(r => setTimeout(r, 0));
const xmlEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

/* ---------- motor de exportación ---------- */
async function runExport(o, items, prog) {
  await document.fonts.ready;
  const base = IO.fileBase();
  const pxmm = o.dpi / 25.4;
  const safe = s => String(s).replace(/[\\/:*?"<>|]+/g, '_').trim();
  const n = items.length;
  const suffix = o.target === 'zones' ? '_zonas' : o.target === 'sel' ? '_seleccion' : '';
  if (o.fmt === 'pdf') {
    const pdf = new PDFWriter();
    for (let k = 0; k < n; k++) {
      const it = items[k], box = it.region || it.l;
      prog(`Preparando página ${k + 1} de ${n}…`); await tick();
      const cv = renderLamina(it.l, pxmm, { region: it.region, forceBg: '#ffffff' });
      if (o.pdfMode === 'jpg') {
        const b = await canvasBlob(cv, 'image/jpeg', o.q / 100);
        pdf.addPage(box.w, box.h, { kind: 'jpg', bytes: new Uint8Array(await b.arrayBuffer()), w: cv.width, h: cv.height });
      } else {
        const img = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
        const rgb = new Uint8Array(cv.width * cv.height * 3);
        for (let i = 0, j = 0; i < img.length; i += 4, j += 3) { rgb[j] = img[i]; rgb[j + 1] = img[i + 1]; rgb[j + 2] = img[i + 2]; }
        prog(`Comprimiendo página ${k + 1} de ${n}…`); await tick();
        pdf.addPage(box.w, box.h, { kind: 'flate', bytes: await deflate(rgb), w: cv.width, h: cv.height });
      }
      cv.width = cv.height = 1;
    }
    prog('Armando el PDF…'); await tick();
    const blob = pdf.build({ title: S.project.name });
    downloadBlob(blob, base + suffix + '.pdf');
    toast(`PDF exportado · ${n} página(s) · ${fmtBytes(blob.size)}`, '', 3800);
    return;
  }
  if (o.fmt === 'pptx') {
    const blob = await buildPptx(items, o, prog);
    downloadBlob(blob, base + suffix + '.pptx');
    toast(`PowerPoint exportado · ${n} diapositiva(s) · ${fmtBytes(blob.size)}`, '', 3800);
    return;
  }
  const files = [], used = new Set();
  const transparent = ['png', 'webp', 'tiff', 'svg'].includes(o.fmt) && o.transparent;
  for (let k = 0; k < n; k++) {
    const it = items[k];
    prog(`Exportando ${k + 1} de ${n}…`); await tick();
    let bytes;
    if (o.fmt === 'svg') bytes = new TextEncoder().encode(await laminaToSVG(it.l, it.region, o));
    else {
      const cv = renderLamina(it.l, pxmm, { region: it.region, transparent, forceBg: (o.fmt === 'jpg' || (o.fmt === 'tiff' && !transparent)) ? '#ffffff' : null });
      if (o.fmt === 'tiff') bytes = makeTiff(cv, o.dpi, transparent);
      else {
        const mime = { png: 'image/png', jpg: 'image/jpeg', webp: 'image/webp' }[o.fmt];
        bytes = new Uint8Array(await (await canvasBlob(cv, mime, o.fmt === 'png' ? undefined : o.q / 100)).arrayBuffer());
        if (o.fmt === 'png') bytes = pngSetDpi(bytes, o.dpi); else if (o.fmt === 'jpg') bytes = jpgSetDpi(bytes, o.dpi);
      }
      cv.width = cv.height = 1;
    }
    let name = safe(it.name) || 'archivo', nn = name, c = 2;
    while (used.has(nn)) nn = `${name}_${c++}`;
    used.add(nn);
    files.push({ name: `${nn}.${o.fmt === 'tiff' ? 'tif' : o.fmt}`, bytes });
  }
  const MIME = { png: 'image/png', jpg: 'image/jpeg', webp: 'image/webp', tiff: 'image/tiff', svg: 'image/svg+xml' };
  if (files.length === 1) {
    const blob = new Blob([files[0].bytes], { type: MIME[o.fmt] });
    downloadBlob(blob, `${base}_${files[0].name}`);
    toast(`${o.fmt.toUpperCase()} exportado · ${fmtBytes(blob.size)}`);
  } else {
    prog('Armando el ZIP…'); await tick();
    const blob = makeZip(files);
    downloadBlob(blob, `${base}${suffix || '_laminas'}_${o.fmt}.zip`);
    toast(`ZIP exportado · ${files.length} archivos · ${fmtBytes(blob.size)}`, '', 3800);
  }
}

/* ---------- TIFF sin compresión (con ppp) ---------- */
function makeTiff(cv, dpi, alpha) {
  const w = cv.width, h = cv.height, spp = alpha ? 4 : 3;
  const src = cv.getContext('2d').getImageData(0, 0, w, h).data;
  const dataLen = w * h * spp;
  const tags = [[256, 4, 1, w], [257, 4, 1, h], [258, 3, spp, null], [259, 3, 1, 1], [262, 3, 1, 2], [273, 4, 1, null], [277, 3, 1, spp], [278, 4, 1, h], [279, 4, 1, dataLen], [282, 5, 1, null], [283, 5, 1, null], [284, 3, 1, 1], [296, 3, 1, 2]];
  if (alpha) tags.push([338, 3, 1, 2]);
  const ifdOff = 8, ifdLen = 2 + tags.length * 12 + 4;
  const bpsOff = ifdOff + ifdLen, xresOff = bpsOff + spp * 2, yresOff = xresOff + 8, dataOff = yresOff + 8;
  const out = new Uint8Array(dataOff + dataLen), dv = new DataView(out.buffer);
  out[0] = 0x49; out[1] = 0x49; dv.setUint16(2, 42, true); dv.setUint32(4, ifdOff, true);
  dv.setUint16(ifdOff, tags.length, true);
  tags.forEach(([tag, type, count, val], i) => {
    const p = ifdOff + 2 + i * 12;
    dv.setUint16(p, tag, true); dv.setUint16(p + 2, type, true); dv.setUint32(p + 4, count, true);
    if (tag === 258) { if (spp * 2 <= 4) { for (let k = 0; k < spp; k++) dv.setUint16(p + 8 + k * 2, 8, true); } else dv.setUint32(p + 8, bpsOff, true); }
    else if (tag === 273) dv.setUint32(p + 8, dataOff, true);
    else if (tag === 282) dv.setUint32(p + 8, xresOff, true);
    else if (tag === 283) dv.setUint32(p + 8, yresOff, true);
    else if (type === 3) dv.setUint16(p + 8, val, true);
    else dv.setUint32(p + 8, val, true);
  });
  dv.setUint32(ifdOff + 2 + tags.length * 12, 0, true);
  for (let k = 0; k < spp; k++) dv.setUint16(bpsOff + k * 2, 8, true);
  dv.setUint32(xresOff, Math.round(dpi * 100), true); dv.setUint32(xresOff + 4, 100, true);
  dv.setUint32(yresOff, Math.round(dpi * 100), true); dv.setUint32(yresOff + 4, 100, true);
  if (alpha) out.set(src, dataOff);
  else for (let i = 0, j = dataOff; i < src.length; i += 4, j += 3) { out[j] = src[i]; out[j + 1] = src[i + 1]; out[j + 2] = src[i + 2]; }
  return out;
}

/* ---------- un elemento imagen → archivo (para SVG y PowerPoint editable) ---------- */
async function elementRaster(e, o) {
  const a = S.assets.get(e.assetId);
  const persp = hasPersp(e);
  const box = persp ? elAABB(e) : { w: e.w, h: e.h };
  // no subir más resolución de la que tiene el original
  let pxmm = o.dpi / 25.4;
  if (a) { const cr = e.crop || { w: a.w }; pxmm = Math.min(pxmm, Math.max(cr.w / e.w, 0.5)); }
  let W = Math.max(1, Math.round(box.w * pxmm)), H = Math.max(1, Math.round(box.h * pxmm));
  if (W * H > 40e6) { const s = Math.sqrt(40e6 / (W * H)); W = Math.round(W * s); H = Math.round(H * s); pxmm *= s; }
  const cv = newCanvas(W, H), ctx = cv.getContext('2d');
  if (persp) {
    ctx.setTransform(W / box.w, 0, 0, H / box.h, -box.x * W / box.w, -box.y * H / box.h);
    drawElement(ctx, { ...e, opacity: 1 }, W / box.w, {});
  } else {
    ctx.setTransform(W / e.w, 0, 0, H / e.h, W / 2, H / 2);
    drawElement(ctx, { ...e, x: -e.w / 2, y: -e.h / 2, rot: 0, opacity: 1 }, W / e.w, {});
  }
  const opaque = a && !e.maskId && !persp && /jpe?g/.test(a.mime || '');
  const mime = opaque ? 'image/jpeg' : 'image/png';
  const blob = await canvasBlob(cv, mime, opaque ? o.q / 100 : undefined);
  cv.width = cv.height = 1;
  return { blob, mime, ext: opaque ? 'jpg' : 'png', persp, box };
}

/* ---------- SVG ---------- */
async function laminaToSVG(l, region, o) {
  const rg = region || { x: 0, y: 0, w: l.w, h: l.h };
  const info = tokenInfo(l), f = n => round(n, 3);
  const parts = [];
  const fontsUsed = new Set(l.elements.filter(e => e.type === 'text' && e.visible).map(e => e.font));
  let style = '';
  for (const fnt of S.project.fonts) {
    if (!fontsUsed.has(fnt.family)) continue;
    const a = S.assets.get(fnt.assetId); if (!a) continue;
    style += `@font-face{font-family:"${fnt.family}";src:url(${await blobToDataURL(a.blob)});}`;
  }
  parts.push(`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${f(rg.w)}mm" height="${f(rg.h)}mm" viewBox="${f(rg.x)} ${f(rg.y)} ${f(rg.w)} ${f(rg.h)}">`);
  parts.push(`<title>${xmlEsc(S.project.name + ' · ' + l.name)}</title>`);
  if (style) parts.push(`<style>${style}</style>`);
  parts.push(`<defs><clipPath id="hoja"><rect x="0" y="0" width="${f(l.w)}" height="${f(l.h)}"/></clipPath></defs>`);
  if (l.bg && !o.transparent) parts.push(`<rect x="0" y="0" width="${f(l.w)}" height="${f(l.h)}" fill="${l.bg}"/>`);
  parts.push('<g clip-path="url(#hoja)">');
  for (const e of l.elements) {
    if (!e.visible || e.type === 'zone') continue;
    const c = elCenter(e), op = e.opacity == null ? 1 : e.opacity;
    const opA = op < 1 ? ` opacity="${f(op)}"` : '';
    const rotA = e.rot ? ` transform="rotate(${f(e.rot)} ${f(c.x)} ${f(c.y)})"` : '';
    const nm = ` id="${xmlEsc(e.id)}"${e.name ? ` data-name="${xmlEsc(e.name)}"` : ''}`;
    if (e.type === 'rect') {
      parts.push(`<rect${nm} x="${f(e.x)}" y="${f(e.y)}" width="${f(e.w)}" height="${f(e.h)}"${e.radius ? ` rx="${f(Math.min(e.radius, e.w / 2, e.h / 2))}"` : ''} fill="${e.fill || 'none'}" stroke="${e.stroke && e.sw > 0 ? e.stroke : 'none'}" stroke-width="${f(e.sw || 0)}"${opA}${rotA}/>`);
    } else if (e.type === 'ellipse') {
      parts.push(`<ellipse${nm} cx="${f(c.x)}" cy="${f(c.y)}" rx="${f(e.w / 2)}" ry="${f(e.h / 2)}" fill="${e.fill || 'none'}" stroke="${e.stroke && e.sw > 0 ? e.stroke : 'none'}" stroke-width="${f(e.sw || 0)}"${opA}${rotA}/>`);
    } else if (e.type === 'line') {
      const [p1, p2] = lineEnds(e), sw = Math.max(e.sw || 0.3, 0.01);
      parts.push(`<line${nm} x1="${f(p1.x)}" y1="${f(p1.y)}" x2="${f(p2.x)}" y2="${f(p2.y)}" stroke="${e.stroke || '#000'}" stroke-width="${f(sw)}"${e.cap === 'round' ? ' stroke-linecap="round"' : ''}${e.dash ? ` stroke-dasharray="${f(sw * 4 + 1)} ${f(sw * 2 + 1)}"` : ''}${opA}/>`);
    } else if (e.type === 'text') {
      const text = resolveTokens(e.text, info), lay = TextM.layout(e, text);
      const anchor = e.align === 'center' ? 'middle' : e.align === 'right' ? 'end' : 'start';
      const x0 = e.align === 'center' ? 0 : e.align === 'right' ? e.w / 2 : -e.w / 2;
      const tr = `translate(${f(c.x)} ${f(c.y)})${e.rot ? ` rotate(${f(e.rot)})` : ''}${e.flipH || e.flipV ? ` scale(${e.flipH ? -1 : 1} ${e.flipV ? -1 : 1})` : ''}`;
      parts.push(`<text${nm} transform="${tr}" font-family="'${xmlEsc(e.font)}', Arial, sans-serif" font-size="${f(lay.sizeMM)}" font-weight="${e.weight || 400}"${e.italic ? ' font-style="italic"' : ''} fill="${e.color || '#000'}" text-anchor="${anchor}"${lay.lsMM ? ` letter-spacing="${f(lay.lsMM)}"` : ''}${opA} xml:space="preserve">${lay.lines.map((ln, i) => `<tspan x="${f(x0)}" y="${f(-e.h / 2 + (i + 0.5) * lay.lineH)}" dominant-baseline="central">${xmlEsc(ln.t)}</tspan>`).join('')}</text>`);
    } else if (e.type === 'image') {
      if (!S.assets.get(e.assetId)) continue;
      const r = await elementRaster(e, o);
      const href = await blobToDataURL(r.blob);
      if (r.persp) parts.push(`<image${nm} x="${f(r.box.x)}" y="${f(r.box.y)}" width="${f(r.box.w)}" height="${f(r.box.h)}" preserveAspectRatio="none" href="${href}"${opA}/>`);
      else parts.push(`<image${nm} x="${f(e.x)}" y="${f(e.y)}" width="${f(e.w)}" height="${f(e.h)}" preserveAspectRatio="none" href="${href}"${opA}${rotA}/>`);
    }
  }
  parts.push('</g></svg>');
  return parts.join('\n');
}

/* ---------- PowerPoint (.pptx) ---------- */
const NS_A = 'http://schemas.openxmlformats.org/drawingml/2006/main', NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships', NS_P = 'http://schemas.openxmlformats.org/presentationml/2006/main';
const PNS = `xmlns:a="${NS_A}" xmlns:r="${NS_R}" xmlns:p="${NS_P}"`;
const XH = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const SPTREE_HEAD = '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>';
const THEME_XML = XH + `<a:theme xmlns:a="${NS_A}" name="Editor de Laminas"><a:themeElements><a:clrScheme name="Laminas"><a:dk1><a:srgbClr val="1D232C"/></a:dk1><a:lt1><a:srgbClr val="FFFFFF"/></a:lt1><a:dk2><a:srgbClr val="3D4A5C"/></a:dk2><a:lt2><a:srgbClr val="EEF0F4"/></a:lt2><a:accent1><a:srgbClr val="2F6FDE"/></a:accent1><a:accent2><a:srgbClr val="E07A1F"/></a:accent2><a:accent3><a:srgbClr val="2B9348"/></a:accent3><a:accent4><a:srgbClr val="7B4FD6"/></a:accent4><a:accent5><a:srgbClr val="D1495B"/></a:accent5><a:accent6><a:srgbClr val="0F8B8D"/></a:accent6><a:hlink><a:srgbClr val="2F6FDE"/></a:hlink><a:folHlink><a:srgbClr val="7B4FD6"/></a:folHlink></a:clrScheme><a:fontScheme name="Laminas"><a:majorFont><a:latin typeface="Arial"/><a:ea typeface=""/><a:cs typeface=""/></a:majorFont><a:minorFont><a:latin typeface="Arial"/><a:ea typeface=""/><a:cs typeface=""/></a:minorFont></a:fontScheme><a:fmtScheme name="Laminas"><a:fillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:fillStyleLst><a:lnStyleLst><a:ln w="6350"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="12700"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="19050"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln></a:lnStyleLst><a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst><a:bgFillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:bgFillStyleLst></a:fmtScheme></a:themeElements><a:objectDefaults/><a:extraClrSchemeLst/></a:theme>`;

async function buildPptx(items, o, prog) {
  const EMU = 36000, MAXE = 51206400, MINE = 914400;
  const b0 = items[0].region || items[0].l;
  let SW = b0.w * EMU, SH = b0.h * EMU;
  const big = Math.max(SW, SH); if (big > MAXE) { SW *= MAXE / big; SH *= MAXE / big; }
  const small = Math.min(SW, SH); if (small < MINE) { SW *= MINE / small; SH *= MINE / small; }
  SW = Math.round(SW); SH = Math.round(SH);
  const files = [], slides = [];
  const enc = new TextEncoder();
  let mediaN = 0;
  const media = [];
  const addMedia = async (blob, ext) => { const name = `image${++mediaN}.${ext}`; media.push({ name: `ppt/media/${name}`, bytes: new Uint8Array(await blob.arrayBuffer()), ext }); return name; };
  const hex = c => (c || '#000000').replace('#', '').toUpperCase().padEnd(6, '0').slice(0, 6);
  const alphaX = op => op < 0.999 ? `<a:alpha val="${Math.round(op * 100000)}"/>` : '';
  const fill = (c, op) => c ? `<a:solidFill><a:srgbClr val="${hex(c)}">${alphaX(op)}</a:srgbClr></a:solidFill>` : '<a:noFill/>';
  for (let k = 0; k < items.length; k++) {
    const it = items[k], l = it.l, box = it.region || { x: 0, y: 0, w: l.w, h: l.h };
    prog(`Diapositiva ${k + 1} de ${items.length}…`); await tick();
    const s = Math.min(SW / (box.w * EMU), SH / (box.h * EMU));
    const offX = (SW - box.w * EMU * s) / 2, offY = (SH - box.h * EMU * s) / 2;
    const X = x => Math.round(offX + (x - box.x) * EMU * s), Y = y => Math.round(offY + (y - box.y) * EMU * s), D = v => Math.max(0, Math.round(v * EMU * s));
    const rels = [`<Relationship Id="rId1" Type="${REL}/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>`];
    let rid = 1, sid = 1;
    const shapes = [];
    const addRel = name => { rels.push(`<Relationship Id="rId${++rid}" Type="${REL}/image" Target="../media/${name}"/>`); return 'rId' + rid; };
    const xfrm = (x, y, w, h, rot, fh, fv) => { const rr = Math.round((((rot || 0) % 360) + 360) % 360 * 60000); return `<a:xfrm${rr ? ` rot="${rr}"` : ''}${fh ? ' flipH="1"' : ''}${fv ? ' flipV="1"' : ''}><a:off x="${x}" y="${y}"/><a:ext cx="${Math.max(1, w)}" cy="${Math.max(1, h)}"/></a:xfrm>`; };
    const pic = (rId, name, x, y, w, h, rot, op) => `<p:pic><p:nvPicPr><p:cNvPr id="${++sid}" name="${xmlEsc(name)}"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="${rId}">${op < 0.999 ? `<a:alphaModFix amt="${Math.round(op * 100000)}"/>` : ''}</a:blip><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr>${xfrm(x, y, w, h, rot)}<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>`;
    let bg = '';
    if (o.pptxMode !== 'editable') {
      const cv = renderLamina(l, o.dpi / 25.4, { region: it.region, forceBg: '#ffffff' });
      const blob = await canvasBlob(cv, 'image/jpeg', o.q / 100); cv.width = cv.height = 1;
      const name = await addMedia(blob, 'jpg');
      shapes.push(pic(addRel(name), l.name, X(box.x), Y(box.y), D(box.w), D(box.h), 0, 1));
      bg = '<p:bg><p:bgPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:effectLst/></p:bgPr></p:bg>';
    } else {
      bg = `<p:bg><p:bgPr><a:solidFill><a:srgbClr val="${hex(l.bg || '#ffffff')}"/></a:solidFill><a:effectLst/></p:bgPr></p:bg>`;
      const info = tokenInfo(l);
      for (const e of l.elements) {
        if (!e.visible || e.type === 'zone') continue;
        const op = e.opacity == null ? 1 : e.opacity, nm = elDisplayName(e);
        if (e.type === 'image') {
          if (!S.assets.get(e.assetId)) continue;
          const r = await elementRaster(e, o);
          const name = await addMedia(r.blob, r.ext);
          if (r.persp) shapes.push(pic(addRel(name), nm, X(r.box.x), Y(r.box.y), D(r.box.w), D(r.box.h), 0, op));
          else shapes.push(pic(addRel(name), nm, X(e.x), Y(e.y), D(e.w), D(e.h), e.rot, op));
        } else if (e.type === 'rect' || e.type === 'ellipse') {
          const rr = e.type === 'rect' && e.radius > 0;
          const geom = e.type === 'ellipse' ? '<a:prstGeom prst="ellipse"><a:avLst/></a:prstGeom>' : rr ? `<a:prstGeom prst="roundRect"><a:avLst><a:gd name="adj" fmla="val ${Math.round(clamp(e.radius / Math.min(e.w, e.h), 0, 0.5) * 100000)}"/></a:avLst></a:prstGeom>` : '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom>';
          const ln = e.stroke && e.sw > 0 ? `<a:ln w="${D(e.sw)}">${fill(e.stroke, op)}</a:ln>` : '<a:ln><a:noFill/></a:ln>';
          shapes.push(`<p:sp><p:nvSpPr><p:cNvPr id="${++sid}" name="${xmlEsc(nm)}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr>${xfrm(X(e.x), Y(e.y), D(e.w), D(e.h), e.rot)}${geom}${fill(e.fill, op)}${ln}</p:spPr></p:sp>`);
        } else if (e.type === 'line') {
          const [a, b] = lineEnds(e);
          const fh = (b.x < a.x) !== (b.y < a.y) && Math.abs(b.x - a.x) > 1e-6 && Math.abs(b.y - a.y) > 1e-6;
          const x0 = Math.min(a.x, b.x), y0 = Math.min(a.y, b.y);
          shapes.push(`<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="${++sid}" name="${xmlEsc(nm)}"/><p:cNvCxnSpPr/><p:nvPr/></p:nvCxnSpPr><p:spPr>${xfrm(X(x0), Y(y0), D(Math.abs(b.x - a.x)), D(Math.abs(b.y - a.y)), 0, fh, false)}<a:prstGeom prst="line"><a:avLst/></a:prstGeom><a:ln w="${Math.max(1, D(e.sw || 0.3))}"${e.cap === 'round' ? ' cap="rnd"' : ''}>${fill(e.stroke || '#000000', op)}${e.dash ? '<a:prstDash val="dash"/>' : ''}</a:ln></p:spPr></p:cxnSp>`);
        } else if (e.type === 'text') {
          const text = resolveTokens(e.text, info);
          const sz = Math.max(100, Math.round(e.size * s * 100));
          const algn = e.align === 'center' ? 'ctr' : e.align === 'right' ? 'r' : 'l';
          const rPr = `<a:rPr lang="es-MX" sz="${sz}"${(e.weight || 400) >= 600 ? ' b="1"' : ''}${e.italic ? ' i="1"' : ''}${e.ls ? ` spc="${Math.round(e.ls * s * 100)}"` : ''} dirty="0">${fill(e.color || '#000000', op)}<a:latin typeface="${xmlEsc(e.font || 'Arial')}"/><a:cs typeface="${xmlEsc(e.font || 'Arial')}"/></a:rPr>`;
          const paras = String(text).split('\n').map(t => `<a:p><a:pPr algn="${algn}"><a:lnSpc><a:spcPct val="${Math.round((e.lh || 1.2) / 1.2 * 100000)}"/></a:lnSpc></a:pPr>${t ? `<a:r>${rPr}<a:t>${xmlEsc(t)}</a:t></a:r>` : ''}<a:endParaRPr lang="es-MX" sz="${sz}" dirty="0"/></a:p>`).join('');
          shapes.push(`<p:sp><p:nvSpPr><p:cNvPr id="${++sid}" name="${xmlEsc(nm)}"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr>${xfrm(X(e.x), Y(e.y), D(e.w), D(e.h), e.rot, e.flipH, e.flipV)}<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr><p:txBody><a:bodyPr wrap="square" lIns="0" tIns="0" rIns="0" bIns="0" rtlCol="0" anchor="t"><a:noAutofit/></a:bodyPr><a:lstStyle/>${paras}</p:txBody></p:sp>`);
        }
      }
    }
    files.push({ name: `ppt/slides/slide${k + 1}.xml`, text: XH + `<p:sld ${PNS}><p:cSld name="${xmlEsc(l.name)}">${bg}<p:spTree>${SPTREE_HEAD}${shapes.join('')}</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>` });
    files.push({ name: `ppt/slides/_rels/slide${k + 1}.xml.rels`, text: XH + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>` });
    slides.push(k + 1);
  }
  prog('Armando el PowerPoint…'); await tick();
  const n = slides.length;
  const exts = new Set(media.map(m => m.ext));
  files.unshift({ name: '[Content_Types].xml', text: XH + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>${exts.has('png') ? '<Default Extension="png" ContentType="image/png"/>' : ''}${exts.has('jpg') ? '<Default Extension="jpg" ContentType="image/jpeg"/>' : ''}<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/><Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/><Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/><Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/><Override PartName="/ppt/presProps.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presProps+xml"/><Override PartName="/ppt/viewProps.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.viewProps+xml"/><Override PartName="/ppt/tableStyles.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.tableStyles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>${slides.map(i => `<Override PartName="/ppt/slides/slide${i}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`).join('')}</Types>` });
  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  files.push(
    { name: '_rels/.rels', text: XH + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="ppt/presentation.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="${REL}/extended-properties" Target="docProps/app.xml"/></Relationships>` },
    { name: 'docProps/core.xml', text: XH + `<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xmlEsc(S.project.name)}</dc:title><dc:creator>Editor de Láminas</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>` },
    { name: 'docProps/app.xml', text: XH + `<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Editor de Laminas</Application><Slides>${n}</Slides></Properties>` },
    { name: 'ppt/presentation.xml', text: XH + `<p:presentation ${PNS} saveSubsetFonts="1"><p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst><p:sldIdLst>${slides.map(i => `<p:sldId id="${255 + i}" r:id="rId${i + 1}"/>`).join('')}</p:sldIdLst><p:sldSz cx="${SW}" cy="${SH}"/><p:notesSz cx="6858000" cy="9144000"/></p:presentation>` },
    { name: 'ppt/_rels/presentation.xml.rels', text: XH + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/slideMaster" Target="slideMasters/slideMaster1.xml"/>${slides.map(i => `<Relationship Id="rId${i + 1}" Type="${REL}/slide" Target="slides/slide${i}.xml"/>`).join('')}<Relationship Id="rId${n + 2}" Type="${REL}/presProps" Target="presProps.xml"/><Relationship Id="rId${n + 3}" Type="${REL}/viewProps" Target="viewProps.xml"/><Relationship Id="rId${n + 4}" Type="${REL}/theme" Target="theme/theme1.xml"/><Relationship Id="rId${n + 5}" Type="${REL}/tableStyles" Target="tableStyles.xml"/></Relationships>` },
    { name: 'ppt/presProps.xml', text: XH + `<p:presentationPr ${PNS}/>` },
    { name: 'ppt/viewProps.xml', text: XH + `<p:viewPr ${PNS}><p:normalViewPr><p:restoredLeft sz="15620"/><p:restoredTop sz="94660"/></p:normalViewPr><p:gridSpacing cx="72008" cy="72008"/></p:viewPr>` },
    { name: 'ppt/tableStyles.xml', text: XH + `<a:tblStyleLst xmlns:a="${NS_A}" def="{5C22544A-7EE6-4342-B048-85BDC9FD1C3A}"/>` },
    { name: 'ppt/theme/theme1.xml', text: THEME_XML },
    { name: 'ppt/slideMasters/slideMaster1.xml', text: XH + `<p:sldMaster ${PNS}><p:cSld><p:bg><p:bgRef idx="1001"><a:schemeClr val="bg1"/></p:bgRef></p:bg><p:spTree>${SPTREE_HEAD}</p:spTree></p:cSld><p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/><p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst><p:txStyles><p:titleStyle><a:lvl1pPr><a:defRPr sz="4400"/></a:lvl1pPr></p:titleStyle><p:bodyStyle><a:lvl1pPr><a:defRPr sz="1800"/></a:lvl1pPr></p:bodyStyle><p:otherStyle><a:lvl1pPr><a:defRPr sz="1800"/></a:lvl1pPr></p:otherStyle></p:txStyles></p:sldMaster>` },
    { name: 'ppt/slideMasters/_rels/slideMaster1.xml.rels', text: XH + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/slideLayout" Target="../slideLayouts/slideLayout1.xml"/><Relationship Id="rId2" Type="${REL}/theme" Target="../theme/theme1.xml"/></Relationships>` },
    { name: 'ppt/slideLayouts/slideLayout1.xml', text: XH + `<p:sldLayout ${PNS} type="blank" preserve="1"><p:cSld name="En blanco"><p:spTree>${SPTREE_HEAD}</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sldLayout>` },
    { name: 'ppt/slideLayouts/_rels/slideLayout1.xml.rels', text: XH + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/slideMaster" Target="../slideMasters/slideMaster1.xml"/></Relationships>` },
  );
  const zipFiles = files.map(f => ({ name: f.name, bytes: enc.encode(f.text) })).concat(media.map(m => ({ name: m.name, bytes: m.bytes })));
  return makeZip(zipFiles, 'application/vnd.openxmlformats-officedocument.presentationml.presentation');
}

/* =====================================================================
   Arranque
   ===================================================================== */
(async function main() {
  try { applyTheme(localStorage.getItem('el-theme') || 'auto'); } catch { }
  Pix.init(); R.init(); I.init(); UI.init(); Home.init(); Present.init();
  $('.brand').addEventListener('keydown', e => { if (e.key === 'Enter') Home.show(); });
  document.addEventListener('fullscreenchange', updateFsButton);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { R.request(); UI.thumbs(); });
  await Store.open();
  let restored = false;
  try {
    const saved = await Store.load();
    if (saved) {
      for (const [id, a] of saved.assets) {
        try {
          if (a.kind === 'image' || a.kind === 'version') await decodeImageAsset(a);
          else if (a.kind === 'mask') await decodeMaskAsset(a);
          else if (a.kind === 'font') await registerFont(a, a.family || a.name);
          S.assets.set(id, a); Store.saved.add(id);
        } catch (err) { console.warn('Recurso no recuperado', id, err); }
      }
      S.project = normalizeProject(saved.project);
      S.curId = S.project.laminas.find(l => l.id === saved.rec.curId) ? saved.rec.curId : S.project.laminas[0].id;
      S.fileName = saved.rec.fileName || null; S.dirty = !!saved.rec.dirty; S.fileHandle = saved.rec.handle || null;
      Store.lastAt = new Date(saved.rec.savedAt);
      histReset('Recuperar sesión');
      restored = true;
      const when = new Date(saved.rec.savedAt).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      if (getPref('el-startup', 'home') === 'continue') setTimeout(() => toast(`Se recuperó tu último trabajo (${when})${S.dirty ? ' · tiene cambios sin guardar' : ''}`, '', 4200), 300);
    }
  } catch (err) {
    console.error(err);
    toast('No se pudo recuperar el respaldo automático. Se abrió un proyecto nuevo.', 'warn', 5000);
  }
  if (!restored) {
    S.project = newProject();
    S.curId = S.project.laminas[0].id;
    S.closed = true;
    histReset('—');
  }
  await Notes.load(); await Favs.load(); Notes.init(); Favs.init(); Favs.render();
  try { applyAccent(localStorage.getItem('el-accent')); } catch { }
  UI.all();
  requestAnimationFrame(() => zoomFit());
  if (S.closed || getPref('el-startup', 'home') === 'home') Home.show();
  // arrastrar un proyecto a la pantalla de inicio
  const hm = $('#home');
  hm.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  hm.addEventListener('drop', e => { e.preventDefault(); const hp = [...(e.dataTransfer.items || [])].map(it => it.kind === 'file' && it.getAsFileSystemHandle ? it.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null)); I.dropFiles([...e.dataTransfer.files], null, hp); });
  if (!Store.db) toast('Este navegador no permite el respaldo automático. Guarda tu proyecto en un archivo con Ctrl+S.', 'warn', 6000);
  window.addEventListener('beforeunload', e => {
    if (Store.timer && S.dirty) { Store.save(); }
    if (!Store.db && S.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
  window.__EL = { S, A, UI, IO, R, Pix, Colors, Versions, Notes, Favs, Cfg, Home, Present, Recents, Profiles }; // acceso para pruebas y depuración
})();

</script>
