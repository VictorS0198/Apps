<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de Láminas</title>
<style>
:root{
  --accent:#2f6fde;
  --accent-ink:#ffffff;
  --accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);
  --bg:#e6e9ee;
  --desk:#cfd5de;
  --panel:#f7f8fa;
  --panel-2:#eef0f4;
  --line:#d5d9e0;
  --ink:#1d232c;
  --ink-2:#5a6472;
  --ink-3:#8a93a0;
  --field:#ffffff;
  --danger:#c93a3a;
  --warn:#b7791f;
  --snap:#e0338a;
  --guide:#12a3c4;
  --shadow:0 6px 24px rgba(20,30,45,.18);
  --r:6px;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1f25;--desk:#2a3039;--panel:#22272e;--panel-2:#2a3038;--line:#363d47;
    --ink:#e7eaef;--ink-2:#a9b1bc;--ink-3:#77808c;--field:#1a1e24;
    --shadow:0 8px 28px rgba(0,0,0,.45);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1f25;--desk:#2a3039;--panel:#22272e;--panel-2:#2a3038;--line:#363d47;
  --ink:#e7eaef;--ink-2:#a9b1bc;--ink-3:#77808c;--field:#1a1e24;
  --shadow:0 8px 28px rgba(0,0,0,.45);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.4 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
#app{display:grid;height:100vh;grid-template-columns:44px 188px 1fr 304px;grid-template-rows:44px 1fr 26px;
  grid-template-areas:"top top top top" "tools left stage right" "status status status status"}

/* ---------- top bar ---------- */
#topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{color:var(--accent);display:flex;align-items:center;padding:0 2px}
.project-name{border:1px solid transparent;background:transparent;border-radius:var(--r);padding:4px 8px;font-weight:600;width:200px;min-width:80px}
.project-name:hover{border-color:var(--line)}
.project-name:focus{outline:none;border-color:var(--accent);background:var(--field)}
.menu{display:flex;align-items:center;gap:2px}
.menu button{border:0;background:transparent;padding:5px 9px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.menu button:hover{background:var(--panel-2)}
.menu button.primary{background:var(--accent);color:var(--accent-ink);margin-left:4px}
.menu button.primary:hover{filter:brightness(1.08);background:var(--accent)}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.spacer{flex:1}
.iconrow{display:flex;align-items:center;gap:2px}
button.icon{width:30px;height:30px;border:0;background:transparent;border-radius:var(--r);display:grid;place-items:center;cursor:pointer;padding:0}
button.icon svg,.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button.icon:hover{background:var(--panel-2)}
button.icon:disabled{opacity:.35;cursor:default;background:transparent}
button.icon.small{width:24px;height:24px}
button.icon.small svg{width:15px;height:15px}
.zoom-label{border:0;background:transparent;min-width:54px;padding:4px 6px;border-radius:var(--r);cursor:pointer;font-variant-numeric:tabular-nums}
.zoom-label:hover{background:var(--panel-2)}

/* ---------- tools ---------- */
#tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px}
.tool{width:34px;height:34px;border:0;background:transparent;border-radius:var(--r);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.tool:hover{background:var(--panel-2);color:var(--ink)}
.tool.active{background:var(--accent);color:var(--accent-ink)}
.tsep{width:22px;height:1px;background:var(--line);margin:4px 0}

/* ---------- left panel ---------- */
#leftPanel{grid-area:left;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px;font-weight:600;color:var(--ink-2)}
.lamina-list{overflow:auto;padding:4px 10px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.lam{position:relative;border-radius:var(--r);padding:6px;cursor:pointer;border:1.5px solid transparent}
.lam:hover{background:var(--panel-2)}
.lam.active{border-color:var(--accent);background:var(--accent-soft)}
.lam canvas{display:block;margin:0 auto;box-shadow:0 1px 4px rgba(0,0,0,.22);background:#fff;max-width:100%}
.lam .lam-meta{display:flex;gap:6px;align-items:baseline;margin-top:5px;font-size:12px}
.lam .lam-num{color:var(--ink-3);font-variant-numeric:tabular-nums}
.lam .lam-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.lam.drop-before::before,.lam.drop-after::after{content:"";position:absolute;left:4px;right:4px;height:3px;background:var(--accent);border-radius:2px}
.lam.drop-before::before{top:-7px}
.lam.drop-after::after{bottom:-7px}

/* ---------- stage ---------- */
#stage{grid-area:stage;position:relative;background:var(--desk);overflow:hidden;min-width:0;min-height:0}
.ruler{position:absolute;background:var(--panel);z-index:2}
.ruler-top{left:20px;top:0;right:0;height:20px;border-bottom:1px solid var(--line);cursor:s-resize}
.ruler-left{left:0;top:20px;bottom:0;width:20px;border-right:1px solid var(--line);cursor:e-resize}
.ruler-corner{position:absolute;left:0;top:0;width:20px;height:20px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:3;cursor:pointer}
#viewport{position:absolute;left:20px;top:20px;right:0;bottom:0;overflow:hidden}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#textEditor{position:absolute;margin:0;padding:0;border:0;outline:1px dashed var(--accent);background:transparent;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word;transform-origin:0 0;z-index:5;line-height:1.2}
#dropHint{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:grid;place-items:center;z-index:6;pointer-events:none}
#dropHint div{background:var(--panel);padding:10px 16px;border-radius:var(--r);box-shadow:var(--shadow);font-weight:600}

/* ---------- right panel ---------- */
#rightPanel{grid-area:right;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px}
.tab{flex:1;border:0;background:transparent;padding:10px 4px 8px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab-body{overflow:auto;flex:1;min-height:0}
.sect{padding:10px 12px 12px;border-bottom:1px solid var(--line)}
.sect h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row:last-child{margin-bottom:0}
.row > label.lbl{width:72px;flex:none;color:var(--ink-2);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.fld{position:relative;display:flex;align-items:center;min-width:0;flex:1}
.fld > span.k{position:absolute;left:7px;color:var(--ink-3);font-size:11px;pointer-events:none}
.fld > span.u{position:absolute;right:7px;color:var(--ink-3);font-size:11px;pointer-events:none}

input[type=text],input[type=number],select,textarea.ta{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:5px;padding:4px 7px;height:28px}
textarea.ta{height:auto;min-height:70px;resize:vertical;line-height:1.35}
input[type=number]{font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
input[type=color]{width:34px;height:28px;padding:2px;border:1px solid var(--line);border-radius:5px;background:var(--field);flex:none;cursor:pointer}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
input[type=checkbox]{accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--field);border-radius:5px;padding:4px 10px;height:28px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn:hover{border-color:var(--ink-3)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.ico{width:30px;padding:0}
.btnrow{display:flex;gap:4px;flex-wrap:wrap}
.btnrow.fill > .btn{flex:1}
.hint{color:var(--ink-3);font-size:11.5px;line-height:1.4}
.warn{color:var(--warn)}
.empty{padding:22px 16px;color:var(--ink-3);text-align:center}
.chip{display:inline-block;padding:1px 6px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:11px;cursor:pointer;margin:2px 2px 0 0}
.chip:hover{border-color:var(--accent)}

/* layers */
.layer-list{padding:6px}
.layer{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:5px;cursor:pointer;border:1px solid transparent}
.layer:hover{background:var(--panel-2)}
.layer.sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.layer.hidden-el .lname,.layer.hidden-el .lic{opacity:.45}
.layer .lic{width:18px;height:18px;color:var(--ink-2);flex:none}
.layer .lic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin:1px}
.layer .lname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .grp{width:3px;align-self:stretch;border-radius:2px;flex:none}
.layer button{border:0;background:transparent;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;cursor:pointer;color:var(--ink-3);padding:0}
.layer button:hover{background:var(--line);color:var(--ink)}
.layer button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.layer button.on{color:var(--ink)}
.layer input{height:22px;padding:1px 4px}
.layer.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.layer.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}

/* history */
.history-list{padding:6px}
.hist{padding:5px 8px;border-radius:5px;cursor:pointer;display:flex;gap:8px}
.hist:hover{background:var(--panel-2)}
.hist.cur{background:var(--accent-soft);font-weight:600}
.hist.future{color:var(--ink-3)}
.hist .hn{color:var(--ink-3);width:22px;text-align:right;font-variant-numeric:tabular-nums}

/* status */
#statusbar{grid-area:status;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
#statusbar .toggle{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
#stCursor{font-variant-numeric:tabular-nums;min-width:150px}
.save-state{min-width:110px;text-align:right}

/* context menu */
.ctxmenu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:210px}
.ctxmenu button{display:flex;width:100%;border:0;background:transparent;padding:6px 10px;border-radius:5px;cursor:pointer;text-align:left;gap:10px}
.ctxmenu button:hover{background:var(--accent);color:var(--accent-ink)}
.ctxmenu button:hover kbd{color:inherit}
.ctxmenu button:disabled{opacity:.4;background:transparent;color:inherit;cursor:default}
.ctxmenu button span{flex:1}
.ctxmenu kbd{font:inherit;font-size:11px;color:var(--ink-3)}
.ctxmenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* toasts */
#toasts{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:7px;box-shadow:var(--shadow);max-width:520px;pointer-events:auto;animation:tin .18s ease-out}
.toast.error{background:var(--danger);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);max-width:min(92vw,980px)}
dialog::backdrop{background:rgba(15,20,28,.45)}
.dlg-head{padding:14px 18px 6px;font-size:15px;font-weight:600}
.dlg-body{padding:6px 18px 14px;max-height:72vh;overflow:auto}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.dlg-foot .left{margin-right:auto}
.dlg-body .row > label.lbl{width:130px}
.opt-list{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.opt:hover{border-color:var(--ink-3)}
.opt input{margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--field);padding:4px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.crop-wrap{position:relative;background:repeating-conic-gradient(#ccc 0 25%,#eee 0 50%) 0 0/16px 16px;user-select:none;touch-action:none;margin:0 auto}
.crop-wrap img{display:block;width:100%;height:100%;pointer-events:none}
.crop-shade{position:absolute;inset:0;pointer-events:none}
.crop-box{position:absolute;border:1.5px solid #fff;outline:1px solid rgba(0,0,0,.5);box-shadow:0 0 0 9999px rgba(0,0,0,.5);cursor:move}
.crop-box::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.5) calc(33.33% - .5px),rgba(255,255,255,.5) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.5) calc(66.66% - .5px),rgba(255,255,255,.5) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.5) calc(33.33% - .5px),rgba(255,255,255,.5) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.5) calc(66.66% - .5px),rgba(255,255,255,.5) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.crop-h{position:absolute;width:12px;height:12px;background:#fff;border:1px solid #333;margin:-6px 0 0 -6px}
.crop-wrap-outer{overflow:hidden;border-radius:6px}
.tok{font-family:Consolas,monospace;font-size:11.5px}

.btn.primary.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}

.fld input.has-k{padding-left:26px}
.fld input.has-u{padding-right:32px}
.swrow{display:flex;flex-wrap:wrap;gap:4px;margin:-2px 0 8px 78px}
.tab-body .swrow{margin-left:0}
.sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.18);padding:0;cursor:pointer}
.sw.big{width:24px;height:24px;border-radius:5px}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px}
.col-codes{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
.pal{margin-bottom:10px}
.tool-opts{background:var(--panel-2)}
.tabs .tab{font-size:12.5px}
.sect .seg button{padding:4px 9px}
.tool-opts .seg button{padding:4px 8px;font-size:12px}
/* ---------- fase 3 ---------- */
.lp-tabs{gap:2px;padding:6px 8px}
.lp-tab{border:0;background:transparent;padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--ink-2);font-weight:600}
.lp-tab.on{background:var(--panel-2);color:var(--ink)}
.fav-panel{display:flex;flex-direction:column;gap:8px;padding:2px 10px 12px;overflow:auto;flex:1;min-height:0}
.fav-tags{display:flex;flex-wrap:wrap;gap:2px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fav-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fav{border:1px solid var(--line);border-radius:7px;padding:5px;cursor:pointer;background:var(--field);display:flex;flex-direction:column;gap:4px;min-width:0}
.fav:hover{border-color:var(--accent)}
.fav img{width:100%;height:62px;object-fit:contain;background:repeating-conic-gradient(var(--panel-2) 0 25%,transparent 0 50%) 0 0/10px 10px;border-radius:4px}
.fav span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver-list{display:flex;flex-direction:column;gap:6px}
.ver{display:flex;gap:6px;align-items:center;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.ver img{width:54px;height:38px;object-fit:contain;background:#fff;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.ver-n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver .btn.ico{width:26px;height:26px}
.cmp-stage{position:relative;margin:10px auto 0;user-select:none;touch-action:none;background:#fff;box-shadow:0 0 0 1px var(--line);overflow:hidden;border-radius:4px}
.cmp-full{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.cmp-clip{position:absolute;inset:0}
.cmp-bar{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);cursor:ew-resize}
.cmp-bar span{position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #fff}
.cmp-tag{position:absolute;top:8px;left:8px;background:rgba(20,26,35,.78);color:#fff;font-size:12px;padding:3px 8px;border-radius:4px;pointer-events:none}
.cmp-tag.r{left:auto;right:8px}
.cmp-split{display:grid;grid-template-columns:1fr 1fr;gap:6px;height:100%;background:var(--panel)}
.cmp-split figure{margin:0;display:flex;flex-direction:column;gap:4px;min-height:0}
.cmp-split img{width:100%;flex:1;min-height:0;object-fit:contain;background:#fff}
.cmp-split figcaption{font-size:12px;color:var(--ink-2);text-align:center}
.notes-win{position:fixed;top:56px;right:300px;width:340px;max-height:70vh;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;padding:0 10px 10px}
.nw-head{display:flex;align-items:center;gap:8px;padding:10px 0 2px;cursor:move;user-select:none}
.nw-head .btn{height:26px}
.nw-tabs{display:flex}
.nw-tabs button{flex:1}
.nw-list{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:60px}
.note{border:1px solid var(--line);border-radius:7px;padding:7px;background:var(--field)}
.note.done{opacity:.6}
.note.done .n-title,.note.done .n-text{text-decoration:line-through}
.note .n-title{height:26px;border-color:transparent;background:transparent;font-weight:600;padding-left:2px}
.note .n-title:focus{border-color:var(--accent);background:var(--field)}
.note .ta{min-height:52px;margin-bottom:3px}
.note .btn.ico{width:26px;height:26px}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 22px}
.kb-grid h4{margin:10px 0 4px;font-size:12px;color:var(--ink-2)}
.kb{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.kb kbd{font:11.5px Consolas,monospace;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.sw.acc.on{outline:2px solid var(--ink);outline-offset:2px}
.lgtab{width:100%;border-collapse:collapse;font-size:12px}
.lgtab th,.lgtab td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.lgtab th{position:sticky;top:0;background:var(--panel);color:var(--ink-2);font-weight:600}
button.icon.on{background:var(--accent-soft);color:var(--ink)}

/* ---------- fase 4 ---------- */
.brand{cursor:pointer;border-radius:6px;padding:4px}
.brand:hover{background:var(--panel-2)}
.split{display:inline-flex;margin-left:4px}
.split .primary{margin-left:0!important;border-radius:var(--r) 0 0 var(--r)}
.split .caret{border-radius:0 var(--r) var(--r) 0;padding:5px 6px!important;border-left:1px solid color-mix(in srgb,var(--accent-ink) 30%,transparent)!important}
.split .caret svg{display:block}
.seg.wrap{flex-wrap:wrap}
.lam-cv{position:relative}
.lam-badges{position:absolute;top:4px;right:6px;display:flex;gap:3px}
.bdg{display:grid;place-items:center;min-width:20px;height:20px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.bdg.done{background:#2b9348;color:#fff;padding:0 5px}
.bdg.lock{background:var(--ink);color:var(--panel)}
.bdg.lock svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
.lam.is-locked canvas{filter:saturate(.6)}
.btn.on-ok{background:color-mix(in srgb,#2b9348 18%,transparent);border-color:#2b9348;color:var(--ink)}
fieldset.lockfs{border:0;margin:0;padding:0;min-width:0}
fieldset.lockfs[disabled] .sect{opacity:.55}
.lock-note{display:flex;align-items:center;gap:8px;font-weight:600}
.lock-note svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.lock-note .btn{margin-left:auto}
.lock-banner{position:absolute;top:28px;left:50%;transform:translateX(-50%);z-index:4;background:var(--ink);color:var(--panel);padding:5px 6px 5px 12px;border-radius:18px;display:flex;align-items:center;gap:8px;font-size:12.5px;box-shadow:var(--shadow)}
.lock-banner button{border:0;border-radius:12px;padding:3px 10px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:12px}
#app.focus{grid-template-columns:44px 0 1fr 0}
#app.focus #leftPanel,#app.focus #rightPanel{display:none}
/* inicio */
.home{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto}
.home-in{max-width:1180px;margin:0 auto;padding:22px 28px 40px}
.home-head{display:flex;align-items:center;gap:12px;color:var(--accent);margin-bottom:22px}
.home-head h1{margin:0;font-size:22px;color:var(--ink);font-weight:650;letter-spacing:-.01em}
.home-grid{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
.home-side{display:flex;flex-direction:column;gap:8px;position:sticky;top:0}
.hbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;cursor:pointer}
.hbtn b{font-size:14px}
.hbtn span{font-size:12px;color:var(--ink-3)}
.hbtn:hover{border-color:var(--accent)}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hbtn.primary span{color:inherit;opacity:.82}
.home-presets{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.home-presets .chip{font-size:12px;padding:3px 9px}
.home-cur{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.home-rh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.home-rh h2{margin:0;font-size:16px;font-weight:650}
.home-rh input{max-width:260px;margin-left:auto}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.rec{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.rec:hover,.rec:focus-visible{border-color:var(--accent);outline:none}
.rec.cur{box-shadow:0 0 0 2px var(--accent)}
.rec-thumb{height:132px;flex:none;background:var(--desk);display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
.rec-thumb img{max-width:100%;max-height:112px;object-fit:contain;box-shadow:0 1px 5px rgba(0,0,0,.25);background:#fff}
.rec-meta{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rec-meta b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-meta .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:12px;border:0;background:rgba(20,26,35,.7);color:#fff;cursor:pointer;opacity:0;font-size:15px;line-height:1}
.rec:hover .rec-x{opacity:1}
@media (max-width:760px){.home-grid{grid-template-columns:1fr}.home-side{position:static}}
/* presentación */
#present{position:fixed;inset:0;z-index:70;background:#000;cursor:none}
#present.show-ui{cursor:default}
#present canvas{position:absolute;inset:0}
.pr-bar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(18,22,28,.86);color:#e8ecf2;padding:6px 8px;border-radius:24px;opacity:0;transition:opacity .25s;font-size:13px;white-space:nowrap}
#present.show-ui .pr-bar{opacity:1}
.pr-bar button{border:0;background:rgba(255,255,255,.1);color:inherit;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
.pr-bar button[data-p=prev],.pr-bar button[data-p=next]{font-size:20px;line-height:1;padding:2px 12px 5px}
.pr-bar button:hover{background:rgba(255,255,255,.22)}
.pr-info{padding:0 6px;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
.pr-ok{color:#7bd88f}
.pr-tg{display:flex;align-items:center;gap:4px;color:#c9d0da;cursor:pointer}
.pr-grid{position:absolute;inset:40px 40px 90px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;align-content:start;background:rgba(10,12,16,.92);padding:20px;border-radius:12px}
.pr-grid button{background:transparent;border:2px solid transparent;border-radius:8px;color:#dfe5ee;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px}
.pr-grid button.on,.pr-grid button:hover{border-color:var(--accent)}
.pr-grid img{max-width:100%;background:#fff}
@media (prefers-reduced-motion:reduce){.pr-bar{transition:none}}

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" data-cmd="home" title="Inicio: recientes, nuevo, abrir, cerrar proyecto" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="4" width="15" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="6" y="2" width="15" height="16" rx="1.5" fill="var(--panel)" stroke="currentColor" stroke-width="1.6"/><path d="M13 13h6v4h-6z" fill="currentColor" opacity=".55"/></svg>
    </div>
    <input id="projectName" class="project-name" value="Proyecto sin nombre" spellcheck="false" title="Nombre del proyecto">
    <nav class="menu">
      <button data-cmd="home" title="Inicio: recientes, nuevo, abrir y cerrar proyecto">Inicio</button>
      <button data-cmd="new" title="Nuevo proyecto">Nuevo</button>
      <button data-cmd="open" title="Abrir proyecto (Ctrl+O)">Abrir</button>
      <button data-cmd="save" title="Guardar en el mismo archivo (Ctrl+S)">Guardar</button>
      <button data-cmd="saveAs" title="Guardar como (Ctrl+Shift+S)">Guardar como</button>
      <span class="sep"></span>
      <button data-cmd="import" title="Insertar imágenes (también puedes arrastrarlas o pegarlas)">Insertar imagen</button>
      <button data-cmd="cajetin" title="Insertar o guardar cajetín">Cajetín</button>
      <span class="split"><button data-cmd="export" class="primary" title="Exportar PDF, PowerPoint, PNG, JPG, WebP, TIFF o SVG (Ctrl+E)">Exportar</button><button data-cmd="exportMenu" class="primary caret" title="Exportar directo con un perfil (Ctrl+Mayús+E)"><svg viewBox="0 0 24 24" width="14" height="14"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></span>
    </nav>
    <div class="spacer"></div>
    <div class="iconrow">
      <button class="icon" data-cmd="undo" title="Deshacer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="icon" data-cmd="redo" title="Rehacer (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <span class="sep"></span>
      <button class="icon" data-cmd="zoomOut" title="Alejar (Ctrl+-)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zoomLabel" class="zoom-label" data-cmd="zoomFit" title="Ajustar a la ventana (Ctrl+0)">100%</button>
      <button class="icon" data-cmd="zoomIn" title="Acercar (Ctrl++)"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      <span class="sep"></span>
      <button class="icon" data-cmd="present" title="Presentación (F5 · Mayús+F5 desde esta lámina)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8M10.5 8.5v4l3.5-2z"/></svg></button>
      <button class="icon" data-cmd="fullscreen" title="Pantalla completa (Ctrl+Mayús+F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      <button class="icon" data-cmd="focus" title="Modo enfoque: ocultar paneles (Tab)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M8 4v16M16 4v16" stroke-dasharray="2 2"/></svg></button>
      <span class="sep"></span>
      <button class="icon" data-cmd="notes" title="Notas (N)"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8 11h8M8 15h8M8 19h5"/></svg></button>
      <button class="icon" data-cmd="shortcuts" title="Atajos de teclado (F1)"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
      <button class="icon" data-cmd="settings" title="Configuración: tema, color de acento, unidades"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <aside id="tools" aria-label="Herramientas">
    <button class="tool active" data-tool="select" title="Seleccionar y mover (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
    <button class="tool" data-tool="hand" title="Mano: desplazar la vista (H o mantener Espacio)"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-6.5a1.5 1.5 0 0 1 3 0V11m0-5a1.5 1.5 0 0 1 3 0v6m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.9-2.6L5 14.5a1.5 1.5 0 0 1 2.4-1.8L8 13.5"/></svg></button>
    <span class="tsep"></span>
    <button class="tool" data-tool="text" title="Texto (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <button class="tool" data-tool="rect" title="Rectángulo (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button class="tool" data-tool="ellipse" title="Elipse (E)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
    <button class="tool" data-tool="line" title="Línea (L) · Mayús: ángulos de 15°"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg></button>
    <span class="tsep"></span>
    <button class="tool" data-cmd="import" title="Insertar imagen (I)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg></button>
    <button class="tool" data-cmd="crop" title="Recortar imagen en rectángulo (C o doble clic)"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg></button>
    <span class="tsep"></span>
    <button class="tool" data-tool="selRect" title="Selección rectangular sobre la imagen (M)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" stroke-dasharray="3 2.4"/></svg></button>
    <button class="tool" data-tool="selEllipse" title="Selección elíptica (J)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5" stroke-dasharray="3 2.4"/></svg></button>
    <button class="tool" data-tool="selPoly" title="Selección poligonal (P) · clic por vértice, clic en el primero o Intro para cerrar"><svg viewBox="0 0 24 24"><path d="M5 18 4 8l8-4 8 6-3 9z" stroke-dasharray="3 2.4"/><circle cx="4" cy="8" r="1.4" fill="currentColor"/><circle cx="12" cy="4" r="1.4" fill="currentColor"/><circle cx="20" cy="10" r="1.4" fill="currentColor"/></svg></button>
    <button class="tool" data-tool="selLasso" title="Lazo a mano alzada (Q)"><svg viewBox="0 0 24 24"><path d="M7 15c-3-1.5-4-4-2-6.5S12 4 16.5 5.5 21 11 18 13.5s-8 2.5-11 1.5z" stroke-dasharray="3 2.4"/><path d="M7 15c-1 2 0 4 2 4"/></svg></button>
    <button class="tool" data-tool="wand" title="Varita mágica: selecciona por color (W)"><svg viewBox="0 0 24 24"><path d="m4 20 11-11M15 4v2M19 8h2M18 5l1.5-1.5M13 3l.5 1M20 11l1 .5"/><path d="m14 7 3 3"/></svg></button>
    <button class="tool" data-tool="brush" title="Pincel de máscara: ocultar o restaurar partes (B · Alt invierte)"><svg viewBox="0 0 24 24"><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8 9.2 12z"/><path d="M9 12.5c-2.5 0-4 1.6-4 4 0 1.6-1 2.6-2 3 3 1 7.5.5 8.6-2.3"/></svg></button>
    <button class="tool" data-tool="eyedrop" title="Cuentagotas (K) · aplica el color a lo seleccionado y lo copia"><svg viewBox="0 0 24 24"><path d="m14 7 3 3M5 19l1-4 9.5-9.5a2.1 2.1 0 0 1 3 3L9 18z"/><path d="M15 4l5 5"/></svg></button>
    <button class="tool" data-tool="zone" title="Zona de exportación (Z) · área que se exporta como archivo aparte"><svg viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M9 12h6M12 9v6"/></svg></button>
  </aside>

  <aside id="leftPanel">
    <div class="panel-head lp-tabs">
      <button type="button" class="lp-tab on" data-lt="laminas">Láminas</button>
      <button type="button" class="lp-tab" data-lt="favs">Favoritos</button>
      <span style="flex:1"></span>
      <button class="icon small" data-cmd="addLamina" id="lpAdd" title="Agregar lámina"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div id="laminaList" class="lamina-list"></div>
    <div id="favPanel" class="fav-panel" hidden>
      <input type="text" id="favQ" placeholder="Buscar nombre o etiqueta">
      <div id="favTags" class="fav-tags"></div>
      <div id="favList" class="fav-list"></div>
    </div>
  </aside>

  <main id="stage">
    <canvas id="rulerCorner" class="ruler-corner" title="Clic: cambiar unidades"></canvas>
    <canvas id="rulerTop" class="ruler ruler-top" title="Arrastra hacia la lámina para crear una guía horizontal"></canvas>
    <canvas id="rulerLeft" class="ruler ruler-left" title="Arrastra hacia la lámina para crear una guía vertical"></canvas>
    <div id="lockBanner" class="lock-banner" hidden><svg viewBox="0 0 24 24" width="15" height="15"><rect x="5" y="11" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg> Lámina bloqueada <button type="button" data-cmd="unlockLam">Desbloquear</button></div>
    <div id="viewport">
      <canvas id="canvas"></canvas>
      <textarea id="textEditor" spellcheck="false" hidden></textarea>
      <div id="dropHint" hidden><div>Suelta las imágenes para insertarlas en la lámina</div></div>
    </div>
  </main>

  <aside id="rightPanel">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="props">Propiedades</button>
      <button class="tab" data-tab="layers">Capas</button>
      <button class="tab" data-tab="colors">Colores</button>
      <button class="tab" data-tab="history">Historial</button>
    </div>
    <div id="tab-props" class="tab-body"></div>
    <div id="tab-layers" class="tab-body" hidden>
      <div id="layerList" class="layer-list"></div>
    </div>
    <div id="tab-colors" class="tab-body" hidden></div>
    <div id="tab-history" class="tab-body" hidden>
      <div id="historyList" class="history-list"></div>
    </div>
  </aside>

  <footer id="statusbar">
    <span id="stCursor">x — · y —</span>
    <span id="stSel"></span>
    <span id="lamProgress" class="hint"></span>
    <span class="spacer"></span>
    <label class="toggle" title="Ajuste magnético (mantén Ctrl al arrastrar para desactivarlo un momento)"><input type="checkbox" id="snapToggle" checked> Imán</label>
    <label class="toggle"><input type="checkbox" id="gridToggle"> Cuadrícula</label>
    <label class="toggle"><input type="checkbox" id="guidesToggle" checked> Guías</label>
    <label class="toggle"><input type="checkbox" id="marginsToggle" checked> Márgenes</label>
    <span id="stSave" class="save-state"></span>
  </footer>
</div>

<div id="menuCtx" class="ctxmenu" hidden></div>
<div id="home" class="home" hidden>
  <div class="home-in">
    <header class="home-head">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="3" y="4" width="15" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="6" y="2" width="15" height="16" rx="1.5" fill="var(--panel)" stroke="currentColor" stroke-width="1.6"/><path d="M13 13h6v4h-6z" fill="currentColor" opacity=".55"/></svg>
      <h1>Editor de Láminas</h1><span style="flex:1"></span>
      <button type="button" class="btn home-close" title="Volver al proyecto (Esc)">Volver al proyecto</button>
    </header>
    <div class="home-grid">
      <aside class="home-side">
        <button type="button" class="hbtn primary" data-h="new"><b>Nuevo proyecto…</b><span>Nombre, tamaño de hoja y número de láminas</span></button>
        <div class="hint" style="margin:10px 0 4px">Empezar rápido con:</div>
        <div id="homePresets" class="home-presets"></div>
        <button type="button" class="hbtn" data-h="open"><b>Abrir proyecto…</b><span>.laminas.json o .laminas.zip · también puedes arrastrarlo aquí</span></button>
        <div id="homeCur"></div>
      </aside>
      <section class="home-main">
        <div class="home-rh"><h2>Recientes</h2><input type="text" id="homeQ" placeholder="Buscar proyecto"></div>
        <div id="homeRecents" class="rec-grid"></div>
        <p class="hint" style="margin-top:14px">Cada proyecto reciente guarda una copia en este navegador. Si el proyecto tiene archivo, se abre el archivo y Guardar escribe sobre él.</p>
      </section>
    </div>
  </div>
</div>
<div id="present" hidden>
  <canvas></canvas>
  <div class="pr-bar">
    <button type="button" data-p="prev" title="Anterior (←)">‹</button>
    <span class="pr-info"></span>
    <button type="button" data-p="next" title="Siguiente (→)">›</button>
    <label class="pr-tg"><input type="checkbox" class="pr-done"> Solo terminadas</label>
    <button type="button" data-p="grid" title="Ver todas (G)">Láminas</button>
    <button type="button" data-p="exit" title="Salir (Esc)">Salir</button>
  </div>
  <div class="pr-grid" hidden></div>
</div>
<div id="notesWin" class="notes-win" hidden>
  <div class="nw-head"><b>Notas</b><span class="nw-sum hint"></span><span style="flex:1"></span><button type="button" class="btn nw-add">Nueva nota</button><button type="button" class="icon small nw-close" title="Cerrar (N)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="nw-tabs seg"></div>
  <input type="text" class="nw-q" placeholder="Buscar en las notas">
  <div class="nw-list"></div>
</div>
<div id="toasts"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<input type="file" id="fileImages" accept="image/*" multiple hidden>

<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2" multiple hidden>

<script>
'use strict';
/* =====================================================================
   Editor de Láminas — Fase 1
   Núcleo: utilidades, modelo de proyecto, recursos, historial, autoguardado
   ===================================================================== */

const APP_FORMAT = 'editor-laminas';
const APP_VERSION = 1;
const PX_PER_MM_SCREEN = 96 / 25.4;
const PT_TO_MM = 25.4 / 72;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = (p = 'e') => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const deep = o => JSON.parse(JSON.stringify(o));
const round = (v, d = 2) => { const f = 10 ** d; return Math.round(v * f) / f; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const deg2rad = d => d * Math.PI / 180;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const fmtBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const todayStr = () => { const d = new Date(); return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' }); };

/* ---------- tamaños de hoja (mm, vertical) ---------- */
const SHEETS = [
  { id: 'carta', name: 'Carta', w: 215.9, h: 279.4 },
  { id: 'oficio', name: 'Oficio', w: 215.9, h: 340.4 },
  { id: 'tabloide', name: 'Tabloide (doble carta)', w: 279.4, h: 431.8 },
  { id: 'a4', name: 'A4', w: 210, h: 297 },
  { id: 'a3', name: 'A3', w: 297, h: 420 },
  { id: 'a2', name: 'A2', w: 420, h: 594 },
  { id: 'a1', name: 'A1', w: 594, h: 841 },
  { id: 'a0', name: 'A0', w: 841, h: 1189 },
  { id: '60x90', name: '60 × 90 cm', w: 600, h: 900 },
  { id: '90x120', name: '90 × 120 cm', w: 900, h: 1200 },
];
function sheetPresetOf(w, h) {
  for (const s of SHEETS) {
    if ((Math.abs(s.w - w) < 0.6 && Math.abs(s.h - h) < 0.6) || (Math.abs(s.w - h) < 0.6 && Math.abs(s.h - w) < 0.6)) return s.id;
  }
  return 'custom';
}

/* ---------- estado global ---------- */
const S = {
  project: null,
  assets: new Map(),      // id -> {id, kind, name, mime, blob, w, h, full, preview, pscale}
  curId: null,
  sel: [],
  view: { zoom: 1, panX: 0, panY: 0 },
  tool: 'select',
  fileHandle: null,
  fileName: null,
  dirty: false,           // cambios respecto al archivo guardado
  clipboard: null,
  hist: [], histIdx: -1,
  editingText: null,
  cropping: null,
};

function defaultSettings() {
  return {
    units: 'mm',            // mm | cm
    importDpi: 150,         // tamaño inicial de imágenes insertadas
    historyLimit: 50,
    grid: { size: 10, sub: 2, color: '#5b8def', show: false, snap: false },
    snap: true, showGuides: true, showMargins: true,
    defaultSheet: { w: 420, h: 297 },
  };
}
function newLamina(n = 1, w = 420, h = 297) {
  return {
    id: uid('l'), name: 'Lámina ' + n, w, h, bg: '#ffffff',
    margin: { t: 10, r: 10, b: 10, l: 10 },
    guides: { v: [], h: [] },
    elements: [],
    versions: [],
    locked: false, done: false,
  };
}
function newProject(name = 'Proyecto sin nombre') {
  const st = defaultSettings();
  return {
    format: APP_FORMAT, version: APP_VERSION, name,
    created: new Date().toISOString(),
    settings: st,
    laminas: [newLamina(1, st.defaultSheet.w, st.defaultSheet.h)],
    cajetines: [],
    fonts: [],              // [{assetId, family}]
    palettes: [],           // [{id, name, colors:[hex]}]
  };
}

/* ---------- acceso ---------- */
const lam = () => S.project.laminas.find(l => l.id === S.curId) || S.project.laminas[0];
const lamIndex = (l = lam()) => S.project.laminas.indexOf(l);
const elById = (id, l = lam()) => l.elements.find(e => e.id === id);
const selEls = () => S.sel.map(id => elById(id)).filter(Boolean);
const settings = () => S.project.settings;

/* ---------- unidades ---------- */
const U = {
  get f() { return settings().units === 'cm' ? 10 : 1; },
  get name() { return settings().units; },
  to(mm) { return round(mm / this.f, this.f === 10 ? 3 : 2); },
  from(v) { return Number(v) * this.f; },
};

/* ---------- geometría ---------- */
function elCenter(e) { return { x: e.x + e.w / 2, y: e.y + e.h / 2 }; }
function rotPt(p, c, rad) {
  const s = Math.sin(rad), co = Math.cos(rad), dx = p.x - c.x, dy = p.y - c.y;
  return { x: c.x + dx * co - dy * s, y: c.y + dx * s + dy * co };
}
function elCorners(e) {
  const c = elCenter(e), r = deg2rad(e.rot || 0);
  if (e.type === 'image' && typeof hasPersp === 'function' && hasPersp(e)) {
    return localQuad(e).map(([x, y]) => { if (e.flipH) x = -x; if (e.flipV) y = -y; return rotPt({ x: c.x + x, y: c.y + y }, c, r); });
  }
  return [
    { x: e.x, y: e.y }, { x: e.x + e.w, y: e.y }, { x: e.x + e.w, y: e.y + e.h }, { x: e.x, y: e.y + e.h },
  ].map(p => rotPt(p, c, r));
}
function elAABB(e) {
  if (e.type === 'line') {
    const [a, b] = lineEnds(e);
    return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) };
  }
  const pts = elCorners(e);
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x = Math.min(...xs), y = Math.min(...ys);
  return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
}
function unionBox(boxes) {
  if (!boxes.length) return null;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const b of boxes) { x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h); }
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}
function lineEnds(e) {
  const c = elCenter(e), r = deg2rad(e.rot || 0);
  return [rotPt({ x: e.x, y: c.y }, c, r), rotPt({ x: e.x + e.w, y: c.y }, c, r)];
}
function setLineEnds(e, a, b) {
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  e.w = Math.max(len, 0.01); e.h = 0;
  e.x = cx - e.w / 2; e.y = cy;
  e.rot = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}
function toLocal(e, p) {
  const c = elCenter(e);
  const q = rotPt(p, c, -deg2rad(e.rot || 0));
  return { x: q.x - c.x, y: q.y - c.y };
}

/* ---------- recursos (imágenes y fuentes) ---------- */
async function hashBlob(blob) {
  try {
    const buf = await blob.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);
    return 'a' + Array.from(new Uint8Array(h).slice(0, 10)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return uid('a'); }
}
async function decodeImageAsset(a) {
  let bmp;
  try { bmp = await createImageBitmap(a.blob); }
  catch {
    bmp = await new Promise((res, rej) => {
      const im = new Image(); const u = URL.createObjectURL(a.blob);
      im.onload = () => { URL.revokeObjectURL(u); res(im); };
      im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('No se pudo leer la imagen')); };
      im.src = u;
    });
  }
  a.full = bmp; a.w = bmp.width; a.h = bmp.height;
  const MAXP = 2048, m = Math.max(a.w, a.h);
  if (m > MAXP) {
    const s = MAXP / m;
    const c = document.createElement('canvas');
    c.width = Math.round(a.w * s); c.height = Math.round(a.h * s);
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(bmp, 0, 0, c.width, c.height);
    a.preview = c; a.pscale = s;
  } else { a.preview = bmp; a.pscale = 1; }
  return a;
}
async function addImageBlob(blob, name) {
  const id = await hashBlob(blob);
  if (S.assets.has(id)) return S.assets.get(id);
  const a = { id, kind: 'image', name: name || 'imagen', mime: blob.type || 'image/png', blob };
  await decodeImageAsset(a);
  S.assets.set(id, a);
  return a;
}
async function addFontBlob(blob, fileName) {
  const id = await hashBlob(blob);
  let family = fileName.replace(/\.(ttf|otf|woff2?|)$/i, '').replace(/[_-]+/g, ' ').trim() || 'Fuente';
  const existing = S.project.fonts.find(f => f.assetId === id);
  if (existing) return existing.family;
  const a = { id, kind: 'font', name: fileName, mime: blob.type || 'font/ttf', blob };
  await registerFont(a, family);
  S.assets.set(id, a);
  S.project.fonts.push({ assetId: id, family });
  return family;
}
async function registerFont(a, family) {
  const buf = await a.blob.arrayBuffer();
  const ff = new FontFace(family, buf);
  await ff.load();
  document.fonts.add(ff);
  a.family = family;
}

/* ---------- historial (deshacer / rehacer) ---------- */
function snapState() {
  return JSON.stringify({ laminas: S.project.laminas, cajetines: S.project.cajetines, fonts: S.project.fonts, palettes: S.project.palettes || [] });
}
function histReset(label = 'Abrir proyecto') {
  S.hist = [{ label, snap: snapState(), curId: S.curId, sel: [] }];
  S.histIdx = 0;
  UI.history();
}
function commit(label) {
  const snap = snapState();
  const top = S.hist[S.histIdx];
  if (top && top.snap === snap) return;
  const bad = top && lockViolation(top.snap);
  if (bad) {
    const st = JSON.parse(top.snap);
    S.project.laminas = st.laminas; S.project.cajetines = st.cajetines; S.project.fonts = st.fonts || []; S.project.palettes = st.palettes || [];
    const ids = new Set(lam().elements.map(e => e.id)); S.sel = S.sel.filter(id => ids.has(id));
    toast(`“${bad.name}” está bloqueada: el cambio se deshizo. Desbloquéala para editarla.`, 'warn', 3600);
    UI.all(); return;
  }
  S.hist = S.hist.slice(0, S.histIdx + 1);
  S.hist.push({ label, snap, curId: S.curId, sel: S.sel.slice() });
  const lim = Math.max(5, settings().historyLimit | 0);
  while (S.hist.length > lim + 1) S.hist.shift();
  S.histIdx = S.hist.length - 1;
  markChanged();
  UI.history();
}
function histGo(i) {
  if (i < 0 || i >= S.hist.length || i === S.histIdx) return;
  const h = S.hist[i];
  const st = JSON.parse(h.snap);
  S.project.laminas = st.laminas; S.project.cajetines = st.cajetines; S.project.fonts = st.fonts || []; S.project.palettes = st.palettes || [];
  S.histIdx = i;
  if (!S.project.laminas.find(l => l.id === S.curId)) S.curId = h.curId && S.project.laminas.find(l => l.id === h.curId) ? h.curId : S.project.laminas[0].id;
  const ids = new Set(lam().elements.map(e => e.id));
  S.sel = S.sel.filter(id => ids.has(id));
  if (Pix.sel && !elById(Pix.sel.elId)) Pix.clear(true);
  markChanged();
  UI.all();
}
const undo = () => { if (S.histIdx > 0) { histGo(S.histIdx - 1); toast('Deshacer: ' + S.hist[S.histIdx + 1].label); } };
const redo = () => { if (S.histIdx < S.hist.length - 1) { histGo(S.histIdx + 1); toast('Rehacer: ' + S.hist[S.histIdx].label); } };

/* ---------- cambios / autoguardado ---------- */
function markChanged() {
  S.dirty = true;
  Store.schedule();
  R.dirtyThumbs.add(S.curId);
  R.request();
  UI.saveState();
  UI.thumbs();
}

const Store = {
  db: null, saved: new Set(), timer: null, busy: false, lastAt: null,
  open() {
    return new Promise((res) => {
      if (!('indexedDB' in window)) return res(null);
      let req;
      try { req = indexedDB.open('editor-laminas', 3); } catch { return res(null); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('assets')) db.createObjectStore('assets');
        if (!db.objectStoreNames.contains('favs')) db.createObjectStore('favs');
        if (!db.objectStoreNames.contains('recents')) db.createObjectStore('recents');
      };
      req.onsuccess = () => { this.db = req.result; res(this.db); };
      req.onerror = () => res(null);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return res(null);
      const t = this.db.transaction(store, mode); const os = t.objectStore(store);
      let out; const r = fn(os); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(store, key) { return this.tx(store, 'readonly', os => os.get(key)); },
  put(store, key, val) { return this.tx(store, 'readwrite', os => os.put(val, key)); },
  del(store, key) { return this.tx(store, 'readwrite', os => os.delete(key)); },
  clear(store) { return this.tx(store, 'readwrite', os => os.clear()); },
  keys(store) { return this.tx(store, 'readonly', os => os.getAllKeys()); },
  getAll(store) { return this.tx(store, 'readonly', os => os.getAll()); },
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.save(), 1200); UI.saveState('pending'); },
  async save() {
    if (!this.db || !S.project || S.closed) return;
    if (this.busy) { this.schedule(); return; }
    this.busy = true;
    try {
      for (const [id, a] of S.assets) {
        if (this.saved.has(id)) continue;
        await this.put('assets', id, { id, kind: a.kind, name: a.name, mime: a.mime, blob: a.blob, family: a.family || null });
        this.saved.add(id);
      }
      await this.put('kv', 'autosave', {
        project: JSON.stringify(S.project), curId: S.curId, savedAt: Date.now(),
        fileName: S.fileName, dirty: S.dirty, handle: S.fileHandle || null,
      }).catch(async err => {
        // algunos navegadores no guardan el acceso al archivo: se guarda sin él
        await this.put('kv', 'autosave', { project: JSON.stringify(S.project), curId: S.curId, savedAt: Date.now(), fileName: S.fileName, dirty: S.dirty });
      });
      this.lastAt = new Date();
      UI.saveState();
    } catch (err) {
      console.error(err);
      UI.saveState('error');
      if (!this._warned) { this._warned = true; toast('No se pudo hacer el autoguardado en el navegador. Guarda el proyecto en un archivo para no perder cambios.', 'error', 7000); }
    } finally { this.busy = false; }
  },
  async resetAssets() { this.saved.clear(); await this.clear('assets'); },
  async load() {
    const rec = await this.get('kv', 'autosave');
    if (!rec) return null;
    const project = JSON.parse(rec.project);
    const needed = new Set();
    for (const l of project.laminas) { for (const e of l.elements) { if (e.assetId) needed.add(e.assetId); if (e.maskId) needed.add(e.maskId); } for (const v of l.versions || []) needed.add(v.assetId); }
    for (const c of project.cajetines || []) for (const e of c.elements) if (e.assetId) needed.add(e.assetId);
    for (const f of project.fonts || []) needed.add(f.assetId);
    const assets = new Map();
    for (const id of needed) {
      const a = await this.get('assets', id);
      if (a) assets.set(id, a);
    }
    return { rec, project, assets };
  },
};

/* ---------- migración / validación de proyectos ---------- */
function normalizeProject(p) {
  if (!p || !Array.isArray(p.laminas)) throw new Error('El archivo no es un proyecto válido del Editor de Láminas.');
  const d = defaultSettings();
  p.format = APP_FORMAT;
  p.settings = Object.assign(d, p.settings || {});
  p.settings.grid = Object.assign(defaultSettings().grid, p.settings.grid || {});
  p.cajetines = p.cajetines || [];
  p.fonts = p.fonts || [];
  p.palettes = p.palettes || [];
  p.notes = p.notes || [];
  p.id = p.id || uid('p');
  if (!p.laminas.length) p.laminas.push(newLamina(1));
  for (const l of p.laminas) {
    l.id = l.id || uid('l');
    l.margin = Object.assign({ t: 10, r: 10, b: 10, l: 10 }, l.margin || {});
    l.guides = Object.assign({ v: [], h: [] }, l.guides || {});
    l.versions = l.versions || [];
    l.locked = !!l.locked; l.done = !!l.done;
    l.elements = (l.elements || []).map(normalizeEl);
  }
  return p;
}
function normalizeEl(e) {
  const base = { id: uid(), name: '', x: 0, y: 0, w: 10, h: 10, rot: 0, flipH: false, flipV: false, opacity: 1, visible: true, locked: false, groupId: null };
  return Object.assign(base, e);
}

/* ---------- avisos ---------- */
function toast(msg, kind = '', ms = 2600) {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .25s'; setTimeout(() => t.remove(), 260); }, ms);
}

/* =====================================================================
   Render: lienzo, elementos, texto, reglas, miniaturas
   ===================================================================== */

const R = {
  cv: null, ctx: null, dpr: 1, W: 0, H: 0, raf: 0,
  dirtyThumbs: new Set(),
  snapLines: [], marquee: null, hoverId: null, hoverGuide: null, draft: null, rulerGuide: null,
  cursorMM: null,
  init() {
    this.cv = $('#canvas'); this.ctx = this.cv.getContext('2d');
    this.rt = $('#rulerTop'); this.rl = $('#rulerLeft'); this.rc = $('#rulerCorner');
    new ResizeObserver(() => this.resize()).observe($('#viewport'));
    this.resize();
  },
  resize() {
    const vp = $('#viewport').getBoundingClientRect();
    this.dpr = window.devicePixelRatio || 1;
    this.W = vp.width; this.H = vp.height;
    for (const [c, w, h] of [[this.cv, vp.width, vp.height], [this.rt, vp.width, 20], [this.rl, 20, vp.height], [this.rc, 20, 20]]) {
      c.width = Math.max(1, Math.round(w * this.dpr)); c.height = Math.max(1, Math.round(h * this.dpr));
      c.style.width = w + 'px'; c.style.height = h + 'px';
    }
    if (this.rt) { this.rt.style.width = ''; this.rl.style.height = ''; }
    this.request();
  },
  get k() { return S.view.zoom * PX_PER_MM_SCREEN; },
  w2s(x, y) { return { x: S.view.panX + x * this.k, y: S.view.panY + y * this.k }; },
  s2w(x, y) { return { x: (x - S.view.panX) / this.k, y: (y - S.view.panY) / this.k }; },
  request() { if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.draw(); }); },

  draw() {
    if (!S.project) return;
    const { ctx, dpr } = this, l = lam(), k = this.k, st = settings();
    const css = getComputedStyle(document.documentElement);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = css.getPropertyValue('--desk').trim() || '#cfd5de';
    ctx.fillRect(0, 0, this.cv.width, this.cv.height);

    const o = this.w2s(0, 0);
    // sombra de la hoja
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.shadowColor = 'rgba(10,20,35,.28)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#fff';
    ctx.fillRect(o.x, o.y, l.w * k, l.h * k);
    ctx.restore();

    // espacio en mm
    ctx.save();
    ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * o.x, dpr * o.y);
    if (!l.bg) drawChecker(ctx, l.w, l.h, 4 / S.view.zoom);
    else { ctx.fillStyle = l.bg; ctx.fillRect(0, 0, l.w, l.h); }
    // elementos fuera de la hoja (tenues)
    const info = tokenInfo(l);
    ctx.save(); ctx.globalAlpha = 0.28;
    renderElements(ctx, l, dpr * k, { preview: true, skipId: S.editingText, info, outsideOnly: true });
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, l.w, l.h); ctx.clip();
    renderElements(ctx, l, dpr * k, { preview: true, skipId: S.editingText, info });
    Pix.drawOverlay(ctx, dpr * k);
    if (st.grid.show) drawGrid(ctx, l, k);
    ctx.restore();
    if (st.showMargins) {
      const m = l.margin;
      ctx.strokeStyle = 'rgba(214,64,140,.55)'; ctx.lineWidth = 1 / k; ctx.setLineDash([4 / k, 3 / k]);
      ctx.strokeRect(m.l, m.t, l.w - m.l - m.r, l.h - m.t - m.b);
      ctx.setLineDash([]);
    }
    ctx.restore();

    // ---- capa de interfaz (px de pantalla) ----
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cr = el.crop || { x: 0, y: 0, w: a.w, h: a.h };
    let w, h;
    if (mode === 'native') { w = cr.w / settings().importDpi * 25.4; h = cr.h / settings().importDpi * 25.4; }
    else {
      const box = mode === 'fitMargins' ? { x: m.l, y: m.t, w: l.w - m.l - m.r, h: l.h - m.t - m.b } : { x: 0, y: 0, w: l.w, h: l.h };
      const sw = mode === 'fill' ? Math.max(box.w / cr.w, box.h / cr.h) : Math.min(box.w / cr.w, box.h / cr.h);
      w = cr.w * sw; h = cr.h * sw; el.rot = 0;
      el.x = box.x + box.w / 2 - w / 2; el.y = box.y + box.h / 2 - h / 2; el.w = w; el.h = h;
      commit(mode === 'fill' ? 'Llenar lámina' : 'Ajustar a márgenes'); UI.props(); return;
    }
    el.w = w; el.h = h; el.x = c.x - w / 2; el.y = c.y - h / 2;
    commit('Tamaño original'); UI.props();
  },
  applyCrop(el, nc, label = 'Recortar imagen') {
    const a = S.assets.get(el.assetId); if (!a) return;
    const oc = el.crop || { x: 0, y: 0, w: a.w, h: a.h };
    const sx = el.w / oc.w, sy = el.h / oc.h;
    let vx = ((nc.x + nc.w / 2) - (oc.x + oc.w / 2)) * sx;
    let vy = ((nc.y + nc.h / 2) - (oc.y + oc.h / 2)) * sy;

  dupLamina(id = S.curId) {

    const c = deep(src); c.id = uid('l'); c.name = src.name + ' (copia)';
    const gmap = new Map();
    c.elements.forEach(e => { e.id = uid(); if (e.groupId) { if (!gmap.has(e.groupId)) gmap.set(e.groupId, uid('g')); e.groupId = gmap.get(e.groupId); } });

        const a = ev.target.closest('button')?.dataset.a;
        if (a === 'lock') { e.locked = !e.locked; commit(e.locked ? 'Bloquear' : 'Desbloquear'); UI.layers(); R.request(); return; }

        if (ev.shiftKey || ev.ctrlKey || ev.metaKey) S.sel = S.sel.includes(e.id) ? S.sel.filter(x => x !== e.id) : [...S.sel, e.id];
        else S.sel = [e.id];
        UI.selChanged();
      });
      row.addEventListener('dblclick', ev => {
        if (ev.target.closest('button')) return;
        const span = $('.lname', row); const inp = document.createElement('input'); inp.type = 'text'; inp.value = elDisplayName(e);
        span.replaceWith(inp); inp.focus(); inp.select();
        const done = ok => { if (ok && inp.value.trim() && inp.value !== e.name) { e.name = inp.value.trim(); commit('Renombrar'); } UI.layers(); };
        inp.addEventListener('keydown', k => { if (k.key === 'Enter') done(true); if (k.key === 'Escape') done(false); k.stopPropagation(); });
        inp.addEventListener('blur', () => done(true));
      });
      row.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/layer', e.id); ev.dataTransfer.effectAllowed = 'move'; });
      row.addEventListener('dragover', ev => {
        if (![...ev.dataTransfer.types].includes('text/layer')) return;
        ev.preventDefault(); const r = row.getBoundingClientRect(); const after = ev.clientY > r.top + r.height / 2;
        $$('.layer', box).forEach(x => x.classList.remove('drop-before', 'drop-after')); row.classList.add(after ? 'drop-after' : 'drop-before');
      });
      row.addEventListener('dragleave', () => row.classList.remove('drop-before', 'drop-after'));
      row.addEventListener('drop', ev => {
        const id = ev.dataTransfer.getData('text/layer'); if (!id || id === e.id) return; ev.preventDefault();
        const after = row.classList.contains('drop-after');
        const arr = l.elements; const from = arr.findIndex(x => x.id === id); const [m] = arr.splice(from, 1);
        let to = arr.findIndex(x => x.id === e.id);
        // la lista se muestra invertida: "arriba" en la lista = más adelante en el arreglo
        arr.splice(after ? to : to + 1, 0, m);

  /* ---------------- historial ---------------- */

  /* ---------------- propiedades ---------------- */
  syncGeom: debounce(() => UI.props(), 60),
  props() {
    if ($('#tab-props').hidden) return;
    if (I.drag && I.drag.type !== 'marquee') { /* durante el arrastre solo números */ return this.liveGeom(); }
    const sel = selEls(), box = $('#tab-props');

    else if (lam().locked) html += `<div class="sect"><div class="lock-note">${ICONS.lock} La lámina está bloqueada.<button class="btn" data-act="lam-lock" type="button">Desbloquear</button></div></div><fieldset class="lockfs" disabled>${this.elProps(sel)}</fieldset>`;
    else html += this.elProps(sel);
    box.innerHTML = html;
    if (focusKey) { const f = box.querySelector(`[data-f="${focusKey}"]`); if (f && f.type !== 'range') { f.focus(); try { f.select?.(); } catch { } } }
  },
  liveGeom() {
    const sel = selEls(); if (!sel.length) return;
    const g = this.geom(sel);
    for (const [k, v] of Object.entries(g)) { const f = $(`#tab-props [data-f="${k}"]`); if (f && document.activeElement !== f) f.value = v; }
  },
  geom(sel) {
    if (sel.length === 1) {
      const e = sel[0];
      if (e.type === 'line') { const [a] = lineEnds(e); return { lx: U.to(a.x), ly: U.to(a.y), len: U.to(e.w), ang: round(-e.rot, 2) }; }
      return { x: U.to(e.x), y: U.to(e.y), w: U.to(e.w), h: U.to(e.h), rot: round(e.rot || 0, 2) };
    }
    const b = unionBox(sel.map(elAABB));
    return { x: U.to(b.x), y: U.to(b.y), w: U.to(b.w), h: U.to(b.h) };
  },
  num(f, label, val, unit, extra = '') {

  },
  def(name, set, label, opts = {}) { this.fields[name] = { set, label, ...opts }; },

    def('gsize', v => { const o = g.size; g.size = Math.max(0.5, U.from(v)); Cfg.add('Cuadrícula', 'Separación (mm)', o, g.size); }, null);

    def('gcolor', (v, live) => { if (!live) Cfg.add('Cuadrícula', 'Color', g._c0 || g.color, v); else if (!g._c0) g._c0 = g.color; g.color = v; if (!live) delete g._c0; }, null, { live: true });

    const mEq = !this.splitMargins && l.margin.t === l.margin.r && l.margin.r === l.margin.b && l.margin.b === l.margin.l;

        <div class="row"><label class="lbl">Orientación</label><div class="seg"><button data-act="orient-v" class="${!landscape ? 'on' : ''}" type="button">Vertical</button><button data-act="orient-h" class="${landscape ? 'on' : ''}" type="button">Horizontal</button></div></div>
        <div class="row"><label class="lbl">Fondo</label><input type="color" data-f="bg" value="${l.bg || '#ffffff'}" ${l.bg ? '' : 'disabled'}><label class="toggle hint" style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-f="bgNone" ${l.bg ? '' : 'checked'}> Transparente</label></div>

      </div>
      </fieldset>
      ${UI.versionsSect(l)}
      <fieldset class="lockfs" ${lk ? 'disabled' : ''}>
      <div class="sect"><h4>Márgenes <span class="hint">guía visual, no se imprime</span></h4>
        ${mEq ? `<div class="row"><label class="lbl">Todos</label>${this.num('mall', '', U.to(l.margin.t), u)}<button class="btn ico" data-act="mSplit" title="Márgenes distintos por lado" type="button">${ICONS.chain}</button></div>`
        : `<div class="grid2">${this.num('mt', '↑', U.to(l.margin.t), u)}${this.num('mb', '↓', U.to(l.margin.b), u)}${this.num('ml', '←', U.to(l.margin.l), u)}${this.num('mr', '→', U.to(l.margin.r), u)}</div>`}
